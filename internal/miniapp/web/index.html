function home(){const d=S.discover,lead=d.featured?.[0],movies=d.movies||[],tv=d.tv||[],loadingPosters=Array(5).fill('<div class="poster skeleton"></div>').join('');return `<section class="home-intro"><h1>今晚看什么？</h1><p>先逛逛热门，也可以直接搜片名。</p></section>${homeDiscoverError()}${lead?`<button class="feature" onclick="openDetail(${id(lead)},'${type(lead)}')"><img src="${esc(img(lead.backdrop_path||lead.poster_path))}" alt="${esc(title(lead))}" onerror="this.remove()"><div class="feature-copy"><div class="kicker">本周主打</div><h2>${esc(title(lead))}</h2><p>${esc(lead.overview||'正在被更多人发现')}</p></div><span class="feature-play">${icons.play}</span></button>`:S.discoverLoading?`<div class="feature skeleton"></div>`:''}<form class="search" onsubmit="submitSearch(event)"><span class="search-icon">${icons.search}</span><input id="q" placeholder="搜电影、剧集、演员"><button>找片</button></form>${recentSection()}${movies.length||S.discoverLoading?`<section class="section"><div class="section-head"><h2>热门电影</h2><span>Trending now</span></div><div class="rail">${movies.length?movies.map(card).join(''):loadingPosters}</div></section>`:''}${dynamicSections()}${tv.length||S.discoverLoading?`<section class="section"><div class="section-head"><h2>热播剧集</h2><span>On air</span></div><div class="rail">${tv.length?tv.map(card).join(''):loadingPosters}</div></section>`:''}<section class="section"><div class="section-head"><h2>按口味找</h2><span>Explore</span></div><div class="chips">${['科幻','悬疑','喜剧','动画','犯罪','纪录片'].map(x=>`<button class="chip" onclick="quick('${x}')">${x}</button>`).join('')}</div></section>`}
let homeController=null;
async function loadHome(){homeController?.abort();const controller=new AbortController();homeController=controller;S.discoverLoading=true;S.discoverError='';S.discoverAuthError=false;if(S.view==='home')render();try{const d=await api('/api/miniapp/v1/discover',{signal:controller.signal});if(homeController!==controller)return;S.discover=d;localStorage.setItem('yunhai_discover_cache',JSON.stringify(d))}catch(e){if(e?.name==='AbortError'||homeController!==controller)return;S.discoverError=e.message||'网络连接不稳定，请稍后再试';S.discoverAuthError=e.status===401||e.status===403}finally{if(homeController===controller){homeController=null;S.discoverLoading=false;if(S.view==='home')render()}}}

· 扣生命'}</button><button class="quest-tool" onclick="quitAdventure(false)">退出本局</button></div></section>`}
function wishesPage(){if(S.toolLoading)return toolShell('许愿池','云海还在找',`<div class="poster skeleton" style="height:96px;aspect-ratio:auto"></div>`);if(S.toolError)return toolShell('许愿池','记录暂时没加载出来',`<div class="empty"><strong>${esc(S.toolError)}</strong><button class="primary" onclick="goWishes()">重新加载</button></div>`);const rows=S.wishes.map(w=>`<button class="compact-row" onclick="openDetail(${w.tmdb_id},'${w.media_type}',${Number(w.season)||0})"><div><b>${esc(w.title)}${w.season?' · 第 '+w.season+' 季':''}</b><span>${esc(w.year||'年份待定')} · ${wishState(w.state)}</span></div><em>${w.wisher_count} 人许愿</em></button>`).join('');return toolShell('许愿池','没源也别放弃',rows?`<div class="wish-list">${rows}</div>`:`<div class="empty"><strong>还没有许愿</strong><p class="detail-copy">在作品详情里加入许愿池，云海会持续找。</p><button class="primary" onclick="goSearch()">去找片</button></div>`)}

function issuesPage(){if(S.toolLoading)return toolShell('问题反馈','正在读取处理进度',`<div class="poster skeleton" style="height:110px;aspect-ratio:auto"></div>`);const form=`<form class="form-stack" onsubmit="submitIssue(event)"><input id="issue-title" maxlength="80" required placeholder="一句话说明问题"><textarea id="issue-description" maxlength="2000" required placeholder="发生了什么？可以写清操作步骤和报错。"></textarea><button class="primary">提交反馈</button></form>`;if(S.toolError)return toolShell('问题反馈','记录暂时没加载出来',`<div class="empty"><strong>${esc(S.toolError)}</strong><button class="primary" onclick="goIssues()">重新加载</button></div><section class="section"><div class="section-head"><h2>新反馈</h2></div>${form}</section>`);const rows=S.issues.map(i=>`<div class="compact-row"><div><b>#${i.id} ${esc(i.title)}</b><span>${esc(issueState(i.status))}${i.replies?.length?' · '+esc(i.replies.at(-1).author_name)+': '+esc(i.replies.at(-1).content):''}</span></div><em>${new Date(i.updated_at).toLocaleDateString('zh-CN')}</em></div>`).join('');return toolShell('问题反馈','有问题直接说',`<section><div class="issue-list">${rows||'<div class="empty"><strong>还没有反馈记录</strong>提交后，处理状态和回复会留在这里。</div>'}</div></section><section class="section"><div class="section-head"><h2>新反馈</h2></div>${form}</section>`)}

function adventurePage(){const a=S.adventure;if(S.toolLoading)return `<section class="adventure"><div class="adventure-stage"><h1>正在恢复冒险现场</h1><div class="poster skeleton" style="height:180px;aspect-ratio:auto"></div></div></section>`;if(S.toolError)return `<section class="adventure"><div class="adventure-stage"><h1>冒险暂时没加载出来</h1><p class="adventure-copy">${esc(S.toolError)}</p><button class="primary" onclick="goAdventure()">重新加载</button></div></section>`;if(!a)return `<section class="adventure"><div class="adventure-stage"><div class="kicker">五关互动求片</div><h1>走进电影世界</h1><p class="adventure-copy">输入片名，剧情会围绕这部作品展开。通关后自动提交求片。</p><form class="form-stack" onsubmit="startAdventure(event)"><input id="adventure-movie" maxlength="80" required placeholder="输入电影或剧集名称"><button class="primary">开始冒险</button></form></div></section>`;if(a.phase==='finished')return `<section class="adventure"><div class="adventure-stage"><div class="kicker">冒险结算</div><h1>${a.success?'通关了':'这次倒在了片场'}</h1><div class="adventure-stats"><span>${esc(a.grade||'C')} 评级</span><span>${a.score||0} 分</span><span>连击 ${a.combo||0}</span></div><p class="adventure-copy">${esc(a.message||(a.success?'求片已经自动提交，可以去“我的”看进度。':'可以重新挑战，换个选择。'))}</p><div class="actions"><button class="secondary" onclick="quitAdventure(true)">重新开始</button><button class="primary" onclick="goMe()">查看进度</button></div></div></section>`;const choices=(a.choices||[]).map(c=>`<button class="adventure-choice" ${c.tried?'disabled':''} onclick="chooseAdventure(${c.index},this)"><b>${c.index+1}</b><span>${esc(c.text)}</span></button>`).join('');return `<section class="adventure"><div class="adventure-stage"><div class="adventure-head"><div class="kicker">${esc(a.movie_title)} · 第 ${a.level}/${a.total_levels} 关</div><div class="adventure-stats"><span>HP ${a.hp}/${a.max_hp}</span><span>${a.score||0} 分</span></div></div><h1>${esc(a.scene_title||a.stage_name||'下一幕')}</h1><p class="adventure-copy">${esc(a.description||a.atmosphere||'剧情正在展开。')}</p>${a.message?`<p class="adventure-result">${esc(a.message)}</p>`:''}${a.hint?`<p class="adventure-hint">提示：${esc(a.hint)}</p>`:''}<div class="adventure-choices">${choices}</div><div class="detail-utility"><button class="utility-action" onclick="hintAdventure(this)">使用提示</button><button class="utility-action" onclick="quitAdventure()">退出冒险</button></div></div></section>`}
async function goWishes(){leaveDetail();S.view='wishes';S.toolLoading=true;S.toolError='';showNativeBack();render();try{const d=await api('/api/miniapp/v1/wishes');S.wishes=d.items||[]}catch(e){S.toolError=e.message||'许愿记录暂时无法加载'}finally{S.toolLoading=false;render()}}
async function goIssues(){leaveDetail();S.view='issues';S.toolLoading=true;S.toolError='';showNativeBack();render();try{const d=await api('/api/miniapp/v1/issues');S.issues=d.items||[]}catch(e){S.toolError=e.message||'反馈记录暂时无法加载'}finally{S.toolLoading=false;render()}}
async function goAdventure(){leaveDetail();S.view='adventure';S.toolLoading=true;S.toolError='';showNativeBack();render();try{const d=await api('/api/miniapp/v1/adventure');S.adventure=d.state||null}catch(e){S.toolError=e.message||'冒险暂时无法加载'}finally{S.toolLoading=false;render()}}
async function submitIssue(e){e.preventDefault();const button=e.submitter,title=document.getElementById('issue-title').value.trim(),description=document.getElementById('issue-description').value.trim();if(!title||!description)return;button.disabled=true;button.textContent='正在提交…';try{await api('/api/miniapp/v1/issues',{method:'POST',body:JSON.stringify({title,description})});tg?.HapticFeedback?.notificationOccurred?.('success');toast('反馈已提交');await goIssues()}catch(err){button.disabled=false;button.textContent='提交反馈';toast(err.message||'提交失败')}}
async function startAdventure(e){e.preventDefault();const button=e.submitter,movie=document.getElementById('adventure-movie').value.trim();if(!movie)return;button.disabled=true;button.textContent='正在生成第一幕…';try{const d=await api('/api/miniapp/v1/adventure',{method:'POST',body:JSON.stringify({action:'start',movie})});S.adventure=d.state;tg?.HapticFeedback?.notificationOccurred?.('success');render()}catch(err){button.disabled=false;button.textContent='开始冒险';toast(err.message||'开场失败')}}
async function chooseAdventure(choice,button){if(button.disabled)return;button.classList.add('selected');button.querySelector('.choice-state').textContent='改写中';document.querySelectorAll('.quest-choice,.quest-tool').forEach(x=>x.disabled=true);document.body.classList.add('adventure-resolving');tg?.HapticFeedback?.selectionChanged?.();try{const a=S.adventure,d=await api('/api/miniapp/v1/adventure',{method:'POST',body:JSON.stringify({action:'choice',run_id:a.run_id,turn:a.turn,choice})});S.adventure=d.state;tg?.HapticFeedback?.impactOccurred?.(d.state?.phase==='finished'?'heavy':'medium');render()}catch(e){document.body.classList.remove('adventure-resolving');toast(e.message||'选择没有提交成功');await goAdventure()}}
async function hintAdventure(button){if(button.disabled)return;button.disabled=true;button.textContent='正在问场记…';tg?.HapticFeedback?.impactOccurred?.('light');try{const a=S.adventure,d=await api('/api/miniapp/v1/adventure',{method:'POST',body:JSON.stringify({action:'hint',run_id:a.run_id,turn:a.turn})});S.adventure=d.state;tg?.HapticFeedback?.notificationOccurred?.('warning');render()}catch(e){button.disabled=false;button.textContent='看提示 · 扣生命';toast(e.message||'现在不能使用提示')}}
async function quitAdventure(restart=false){if(!restart&&!confirm('退出后会清除当前冒险，确定退出？'))return;try{await api('/api/miniapp/v1/adventure',{method:'DELETE'});S.adventure=null;render()}catch(e){toast(e.message||'退出失败')}}
async function wishDetail(button){if(button.disabled)return;const x=S.detail,season=x.type==='tv'?S.season:0;button.disabled=true;button.textContent='正在加入…';try{const d=await api('/api/miniapp/v1/wishes',{method:'POST',body:JSON.stringify({tmdb_id:id(x),type:x.type,season})});tg?.HapticFeedback?.notificationOccurred?.('success');toast(d.status==='joined'?'已经和其他人一起许愿':'已加入许愿池');button.textContent='已在许愿池';await goWishes()}catch(e){button.disabled=false;button.textContent='加入许愿池';toast(e.message||'许愿失败')}}
function requestCard(r){const p=img(r.poster_path),date=r.created_at?new Date(r.created_at).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}):'',wash=r.business_type==='wash';return `<div class="request" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" onclick="openDetail(${r.tmdb_id},'${r.media_type==='tv'||r.media_type==='电视剧'?'tv':'movie'}',${Number(r.season)||0})">${p?`<img class="request-poster" src="${esc(p)}" alt="" onerror="this.style.visibility='hidden'">`:'<span class="request-poster"></span>'}<div>${wash?'<span class="business-badge">洗版</span>':''}<h3>${esc(r.media_title||'未命名')}</h3><span class="meta">${esc(r.media_year||'')} ${r.season?'· S'+String(r.season).padStart(2,'0'):''}</span><time>${date}</time>${r.note?`<small class="request-note">${esc(r.note)}</small>`:''}</div><div class="request-actions"><span class="status">${statusText(r)}</span><button class="cancel-request" data-id="${esc(r.request_id)}" onclick="event.stopPropagation();openProgress(this.dataset.id)">时间线</button>${r.can_cancel?`<button class="cancel-request" data-id="${esc(r.request_id)}" data-title="${esc(r.media_title)}" data-kind="${wash?'洗版工单':'求片'}" onclick="event.stopPropagation();openCancel(this.dataset.id,this.dataset.title,this.dataset.kind)">撤回</button>`:''}</div></div>`}
function statusText(r){return r.status_text||'处理中'}
async function openProgress(requestID){const ctx=openDialog(`<div class="kicker">进度时间线</div><h2 id="dialog-title">正在读取真实进度…</h2>`);try{const d=await api('/api/miniapp/v1/progress?request_id='+encodeURIComponent(requestID),{signal:ctx.signal});if(!isCurrentDialog(ctx.seq))return;const events=d.events||[],rows=events.map(e=>`<div class="summary"><div><span>${esc(e.text)}</span><b>${e.at?new Date(e.at).toLocaleString('zh-CN'):'时间未单独记录'}</b></div></div>`).join(''),dialog=document.getElementById('confirm');dialog.querySelector('.sheet').innerHTML=`<div class="kicker">进度时间线</div><h2 id="dialog-title">真实节点</h2>${rows||'<div class="empty">暂无进度节点</div>'}<button class="primary" style="width:100%;margin-top:14px" onclick="closeConfirm()">知道了</button>`;focusDialog(dialog,'.primary')}catch(e){if(e?.name==='AbortError'||!isCurrentDialog(ctx.seq))return;closeConfirm(ctx.seq);toast(e.message||'时间线暂时无法加载')}}
async function refreshMe(button){if(button){button.disabled=true;button.classList.add('spinning');button.textContent='刷新中…'}await goMe(true);tg?.HapticFeedback?.impactOccurred?.('light')}
function openCancel(requestID,title,kind='求片'){const wash=kind==='洗版工单';openDialog(`<div class="kicker">撤回${esc(kind)}</div><h2 id="dialog-title">${esc(title)}</h2><p class="detail-copy">仅待审核${wash?'洗版工单':'申请'}可以撤回。${wash?'撤回不会影响当前版本。':'撤回后会返还本次占用的配额，审核中的请求不会被中断。'}</p><div class="actions"><button class="secondary" onclick="closeConfirm()">保留</button><button class="primary" style="margin:0" data-id="${esc(requestID)}" data-wash="${wash?'1':'0'}" onclick="cancelRequest(this)">确认撤回</button></div>`,{initialFocus:'.secondary'})}
async function cancelRequest(button){if(button.disabled)return;const ctx=dialogContext();if(!ctx)return;const requestID=button.dataset.id,wash=button.dataset.wash==='1';button.disabled=true;button.textContent='正在撤回…';setDialogBusy(ctx.seq,true);try{const d=await api('/api/miniapp/v1/request/cancel',{method:'POST',signal:ctx.signal,body:JSON.stringify({request_id:requestID})});if(!isCurrentDialog(ctx.seq))return;closeConfirm(ctx.seq);tg?.HapticFeedback?.notificationOccurred?.('success');toast(wash?'洗版工单已撤回':d.quota_restored?'已撤回，配额已返还':'已撤回，配额返还待处理');await goMe(true)}catch(e){if(e?.name==='AbortError'||!isCurrentDialog(ctx.seq))return;setDialogBusy(ctx.seq,false);button.disabled=false;button.textContent='确认撤回';toast(e.message||'撤回失败')}}
function leaveDetail(){S.detailSeq++;S.detailVisible=false;syncNativeBack()}
function goHome(){leaveDetail();S.view='home';render();requestAnimationFrame(()=>window.scrollTo(0,S.scroll.home||0))}function goSearch(){leaveDetail();S.view='search';render();requestAnimationFrame(()=>window.scrollTo(0,S.scroll.search||0));if(!S.results.length)setTimeout(()=>document.getElementById('q')?.focus(),50)}async function goMe(silent=false){leaveDetail();S.view='me';syncNativeBack();const seq=++S.meSeq;if(!silent){S.me=null;S.meError='';S.watchError='';render()}const [me,watch]=await Promise.allSettled([api('/api/miniapp/v1/me'),api('/api/miniapp/v1/watchlist')]);if(seq!==S.meSeq||S.view!=='me')return;if(me.status==='fulfilled'){S.me=me.value;S.meError='';S.lastMeRefresh=Date.now()}else{S.meError=me.reason?.message||'求片进度暂时无法加载';if(!silent)toast(S.meError)}if(watch.status==='fulfilled'){S.watchlist=watch.value.items||[];S.watchError=''}else{S.watchError=watch.reason?.message||'想看片单暂时没加载出来';if(!silent)toast(S.watchError)}render()}function setProgressType(v){S.progressType=v;render()}
function resetSearchPage(){S.page=1;S.nextPage=2;S.hasMore=false;S.results=[]}function quick(q){S.query=q;S.view='search';resetSearchPage();rememberSearch(q);render();doSearch(false,1)}function submitSearch(e){e.preventDefault();S.query=document.getElementById('q').value.trim();if(!S.query)return;S.view='search';resetSearchPage();rememberSearch(S.query);render();doSearch(false,1)}function setSearchType(v){S.searchType=v;if(S.query){resetSearchPage();doSearch(false,1)}else render()}function rememberSearch(q){S.history=[q,...S.history.filter(x=>x!==q)].slice(0,5);localStorage.setItem('yunhai_search_history',JSON.stringify(S.history))}function clearHistory(){S.history=[];localStorage.removeItem('yunhai_search_history');render()}function clearRecent(){S.recent=[];localStorage.removeItem('yunhai_recent_views');render()}function rememberView(x){const item={tmdb_id:id(x),type:x.type||type(x),title:x.title||title(x),year:x.year||year(x),poster_path:x.poster_path||x.poster,vote_average:x.vote_average||0,season:x.type==='tv'?S.season:0};S.recent=[item,...S.recent.filter(y=>!(id(y)===item.tmdb_id&&type(y)===item.type))].slice(0,12);localStorage.setItem('yunhai_recent_views',JSON.stringify(S.recent))}function saveSearchState(){localStorage.setItem('yunhai_search_query',S.query);localStorage.setItem('yunhai_search_page',String(S.page));localStorage.setItem('yunhai_search_more',S.hasMore?'1':'0');localStorage.setItem('yunhai_search_type',S.searchType);localStorage.setItem('yunhai_search_results',JSON.stringify(S.results));localStorage.setItem('yunhai_search_scroll',String(S.scroll.search||0))}function loadMore(){if(!S.loading&&S.hasMore)doSearch(true,S.nextPage)}async function doSearch(append,targetPage=1){if(!S.query)return;const seq=++S.searchSeq;S.loading=true;render();try{const f=S.searchType==='all'?'':'&type='+S.searchType,d=await api('/api/miniapp/v1/search?q='+encodeURIComponent(S.query)+'&page='+targetPage+f);if(seq!==S.searchSeq)return;S.results=append?[...S.results,...(d.results||[])]:d.results||[];S.page=Number(d.page)||targetPage;S.nextPage=Number(d.next_page)||S.page+1;S.hasMore=!!d.has_more}catch(e){if(seq!==S.searchSeq)return;if(!append){S.results=[];S.hasMore=false}toast(e.message||'搜索暂时不可用')}finally{if(seq===S.searchSeq){S.loading=false;saveSearchState();render()}}}
async function openDetail(mid,mt,wantedSeason=0){if(!mid)return;S.detailError=null;S.scroll[S.view]=window.scrollY;if(S.view==='search'){localStorage.setItem('yunhai_search_scroll',String(S.scroll.search));saveSearchState()}const seq=++S.detailSeq;S.detailFrom=S.view;S.season=0;S.detailVisible=true;showDetailSkeleton();try{const seasonParam=mt==='tv'&&Number(wantedSeason)>0?'&season='+encodeURIComponent(Number(wantedSeason)):'';const detail=await api(`/api/miniapp/v1/detail?id=${mid}&type=${mt}${seasonParam}`);if(seq!==S.detailSeq)return;if(mt==='tv'&&detail.seasons?.length){const allowed=detail.seasons.some(s=>s.number===Number(wantedSeason));S.season=allowed?Number(wantedSeason):detail.seasons[0].number;detail.media_status=detail.seasons.find(s=>s.number===S.season)?.status||{code:'unknown',text:'暂时无法确认'}}S.detail=detail;rememberView(detail);showDetail()}catch(e){if(seq===S.detailSeq){S.detailError={mid,mt,season:wantedSeason,message:'详情暂时没加载出来'};showDetailError()}}}
function showDetailError(){const e=S.detailError;showNativeBack();document.getElementById('app').innerHTML=chrome(`<section class="detail"><div class="empty" style="margin-top:32px"><strong>${esc(e.message)}</strong><p class="detail-copy">上游响应有点慢，不影响其他页面。</p><button class="primary" onclick="openDetail(${e.mid},'${e.mt}',${e.season})">重新加载</button></div></section>`,S.detailFrom)}
function showDetailSkeleton(){showNativeBack();document.getElementById('app').innerHTML=chrome(`<section class="detail"><div class="detail-hero skeleton"></div><div class="poster skeleton" style="height:44px;aspect-ratio:auto;margin:12px 0"></div><div class="poster skeleton" style="height:90px;aspect-ratio:auto"></div><div class="detail-actions"><button class="primary" disabled>正在加载详情…</button><button class="watch-action" disabled>加入想看</button><button class="share" disabled>分享</button></div></section>`,S.detailFrom)}
function showDetail(){const x=S.detail,mt=x.type,p=img(x.backdrop_path||x.poster_path),q=x.quota||{},used=mt==='tv'?q.tv_used:q.movie_used,limit=mt==='tv'?q.tv_limit:q.movie_limit,remain=limit===-1?'不限':Math.max(0,(limit||0)-(used||0));const disabled=x.media_status?.code!=='available';const seasons=mt==='tv'?(x.seasons||[]).map(s=>`<button class="season ${S.season===s.number?'selected':''}" onclick="selectSeason(${s.number})">${s.poster_path?`<img src="${esc(img(s.poster_path))}" alt="">`:'<span></span>'}<div><b>${esc(s.name||'第 '+s.number+' 季')}</b><span>${esc((s.air_date||'').slice(0,4)||'年份待定')} · ${s.episode_count||0} 集</span></div><em class="season-state ${esc(s.status?.code||'unknown')}">${esc(s.status?.text||'暂时无法确认')}</em></button>`).join(''):'';showNativeBack();document.getElementById('app').innerHTML=chrome(`<section class="detail"><div class="detail-hero">${p?`<img src="${esc(p)}" alt="${esc(x.title)}">`:''}</div><div class="detail-content"><div class="kicker">${mt==='tv'?'剧集':'电影'} · ${esc(x.year||'年份待定')}</div><h1>${esc(x.title)}</h1>${x.original_title&&x.original_title!==x.title?`<div class="meta">${esc(x.original_title)}</div>`:''}<div class="fact-row">${x.vote_average?`<span class="fact">★ ${Number(x.vote_average).toFixed(1)} · ${x.vote_count||0} 人评分</span>`:''}${x.runtime?`<span class="fact">${x.runtime} 分钟</span>`:''}${(x.genres||[]).map(g=>`<span class="fact">${esc(g)}</span>`).join('')}</div><div class="media-state"><div><b>${esc(x.media_status?.text||'可以求片')}</b><span>当前状态</span></div><span>今日剩余 ${remain}</span></div><p class="detail-copy">${esc(x.overview||'这部作品还没有简介。')}</p>${mt==='tv'?`<h2 class="season-title">选择要看的季</h2><div class="season-list">${seasons||'<div class="empty">暂无可选季</div>'}</div>`:''}<div class="detail-actions">${x.media_status?.code==='in_library'?`<button class="wash-action" onclick="openWashConfirm()">${mt==='tv'?'申请洗版第 '+S.season+' 季':'申请洗版'}</button>`:x.media_status?.code==='available'?`<button class="primary" ${mt==='tv'&&!S.season?'disabled':''} onclick="openConfirm()">${mt==='tv'?'求第 '+S.season+' 季':'加入求片'}</button>`:`<button class="primary" ${mt==='tv'&&!S.season?'disabled':''} onclick="wishDetail(this)">加入许愿池</button>`}<button class="watch-action" onclick="toggleWatchlist(this)">${x.in_watchlist?'取消想看':'加入想看'}</button><button class="share" onclick="shareDetail()">分享</button></div>${mt==='tv'?'<p class="meta">剧集想看按整部作品提醒，不区分季。</p>':''}</div></section>`,S.detailFrom)}
async function toggleWatchlist(button){if(button.disabled)return;button.disabled=true;const x=S.detail,adding=!x.in_watchlist;try{await api('/api/miniapp/v1/watchlist',{method:adding?'POST':'DELETE',body:JSON.stringify({tmdb_id:id(x),type:x.type})});x.in_watchlist=adding;if(adding){const item={tmdb_id:id(x),type:x.type,title:x.title,year:x.year,poster_path:x.poster_path};S.watchlist=[item,...S.watchlist.filter(y=>!(id(y)===id(x)&&type(y)===x.type))]}else S.watchlist=S.watchlist.filter(y=>!(id(y)===id(x)&&type(y)===x.type));button.textContent=adding?'取消想看':'加入想看';tg?.HapticFeedback?.notificationOccurred?.('success');toast(adding?'已加入想看，入库后会提醒你':'已取消想看')}catch(e){toast(e.message||'操作失败')}finally{button.disabled=false}}

function shareDetail(){const x=S.detail,kind=x.type==='tv'?'t':'m',season=x.type==='tv'?S.season:0,payload=`yh_${kind}_${id(x)}_${season}`,shareURL='https://t.me/share/url?url='+encodeURIComponent(`https://t.me/yunhaiqp_bot?start=${payload}`)+'&text='+encodeURIComponent(`云海影视 · ${x.title}${season?' 第'+season+'季':''}`);tg?.HapticFeedback?.impactOccurred?.('light');if(tg?.openTelegramLink)tg.openTelegramLink(shareURL);else window.open(shareURL,'_blank')}
function nativeBack(){if(document.getElementById('confirm')){if(D.dismissible)closeConfirm(D.seq);return}if(S.detailVisible){backDetail();return}if(['wishes','issues','adventure'].includes(S.view))goMe()}
function showNativeBack(){tg?.BackButton?.offClick(nativeBack);tg?.BackButton?.onClick(nativeBack);tg?.BackButton?.show()}
function syncNativeBack(){if(S.detailVisible||document.getElementById('confirm')||['wishes','issues','adventure'].includes(S.view))showNativeBack();else{tg?.BackButton?.offClick(nativeBack);tg?.BackButton?.hide()}}
function backDetail(){S.detailSeq++;S.detailVisible=false;S.view=S.detailFrom;syncNativeBack();render();requestAnimationFrame(()=>window.scrollTo(0,S.scroll[S.view]||0))}
function selectSeason(n){S.season=n;S.detail.media_status=S.detail.seasons?.find(s=>s.number===n)?.status||{code:'unknown',text:'暂时无法确认'};showDetail()}
function openWashConfirm(){const x=S.detail,season=x.type==='tv'?S.season:0;openDialog(`<div class="kicker">确认洗版</div><h2 id="dialog-title">${esc(x.title)}</h2><div class="summary"><div><span>目标</span><b>${season?'第 '+season+' 季':'整部电影'}</b></div><div><span>求片额度</span><b>不扣额度</b></div><div><span>当前版本</span><b>验证新版本前保留</b></div><div><span>提交后</span><b>进入审核</b></div></div><p class="detail-copy">洗版会寻找更合适的版本。只有确认新版本可用后才会进入清理流程。</p><div class="actions"><button class="secondary" onclick="closeConfirm()">再看看</button><button class="primary" style="margin:0" onclick="requestWash(this)">确认洗版</button></div>`,{initialFocus:'.secondary'})}
async function requestWash(button){if(button.disabled)return;const ctx=dialogContext();if(!ctx)return;const x=S.detail,payload={tmdb_id:id(x),type:x.type,season:x.type==='tv'?S.season:0,title:x.title,year:String(x.year||''),poster_path:x.poster_path||''};button.disabled=true;button.textContent='正在提交…';setDialogBusy(ctx.seq,true);try{await api('/api/miniapp/v1/wash',{method:'POST',signal:ctx.signal,body:JSON.stringify(payload)});if(!isCurrentDialog(ctx.seq))return;closeConfirm(ctx.seq);tg?.HapticFeedback?.notificationOccurred?.('success');toast('洗版工单已提交，当前版本会先保留');S.me=null}catch(e){if(e?.name==='AbortError'||!isCurrentDialog(ctx.seq))return;setDialogBusy(ctx.seq,false);button.disabled=false;button.textContent='确认洗版';toast(e.message||'洗版提交失败')}}
function openConfirm(){const x=S.detail,season=x.type==='tv'?S.season:0,q=x.quota||{},limit=x.type==='tv'?q.tv_limit:q.movie_limit,used=x.type==='tv'?q.tv_used:q.movie_used,remain=limit===-1?'不限':Math.max(0,(limit||0)-(used||0));openDialog(`<div class="kicker">确认求片</div><h2 id="dialog-title">${esc(x.title)}</h2><div class="summary"><div><span>类型</span><b>${x.type==='tv'?'剧集':'电影'}</b></div>${season?`<div><span>目标</span><b>第 ${season} 季</b></div>`:''}<div><span>今日剩余</span><b>${remain}</b></div><div><span>提交后</span><b>进入审核</b></div></div><div class="actions"><button class="secondary" onclick="closeConfirm()">再看看</button><button class="primary" style="margin:0" onclick="requestMedia()">确认求片</button></div>`,{initialFocus:'.secondary'})}
function closeConfirm(expectedSeq=0){const dialog=document.getElementById('confirm');if(expectedSeq&&Number(dialog?.dataset.dialogSeq)!==expectedSeq)return;const restore=D.returnFocus;D.returnFocus=null;D.controller?.abort();D.controller=null;dialog?.remove();D.dismissible=true;D.seq++;syncNativeBack();requestAnimationFrame(()=>{if(restore?.isConnected){try{restore.focus({preventScroll:true})}catch{restore.focus()}}})}
async function requestMedia(){if(S.submitting)return;const ctx=dialogContext();if(!ctx)return;S.submitting=true;const x=S.detail,season=x.type==='tv'?S.season:0,button=ctx.dialog.querySelector('.primary');if(button){button.disabled=true;button.textContent='正在提交…'}setDialogBusy(ctx.seq,true);try{const d=await api('/api/miniapp/v1/request',{method:'POST',signal:ctx.signal,body:JSON.stringify({tmdb_id:id(x),type:x.type,season})});if(!isCurrentDialog(ctx.seq))return;const messages={created:['已提交审核','进度会同步到“我的”'],duplicate_own:['已经求过了','可以在“我的”查看进度'],duplicate_other:['已经有人求过了','无需重复占用额度'],not_bound:['还没绑定账号','请先回 Bot 完成绑定'],quota_exceeded:['今天额度用完了','明天再来看看']},m=messages[d.status]||['提交完成','去“我的”查看进度'];tg?.HapticFeedback?.notificationOccurred?.(d.status==='created'?'success':'warning');openDialog(`<div class="result-mark">✓</div><h2 id="dialog-title">${m[0]}</h2><p class="detail-copy">${m[1]}</p><button class="primary" onclick="closeConfirm();goMe()">查看我的求片</button><button class="secondary" style="width:100%;padding:14px;margin-top:8px" onclick="closeConfirm()">留在详情</button>`,{initialFocus:'.primary'})}catch(e){if(e?.name==='AbortError'||!isCurrentDialog(ctx.seq))return;setDialogBusy(ctx.seq,false);tg?.HapticFeedback?.notificationOccurred?.('error');toast(e.message||'提交失败');if(button){button.disabled=false;button.textContent='确认求片'}}finally{S.submitting=false}}
function toast(s){const x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function readDeepLink(){const q=new URLSearchParams(location.search),raw=(tg?.initDataUnsafe?.start_param||'').trim();let mid=Number(q.get('tmdb_id'))||0,mt=q.get('type'),season=Number(q.get('season'))||0;if(raw){const p=raw.split('_');if(p.length===4&&p[0]==='yh'){mid=Number(p[2])||0;mt=p[1]==='t'?'tv':p[1]==='m'?'movie':'';season=Number(p[3])||0}}if(mid>0&&(mt==='movie'&&season===0||mt==='tv'&&season>0))return{mid,mt,season};return null}
render();loadHome();api('/api/miniapp/v1/dynamic').then(d=>{S.dynamic=d;localStorage.setItem('yunhai_dynamic_cache',JSON.stringify(d));if(S.view==='home')render()}).catch(()=>{});const deepLink=readDeepLink();if(deepLink)setTimeout(()=>openDetail(deepLink.mid,deepLink.mt,deepLink.season),0);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.view==='me'&&Date.now()-S.lastMeRefresh>15000)goMe(true)});
</script></body></html>
