<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11100f"><title>云海影视</title>
<style>
:root{--ink:#f7f1ea;--muted:#b6ada4;--dim:#817870;--bg:#11100f;--panel:#1b1917;--line:#332e29;--accent:#ef765e;--accent2:#ffb099;--good:#8bc9a4;--safe:max(18px,env(safe-area-inset-bottom))}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif}body{min-height:100dvh}button,input{font:inherit}button{border:0;color:inherit}.shell{max-width:720px;margin:auto;padding:0 18px calc(104px + var(--safe))}.top{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:-.03em}.mark{width:31px;height:31px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#25130f}.avatar{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:var(--panel);display:grid;place-items:center;color:var(--accent2);font-size:13px}.hero{padding:15px 0 18px}.kicker{font-size:10px;letter-spacing:.16em;color:var(--accent);font-weight:800}.hero h1{font-size:clamp(34px,9.4vw,50px);line-height:1.01;letter-spacing:-.065em;margin:8px 0 9px}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}.search{margin-top:21px;display:flex;gap:8px;padding:5px 5px 5px 15px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.search:focus-within{border-color:#ef765e99;box-shadow:0 0 0 3px #ef765e16}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink)}.search input::placeholder{color:var(--dim)}.search button,.primary{background:var(--accent);color:#28130e;font-weight:850;border-radius:11px;padding:11px 15px}.section{margin-top:25px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:13px}.section-head h2{font-size:20px;letter-spacing:-.045em;margin:0}.section-head span{font-size:11px;color:var(--dim)}.feature{height:226px;border-radius:22px;overflow:hidden;position:relative;background:var(--panel);box-shadow:0 18px 42px #0005}.feature img{width:100%;height:100%;object-fit:cover}.feature:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#1110 22%,#11100fee 100%)}.feature-copy{position:absolute;z-index:1;left:17px;right:17px;bottom:16px}.feature h2{font-size:26px;letter-spacing:-.055em;margin:5px 0}.feature p{font-size:12px;color:#d5cbc3;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rail{display:grid;grid-auto-flow:column;grid-auto-columns:31%;gap:11px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}.media{min-width:0;text-align:left;background:none;padding:0;scroll-snap-align:start}.poster{aspect-ratio:2/3;border-radius:14px;background:#24211e;overflow:hidden;position:relative}.poster img{width:100%;height:100%;object-fit:cover;display:block}.poster .fallback{height:100%;padding:10px;display:flex;align-items:end;background:linear-gradient(145deg,#382e29,#171514);font-size:12px;font-weight:750}.media h3{font-size:12px;line-height:1.3;margin:8px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--dim);margin:4px 2px}.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.chip{white-space:nowrap;padding:9px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 11px}.empty{grid-column:1/-1;padding:34px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;background:var(--panel)}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}.skeleton{background:linear-gradient(100deg,#1b1917 30%,#302a26 50%,#1b1917 70%);background-size:200% 100%;animation:shine 1.3s infinite}@keyframes shine{to{background-position:-200% 0}}.detail{padding:8px 0 20px}.back{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--muted)}.detail-hero{height:330px;margin:0 -18px 22px;position:relative;overflow:hidden}.detail-hero img{width:100%;height:100%;object-fit:cover}.detail-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#11100f05 20%,#11100f 100%)}.detail h1{font-size:36px;line-height:1.03;letter-spacing:-.06em;margin:7px 0}.detail-copy{color:var(--muted);font-size:14px;line-height:1.75}.fact-row{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}.fact{padding:7px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:11px}.media-state{display:flex;justify-content:space-between;align-items:center;background:#1a211d;border:1px solid #294237;border-radius:16px;padding:13px 14px;margin:17px 0}.media-state b{font-size:13px;color:var(--good)}.media-state span{font-size:11px;color:#91a89b}.season-title{font-size:16px;margin:23px 0 10px}.season-list{display:grid;gap:8px}.season{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:10px;padding:8px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:left}.season.selected{border-color:#ef765e99;background:#ef765e12}.season img{width:56px;height:78px;object-fit:cover;border-radius:9px;background:#26221f}.season b{display:block;font-size:13px}.season span{display:block;color:var(--dim);font-size:10px;margin-top:4px}.check{width:21px;height:21px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:transparent}.season.selected .check{background:var(--accent);border-color:var(--accent);color:#28130e}.confirm{position:fixed;z-index:30;inset:0;background:#080707b8;backdrop-filter:blur(8px);display:flex;align-items:flex-end}.sheet{width:100%;max-width:720px;margin:0 auto;background:#1a1816;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + var(--safe))}.sheet h2{font-size:24px;letter-spacing:-.045em;margin:8px 0}.sheet .summary{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;margin:16px 0;display:grid;gap:8px}.sheet .summary div{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.sheet .summary b{color:var(--ink)}.actions{display:grid;grid-template-columns:.7fr 1.3fr;gap:9px}.secondary{background:var(--panel);border:1px solid var(--line);border-radius:13px;font-weight:750}.primary[disabled]{opacity:.55}.result-mark{width:52px;height:52px;border-radius:18px;background:#223a2d;color:var(--good);display:grid;place-items:center;font-size:25px}.primary{width:100%;padding:15px;margin-top:12px}.account{padding:22px 0 8px}.account h1{font-size:34px;letter-spacing:-.055em;margin:8px 0}.quota{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quota-card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px}.quota-card b{display:block;font-size:24px;margin-top:5px}.request-list{display:grid;gap:9px}.progress-tabs{display:flex;gap:7px;overflow:auto;margin:0 0 12px;scrollbar-width:none}.progress-tab{white-space:nowrap;padding:8px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:11px}.progress-tab.active{color:var(--accent2);border-color:#ef765e77;background:#ef765e13}.request{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px}.request-poster{width:48px;height:68px;object-fit:cover;border-radius:9px;background:#27221f}.request h3{font-size:14px;margin:0 0 5px}.request time{display:block;color:var(--dim);font-size:9px;margin-top:4px}.status{font-size:11px;color:var(--accent2)}.type-badge{position:absolute;left:6px;top:6px;background:#11100fdd;color:#eee3da;border-radius:7px;padding:4px 6px;font-size:9px}.load-more{width:100%;margin-top:16px;padding:13px;border-radius:13px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}.history{display:flex;align-items:center;gap:7px;overflow:auto;margin-top:12px;scrollbar-width:none}.history button{white-space:nowrap;background:transparent;color:var(--dim);font-size:11px;padding:4px}.history b{font-size:10px;color:var(--dim);white-space:nowrap}.filter-row{display:flex;gap:7px;margin:13px 0 4px}.filter{padding:8px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:11px}.filter.active{color:var(--accent2);border-color:#ef765e77;background:#ef765e13}.bottom{position:fixed;z-index:10;left:0;right:0;bottom:0;background:#11100ff5;border-top:1px solid #332e29aa;backdrop-filter:blur(18px);padding:8px 14px calc(8px + var(--safe))}.bottom nav{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.nav{min-height:48px;background:none;color:#8e857d;font-size:11px;display:grid;place-items:center;gap:2px}.nav i{font-style:normal;font-size:19px;line-height:1}.nav.active{color:var(--accent2)}.toast{position:fixed;z-index:20;left:50%;bottom:calc(88px + var(--safe));transform:translate(-50%,12px);background:var(--ink);color:#201713;padding:11px 15px;border-radius:12px;font-size:12px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}button:active{transform:scale(.98)}@media(min-width:600px){.rail{grid-auto-columns:22%}.grid{grid-template-columns:repeat(4,1fr)}.detail-hero{margin-left:0;margin-right:0;border-radius:22px}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();tg?.setHeaderColor?.('#11100f');tg?.setBackgroundColor?.('#11100f');
const S={view:'home',query:'',loading:false,results:[],discover:{featured:[],movies:[],tv:[]},me:null,user:tg?.initDataUnsafe?.user||null,detail:null,detailFrom:'home',season:0,submitting:false,page:1,hasMore:false,searchType:'all',progressType:'all',history:JSON.parse(localStorage.getItem('yunhai_search_history')||'[]'),searchSeq:0,detailSeq:0,lastMeRefresh:0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const js=s=>JSON.stringify(String(s??''));
const img=p=>!p?'':p.startsWith('http')?p:'https://image.tmdb.org/t/p/w780'+p;const title=x=>x.title||x.name||'未命名';const type=x=>x.media_type||x.type||'movie';const year=x=>(x.year||x.release_date||x.first_air_date||'').toString().slice(0,4);const id=x=>x.tmdb_id||x.id||0;
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||'',...(opts.headers||{})}});if(!r.ok)throw Error((await r.text()).trim());return r.json()}
function card(x){const p=img(x.poster_path||x.poster),mt=type(x)==='tv'||type(x)==='电视剧'?'tv':'movie';return `<button class="media" onclick="openDetail(${id(x)},'${mt}')"><div class="poster">${p?`<img loading="lazy" src="${esc(p)}" alt="${esc(title(x))}" onerror="this.remove()">`:`<div class="fallback">${esc(title(x))}</div>`}<span class="type-badge">${mt==='tv'?'剧集':'电影'}</span></div><h3>${esc(title(x))}</h3><div class="meta">${esc(year(x)||'待定')} · ${x.vote_average?Number(x.vote_average).toFixed(1):'待评分'}</div></button>`}
function chrome(content,active=S.view){const n=S.user?.first_name||'影迷';return `<main class="shell"><header class="top"><div class="brand"><span class="mark">✦</span><span>云海影视</span></div><div class="avatar">${esc(n.slice(0,1))}</div></header>${content}</main><div class="bottom"><nav><button class="nav ${active==='home'?'active':''}" onclick="goHome()"><i>⌂</i>发现</button><button class="nav ${active==='search'?'active':''}" onclick="goSearch()"><i>⌕</i>找片</button><button class="nav ${active==='me'?'active':''}" onclick="goMe()"><i>●</i>我的</button></nav></div>`}
function render(){let body='';if(S.view==='home')body=home();else if(S.view==='search')body=searchPage();else if(S.view==='me')body=mePage();document.getElementById('app').innerHTML=chrome(body)}
function home(){const d=S.discover,lead=d.featured?.[0],movies=d.movies||[],tv=d.tv||[];return `<section class="hero"><div class="kicker">今晚看点什么</div><h1>想看的，<br>交给云海。</h1><p>从一部片开始，找到今晚真正想看的故事。</p><form class="search" onsubmit="submitSearch(event)"><input id="q" placeholder="搜电影、剧集、演员..."><button>找片</button></form></section>${lead?`<button class="feature" onclick="openDetail(${id(lead)},'${type(lead)}')"><img src="${esc(img(lead.backdrop_path||lead.poster_path))}" alt="${esc(title(lead))}" onerror="this.remove()"><div class="feature-copy"><div class="kicker">本周热度</div><h2>${esc(title(lead))}</h2><p>${esc(lead.overview||'正在被更多人发现')}</p></div></button>`:`<div class="feature skeleton"></div>`}<section class="section"><div class="section-head"><h2>热门电影</h2><span>本周热度</span></div><div class="rail">${movies.length?movies.map(card).join(''):Array(5).fill('<div class="poster skeleton"></div>').join('')}</div></section><section class="section"><div class="section-head"><h2>热播剧集</h2><span>正在追</span></div><div class="rail">${tv.length?tv.map(card).join(''):Array(5).fill('<div class="poster skeleton"></div>').join('')}</div></section><section class="section"><div class="section-head"><h2>按口味找</h2><span>换个方向</span></div><div class="chips">${['科幻','悬疑','喜剧','动画','犯罪','纪录片'].map(x=>`<button class="chip" onclick="quick('${x}')">${x}</button>`).join('')}</div></section>`}
function searchPage(){const history=!S.query&&S.history.length?`<div class="history"><b>最近搜索</b>${S.history.map(q=>`<button data-query="${esc(q)}" onclick="quick(this.dataset.query)">${esc(q)}</button>`).join('')}<button onclick="clearHistory()">清除</button></div>`:'';return `<section class="hero"><div class="kicker">找片</div><h1>今天想看<br>哪一部？</h1><form class="search" onsubmit="submitSearch(event)"><input id="q" value="${esc(S.query)}" placeholder="输入片名..."><button>搜索</button></form>${history}<div class="filter-row">${[['all','全部'],['movie','电影'],['tv','剧集']].map(([v,t])=>`<button class="filter ${S.searchType===v?'active':''}" onclick="setSearchType('${v}')">${t}</button>`).join('')}</div></section><section class="section"><div class="section-head"><h2>${S.query?'搜索结果':'从一个名字开始'}</h2><span>${S.results.length?S.results.length+' 部':''}</span></div><div class="grid">${S.loading&&!S.results.length?Array(6).fill('<div class="poster skeleton"></div>').join(''):S.results.length?S.results.map(card).join(''):'<div class="empty"><strong>想看什么？</strong>输入片名，云海帮你找。</div>'}</div>${S.hasMore?`<button class="load-more" ${S.loading?'disabled':''} onclick="loadMore()">${S.loading?'加载中…':'加载更多'}</button>`:''}</section>`}
function mePage(){if(!S.me)return `<section class="account"><div class="kicker">我的云海</div><h1>正在整理你的片单</h1></section><div class="poster skeleton" style="aspect-ratio:3/1"></div>`;const q=S.me.quota||{},all=S.me.requests||[],rs=S.progressType==='all'?all:all.filter(r=>progressGroup(r)===S.progressType),remain=(limit,used)=>limit===-1?'∞':Math.max(0,(limit||0)-(used||0));const tabs=[['all','全部'],['pending','待审核'],['active','处理中'],['done','已结束']];return `<section class="account"><div class="kicker">我的云海</div><h1>${esc(S.me.user?.first_name||'影迷')}，片单在这里。</h1><p class="detail-copy">求片进度和今日额度，一眼看清。</p></section><div class="quota"><div class="quota-card"><span class="meta">电影剩余</span><b>${remain(q.movie_limit,q.movie_used)}</b></div><div class="quota-card"><span class="meta">剧集剩余</span><b>${remain(q.tv_limit,q.tv_used)}</b></div></div><section class="section"><div class="section-head"><h2>求片进度</h2><span>${all.length} 条</span></div><div class="progress-tabs">${tabs.map(([v,t])=>`<button class="progress-tab ${S.progressType===v?'active':''}" onclick="setProgressType('${v}')">${t}</button>`).join('')}</div><div class="request-list">${rs.length?rs.map(requestCard).join(''):'<div class="empty"><strong>这里还没有记录</strong>换个状态看看，或者去发现页找一部。</div>'}</div></section>`}
function progressGroup(r){return r.status_group||'active'}
function requestCard(r){const p=img(r.poster_path),date=r.created_at?new Date(r.created_at).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}):'';return `<button class="request" onclick="openDetail(${r.tmdb_id},'${r.media_type==='tv'||r.media_type==='电视剧'?'tv':'movie'}')">${p?`<img class="request-poster" src="${esc(p)}" alt="" onerror="this.style.visibility='hidden'">`:'<span class="request-poster"></span>'}<div><h3>${esc(r.media_title||'未命名')}</h3><span class="meta">${esc(r.media_year||'')} ${r.season?'· S'+String(r.season).padStart(2,'0'):''}</span><time>${date}</time></div><span class="status">${statusText(r)}</span></button>`}
function statusText(r){return r.status_text||'处理中'}
function goHome(){S.view='home';render()}function goSearch(){S.view='search';render();setTimeout(()=>document.getElementById('q')?.focus(),50)}async function goMe(silent=false){S.view='me';if(!silent){S.me=null;render()}try{S.me=await api('/api/miniapp/v1/me');S.lastMeRefresh=Date.now()}catch(e){if(!silent)toast(e.message||'暂时无法加载')}render()}function setProgressType(v){S.progressType=v;render()}
function quick(q){S.query=q;S.view='search';S.page=1;S.results=[];rememberSearch(q);render();doSearch(false)}function submitSearch(e){e.preventDefault();S.query=document.getElementById('q').value.trim();if(!S.query)return;S.view='search';S.page=1;S.results=[];rememberSearch(S.query);render();doSearch(false)}function setSearchType(v){S.searchType=v;if(S.query){S.page=1;S.results=[];doSearch(false)}else render()}function rememberSearch(q){S.history=[q,...S.history.filter(x=>x!==q)].slice(0,5);localStorage.setItem('yunhai_search_history',JSON.stringify(S.history))}function clearHistory(){S.history=[];localStorage.removeItem('yunhai_search_history');render()}function loadMore(){if(!S.loading&&S.hasMore){S.page++;doSearch(true)}}async function doSearch(append){if(!S.query)return;const seq=++S.searchSeq;S.loading=true;render();try{const f=S.searchType==='all'?'':'&type='+S.searchType,d=await api('/api/miniapp/v1/search?q='+encodeURIComponent(S.query)+'&page='+S.page+f);if(seq!==S.searchSeq)return;S.results=append?[...S.results,...(d.results||[])]:d.results||[];S.hasMore=!!d.has_more}catch(e){if(seq!==S.searchSeq)return;if(!append)S.results=[];toast(e.message||'搜索暂时不可用')}finally{if(seq===S.searchSeq){S.loading=false;render()}}}
async function openDetail(mid,mt){if(!mid)return;const seq=++S.detailSeq;S.detailFrom=S.view;S.season=0;try{const detail=await api(`/api/miniapp/v1/detail?id=${mid}&type=${mt}`);if(seq!==S.detailSeq)return;S.detail=detail;if(mt==='tv'&&S.detail.seasons?.length)S.season=S.detail.seasons[0].number;showDetail()}catch(e){if(seq===S.detailSeq)toast(e.message||'详情暂时不可用')}}
function showDetail(){const x=S.detail,mt=x.type,p=img(x.backdrop_path||x.poster_path),q=x.quota||{},used=mt==='tv'?q.tv_used:q.movie_used,limit=mt==='tv'?q.tv_limit:q.movie_limit,remain=limit===-1?'不限':Math.max(0,(limit||0)-(used||0));const disabled=x.media_status?.code!=='available';const seasons=mt==='tv'?(x.seasons||[]).map(s=>`<button class="season ${S.season===s.number?'selected':''}" onclick="selectSeason(${s.number})">${s.poster_path?`<img src="${esc(img(s.poster_path))}" alt="">`:'<span></span>'}<div><b>${esc(s.name||'第 '+s.number+' 季')}</b><span>${esc((s.air_date||'').slice(0,4)||'年份待定')} · ${s.episode_count||0} 集</span></div><i class="check">✓</i></button>`).join(''):'';tg?.BackButton?.offClick(backDetail);tg?.BackButton?.show();tg?.BackButton?.onClick(backDetail);document.getElementById('app').innerHTML=chrome(`<section class="detail"><button class="back" onclick="backDetail()">← 返回</button><div class="detail-hero">${p?`<img src="${esc(p)}" alt="${esc(x.title)}">`:''}</div><div class="kicker">${mt==='tv'?'剧集':'电影'} · ${esc(x.year||'年份待定')}</div><h1>${esc(x.title)}</h1>${x.original_title&&x.original_title!==x.title?`<div class="meta">${esc(x.original_title)}</div>`:''}<div class="fact-row">${x.vote_average?`<span class="fact">★ ${Number(x.vote_average).toFixed(1)} · ${x.vote_count||0} 人评分</span>`:''}${x.runtime?`<span class="fact">${x.runtime} 分钟</span>`:''}${(x.genres||[]).map(g=>`<span class="fact">${esc(g)}</span>`).join('')}</div><div class="media-state"><div><b>${esc(x.media_status?.text||'可以求片')}</b><span>当前状态</span></div><span>今日剩余 ${remain}</span></div><p class="detail-copy">${esc(x.overview||'这部作品还没有简介。')}</p>${mt==='tv'?`<h2 class="season-title">选择要看的季</h2><div class="season-list">${seasons||'<div class="empty">暂无可选季</div>'}</div>`:''}<button class="primary" ${disabled||mt==='tv'&&!S.season?'disabled':''} onclick="openConfirm()">${disabled?esc(x.media_status.text):mt==='tv'?'求第 '+S.season+' 季':'加入求片'}</button></section>`,S.detailFrom)}
function backDetail(){tg?.BackButton?.offClick(backDetail);tg?.BackButton?.hide();S.view=S.detailFrom;render()}
async function selectSeason(n){S.season=n;try{S.detail=await api(`/api/miniapp/v1/detail?id=${id(S.detail)}&type=tv&season=${n}`)}catch(e){}showDetail()}
function openConfirm(){const x=S.detail,season=x.type==='tv'?S.season:0,q=x.quota||{},limit=x.type==='tv'?q.tv_limit:q.movie_limit,used=x.type==='tv'?q.tv_used:q.movie_used,remain=limit===-1?'不限':Math.max(0,(limit||0)-(used||0));document.body.insertAdjacentHTML('beforeend',`<div id="confirm" class="confirm" onclick="if(event.target===this)closeConfirm()"><div class="sheet"><div class="kicker">确认求片</div><h2>${esc(x.title)}</h2><div class="summary"><div><span>类型</span><b>${x.type==='tv'?'剧集':'电影'}</b></div>${season?`<div><span>目标</span><b>第 ${season} 季</b></div>`:''}<div><span>今日剩余</span><b>${remain}</b></div><div><span>提交后</span><b>进入审核</b></div></div><div class="actions"><button class="secondary" onclick="closeConfirm()">再看看</button><button class="primary" style="margin:0" onclick="requestMedia()">确认求片</button></div></div></div>`)}
function closeConfirm(){document.getElementById('confirm')?.remove()}
async function requestMedia(){if(S.submitting)return;S.submitting=true;const x=S.detail,button=document.querySelector('#confirm .primary');if(button){button.disabled=true;button.textContent='正在提交…'}try{const d=await api('/api/miniapp/v1/request',{method:'POST',body:JSON.stringify({tmdb_id:id(x),type:x.type,season:x.type==='tv'?S.season:0})});const messages={created:['已提交审核','进度会同步到“我的”'],duplicate_own:['已经求过了','可以在“我的”查看进度'],duplicate_other:['已经有人求过了','无需重复占用额度'],not_bound:['还没绑定账号','请先回 Bot 完成绑定'],quota_exceeded:['今天额度用完了','明天再来看看']};const m=messages[d.status]||['提交完成','去“我的”查看进度'];closeConfirm();tg?.HapticFeedback?.notificationOccurred?.(d.status==='created'?'success':'warning');document.body.insertAdjacentHTML('beforeend',`<div id="confirm" class="confirm"><div class="sheet"><div class="result-mark">✓</div><h2>${m[0]}</h2><p class="detail-copy">${m[1]}</p><button class="primary" onclick="closeConfirm();goMe()">查看我的求片</button><button class="secondary" style="width:100%;padding:14px;margin-top:8px" onclick="closeConfirm()">留在详情</button></div></div>`)}catch(e){tg?.HapticFeedback?.notificationOccurred?.('error');toast(e.message||'提交失败');if(button){button.disabled=false;button.textContent='确认求片'}}finally{S.submitting=false}}
function toast(s){const x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
render();api('/api/miniapp/v1/discover').then(d=>{S.discover=d;if(S.view==='home')render()}).catch(()=>{if(S.view==='home')render()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.view==='me'&&Date.now()-S.lastMeRefresh>15000)goMe(true)});
</script></body></html>
