<body>
<main id="app" class="shell"><section class="boot-fallback" aria-live="polite"><div class="yh-boot">正在打开云海求片…</div></section></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
function telegramWebApp(){return window.Telegram?.WebApp}
let tg=telegramWebApp();
let resolveTelegramReady;
const telegramReady=new Promise(resolve=>{resolveTelegramReady=resolve});
let telegramBackBound=false;
function initTelegramWebApp(){tg=telegramWebApp();if(!tg)return;resolveTelegramReady?.();resolveTelegramReady=null;tg.ready();tg.expand?.();tg.setHeaderColor?.(tg.themeParams?.bg_color||'#0f1115');tg.setBackgroundColor?.(tg.themeParams?.bg_color||'#0f1115');if(!telegramBackBound&&tg.BackButton){tg.BackButton.onClick(()=>{if(S.detailVisible)backDetail();else if(S.view!=='search')navigate('search')});telegramBackBound=true}syncBack()}
const DEMO=new URLSearchParams(location.search).get('demo')==='1';
const S={view:'home',query:'',mode:'request',results:[],loading:false,searchError:'',searchSeq:0,meSeq:0,homeSeq:0,homeLoading:false,homeDynamic:null,detail:null,detailVisible:false,detailFrom:'search',detailLoading:false,detailError:'',detailSeq:0,synopsisExpanded:false,tasks:null,tool:null,toolData:null,toolError:'',toolSeq:0,submitting:false,timelineOpen:'',timelines:{},timelineSeq:0};
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const mediaTitle=x=>String(x?.title||x?.name||x?.media_title||'未命名');
const mediaType=x=>x?.type==='tv'||x?.media_type==='tv'||x?.media_type==='电视剧'?'tv':'movie';
const mediaID=x=>x?.tmdb_id??x?.id??0;
const poster=x=>{const p=x?.poster_path||x?.poster||'';return p?(String(p).startsWith('http')?p:'https://image.tmdb.org/t/p/w342'+p):''};
const fmtDate=value=>{if(!value)return'';try{return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value))}catch{return''}};
const demoMedia=(id,type,title,year,posterPath)=>({tmdb_id:id,media_type:type,title,year,vote_average:8.2,poster_path:posterPath||'',original_title:title,genres:['剧情'],media_status:{code:'available',text:'可以求片'}});
function demoResponse(path,options={}){const method=(options.method||'GET').toUpperCase();if(DEMO&&method!=='GET'){if(path.includes('/request'))return{ok:true,status:201,json:async()=>({ok:true,status:'created',request_id:'demo-request'})};if(path.includes('/wash'))return{ok:true,status:201,json:async()=>({ok:true,status:'created',request_id:'demo-wash'})};return{ok:true,status:200,json:async()=>({ok:true})}}
if(!DEMO)return null;const p=String(path);const base='https://images.unsplash.com/photo-';const movie=demoMedia(101,'movie','星际穿越','2014',base+'1500534623283-312aade485b7?auto=format&fit=crop&w=600');const tv={...demoMedia(102,'tv','真探','2014',base+'1478720568477-152d9b164e26?auto=format&fit=crop&w=600'),media_status:{code:'in_library',text:'已在库中'}};
if(p.includes('/search'))return{ok:true,status:200,json:async()=>({results:[movie,tv],page:1,limit:12,has_more:false})};
if(p.includes('/detail'))return{ok:true,status:200,json:async()=>({...movie,quota:{movie_used:1,movie_limit:5,tv_used:1,tv_limit:5},in_watchlist:false})};
if(p.includes('/progress'))return{ok:true,status:200,json:async()=>({request_id:'demo-request',events:[{code:'created',text:'已提交求片',at:'2026-08-01T10:00:00Z'},{code:'approved',text:'审核通过',at:'2026-08-01T12:00:00Z'}]})};
if(p.includes('/me'))return{ok:true,status:200,json:async()=>({requests:[{request_id:'demo-request',tmdb_id:101,media_title:'星际穿越',media_year:2014,media_type:'movie',status:'approved',status_text:'处理中',status_group:'active',business_type:'request',created_at:'2026-08-01T10:00:00Z',poster_path:movie.poster_path,can_cancel:false},{request_id:'demo-wash',tmdb_id:102,media_title:'真探',media_year:2014,media_type:'tv',season:1,episode:2,status:'completed',status_text:'洗版完成',status_group:'done',business_type:'wash',created_at:'2026-07-01T10:00:00Z',poster_path:tv.poster_path,can_cancel:false}],user:{first_name:'Demo'}})};
if(p.includes('/dynamic'))return{ok:true,status:200,json:async()=>({recently_added:[{tmdb_id:101,type:'movie',title:'星际穿越',year:2014,poster_path:movie.poster_path}],just_available:[{tmdb_id:102,type:'tv',title:'真探',year:2014,poster_path:tv.poster_path}],recent_requests:[]})};
if(p.includes('/discover'))return{ok:true,status:200,json:async()=>({featured:[movie],movies:[movie],tv:[tv]})};
if(p.includes('/watchlist'))return{ok:true,status:200,json:async()=>({items:[]})};
if(p.includes('/wishes')||p.includes('/issues'))return{ok:true,status:200,json:async()=>({items:[]})};
return null}
class APIError extends Error{constructor(message,status=0,body=null){super(message);this.status=status;this.body=body}}
async function api(path,options={}){const demo=demoResponse(path,options);if(demo)return demo.json();await telegramReady;tg=telegramWebApp()||tg;let response;try{response=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||'',...(options.headers||{})}})}catch(error){if(error?.name==='AbortError')throw error;throw new APIError('网络连接不稳定，请稍后再试')}if(!response.ok){let body=null;try{body=await response.json()}catch{}const message=typeof body?.message==='string'?body.message:response.status>=500?'服务暂时繁忙，请稍后再试':response.status===401?'Mini App 会话已过期，请从 Telegram 重新打开':'请求没有完成，请稍后再试';throw new APIError(message,response.status,body)}return response.json()}
function toast(message){const node=document.getElementById('toast');node.textContent=message;node.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.classList.remove('show'),2400)}
function icon(name){if(name==='home')return'<svg viewBox="0 0 24 24"><path d="m4 11 8-7 8 7"></path><path d="M6 10v10h12V10M10 20v-6h4v6"></path></svg>';if(name==='search')return'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>';if(name==='tasks')return'<svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"></path><path d="m8 12 2 2 5-5"></path></svg>';if(name==='user')return'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 19c1.2-3.2 3.5-5 6.5-5s5.3 1.8 6.5 5"></path></svg>';return'<svg viewBox="0 0 24 24"><path d="M5 18h14M7 15v-3M12 15V8M17 15v-6"></path></svg>'}
function profileInitial(){const name=String(tg?.initDataUnsafe?.user?.first_name||S.tasks?.user?.first_name||'春').trim();return Array.from(name)[0]||'春'}
function heroMedia(){const items=(S.homeDynamic?.recently_added||[]).filter(validDynamicMedia);return items[0]||null}
function heroArt(){const item=heroMedia(),art=item?poster(item):"";return art?`<img class="hero-art" src="${esc(art)}" alt="" aria-hidden="true">`:`<div class="hero-art-fallback" aria-hidden="true"></div>`}
function heroFeature(){const item=heroMedia();if(!item)return `<div class="hero-feature"><p class="hero-feature-line">${S.homeLoading?"正在确认媒体库…":"媒体库还没有新入库，先搜一部想看的。"}</p></div>`;const id=Number(item?.tmdb_id??item?.id),type=mediaType(item);return `<div class="hero-feature"><div class="hero-feature-line"><span class="hero-kicker">刚刚入库</span><span>${esc(mediaTitle(item))}${item?.year?" · "+esc(item.year):""} · ${type==="tv"?"剧集内容":"电影内容"}</span></div><div class="hero-actions"><button class="primary" data-mid="${id}" data-type="${type}" data-season="${Number(item?.season)||0}" onclick="openMediaFromElement(this)">查看详情</button><button class="secondary" onclick="startSearchMode('request')">继续求片</button></div></div>`}
function homeWorkbench(){return `<section class="home-workbench" aria-label="从想看到能看的任务工作台">${homeTonightSection()}<div class="home-rail">${homeBlockerSection()}${homeActiveSection()}</div><div class="home-discovery">${homeRequestRailSection()}${homeWashRailSection()}</div><section class="home-section home-shortcuts" aria-label="快捷任务"><div class="section-title"><h2>快捷任务</h2></div><div class="task-entry-grid"><button class="task-entry" data-action="request" onclick="startSearchMode('request')"><strong class="task-entry-icon task-entry-request">＋</strong><b>求片模式</b><span>搜到目标，直接提交</span></button><button class="task-entry" data-action="wash" onclick="startSearchMode('wash')"><strong class="task-entry-icon task-entry-wash">↻</strong><b>洗版模式</b><span>已有内容换个更好的版本</span></button></div></section></section>`}
function homeLoadError(message){return `<div class="home-empty home-error" role="alert"><span>${esc(message)}</span><button onclick="loadHome()">重新加载</button></div>`}
function railCard(item,caption,wide){const id=Number(item?.tmdb_id??item?.id),type=mediaType(item),art=poster(item);return `<button class="rail-card${wide?" rail-wide":""}" type="button" data-mid="${id}" data-type="${type}" data-season="${Number(item?.season)||0}" onclick="openMediaFromElement(this)"><span class="rail-card-body"><span class="rail-art">${art?`<img src="${esc(art)}" alt="">`:`<span class="rail-art-fallback" aria-hidden="true"></span>`}${caption?`<span class="rail-badge">${esc(caption)}</span>`:""}</span><strong>${esc(mediaTitle(item))}</strong><small>${esc(item?.year||"")}${item?.year&&caption?" · ":""}${esc(caption||"")}</small></span></button>`}
function homeTonightSection(){const items=(S.homeDynamic?.recently_added||[]).filter(validDynamicMedia).slice(0,8);const content=S.homeDynamic?.error?homeLoadError("媒体库暂时没加载成功"):items.length?`<div class="poster-rail">${items.map(item=>railCard(item,"已入库",false)).join("")}</div>`:`<div class="rail-empty"><span>${S.homeLoading?"正在确认媒体库…":"还没有刚入库的内容"}</span><button onclick="startSearchMode('request')">开始搜索</button></div>`;return `<section class="home-section home-tonight" aria-label="今晚要看"><div class="section-title"><h2>今晚要看</h2><span>${items.length?"已在库，可直接选":"等一部能看的"}</span></div>${content}</section>`}
function homeRequestRailSection(){const items=(S.homeDynamic?.recent_requests||[]).filter(validDynamicMedia).slice(0,10);const content=S.homeDynamic?.error?homeLoadError("媒体库暂时没加载成功"):items.length?`<div class="poster-rail">${items.map(item=>railCard(item,"正在处理",false)).join("")}</div>`:`<div class="rail-empty"><span>${S.homeLoading?"正在同步求片动态…":"最近还没有人求片"}</span><button onclick="startSearchMode('request')">求第一部</button></div>`;return `<section class="home-section home-requests" aria-label="大家都在求片"><div class="section-title"><h2>大家都在求片</h2><span>最近提交</span></div>${content}</section>`}
function washRailItems(){return (S.tasks?.requests||[]).filter(item=>item?.business_type==="wash"&&taskGroup(item)!=="done").sort((a,b)=>taskTimestamp(b)-taskTimestamp(a)).slice(0,8)}
function homeWashRailSection(){const items=washRailItems();if(S.tasks?.error)return "";if(!items.length)return "";return `<section class="home-section home-wash" aria-label="洗版进行中"><div class="section-title"><h2>洗版进行中</h2><button onclick="navigate(&#39;tasks&#39;)">查看全部</button></div><div class="poster-rail">${items.map(item=>railCard(item,item.status_text||taskNext(item),false)).join("")}</div></section>`}
function homeBlockerSection(){const blocked=(S.tasks?.requests||[]).filter(isBlockedTask).sort((a,b)=>taskTimestamp(b)-taskTimestamp(a)).slice(0,3);const content=S.tasks?.error?homeLoadError('任务暂时没加载成功'):blocked.length?blocked.map(taskCompact).join(''):`<div class="home-empty"><span>${S.homeLoading?'正在检查…':'目前没有需要你处理的事'}</span></div>`;return `<section class="home-section home-blockers" aria-label="卡住的事"><div class="section-title"><h2>卡住的事</h2><button onclick="navigate(&#39;tasks&#39;)">查看全部</button></div><div class="blocker-list">${content}</div></section>`}
function homeActiveSection(){const active=(S.tasks?.requests||[]).filter(item=>taskGroup(item)==='active'&&!isBlockedTask(item)).sort((a,b)=>taskTimestamp(b)-taskTimestamp(a)).slice(0,3);const content=S.tasks?.error?homeLoadError('任务暂时没加载成功'):active.length?active.map(taskCompact).join(''):`<div class="home-empty"><span>${S.homeLoading?'正在同步任务…':'现在没有后台任务'}</span></div>`;return `<section class="home-section home-active" aria-label="正在替你办"><div class="section-title"><h2>正在替你办</h2><button onclick="navigate(&#39;tasks&#39;)">查看全部</button></div><div class="activity-track">${content}</div></section>`}
function validDynamicMedia(item){const id=Number(item?.tmdb_id??item?.id),type=mediaType(item);return Number.isFinite(id)&&id>0&&['movie','tv'].includes(type)}
function isBlockedTask(item){const status=String(item?.status||'');return taskGroup(item)==='pending'||['stuck','awaiting_library'].includes(status)}
function taskTimestamp(item){const value=Date.parse(item?.updated_at||item?.created_at||'');return Number.isFinite(value)?value:0}
const RECENT_SEARCHES_KEY='yimao.recent-searches.v1';
function recentSearches(){try{const values=JSON.parse(localStorage.getItem(RECENT_SEARCHES_KEY)||'[]');if(!Array.isArray(values))return[];return values.filter(value=>typeof value==='string').map(value=>value.trim()).filter(Boolean).slice(0,5)}catch{return[]}}
function rememberSearch(query){const value=String(query??'').trim();if(!value)return;const values=[value,...recentSearches().filter(item=>item!==value)].slice(0,5);try{localStorage.setItem(RECENT_SEARCHES_KEY,JSON.stringify(values))}catch{}}
function repeatRecentSearch(element){const query=String(element?.dataset?.query||'').trim();if(!query)return;S.query=query;S.view='search';S.results=[];S.searchError='';render();searchNow(false)}
function taskScope(item){if(mediaType(item)!=='tv'||Number(item.season)<=0)return '';return ` · 第 ${Number(item.season)} 季${item.business_type==='wash'&&Number(item.episode)>0?'第 '+Number(item.episode)+' 集':''}`};function taskAccessibleLabel(item){const title=mediaTitle(item),kind=item.business_type==='wash'?'洗版模式':'求片模式',status=item.status_text||taskNext(item);return `${title}${taskScope(item)}，${kind}，${status}`}
function taskCompact(item){const id=Number(item.tmdb_id);const type=mediaType(item);const group=taskGroup(item);return `<button class="active-item" aria-label="${esc(taskAccessibleLabel(item))}" data-mid="${Number.isFinite(id)&&id>0?id:0}" data-type="${type}" data-season="${Number(item.season)||0}" onclick="openMediaFromElement(this)"><span class="task-symbol">${item.business_type==='wash'?'↻':'⌕'}</span><span><strong>${esc(mediaTitle(item))}</strong><small>${item.business_type==='wash'?'洗版模式':'求片模式'}${esc(taskScope(item))} · ${esc(item.status_text||taskNext(item))}</small></span><span class="status-beacon ${group==='active'?'is-active':'is-pending'}" aria-hidden="true"></span></button>`}
function groupedSearchResults(items){const groups={movie:[],tv:[]};for(const item of Array.isArray(items)?items:[]){const kind=mediaType(item);if(groups[kind])groups[kind].push(item)}return groups}
function statusCode(x){return String(x?.media_status?.code||x?.status?.code||'unknown')}
function detailPrimaryAction(x){const status=statusCode(x);if(status==='in_library')return'洗版模式';if(status==='requested'||status==='subscribed')return'查看进度';if(status==='unknown')return'状态确认';return x.type==='tv'?'选择季度':'求片提交'}
function resultButton(x){const mt=mediaType(x),id=Number(mediaID(x));if(!Number.isFinite(id)||id<=0)return'';return `<span class="result-action">${esc(detailPrimaryAction(x))}</span>`}
function resultStatus(x){return `<span class="status-pill">${esc(x?.media_status?.text||'状态确认')}</span>`}
function searchResultSection(kind,items){if(!items.length)return'';const first=items[0],firstID=Number(mediaID(first));const titleText=kind==='movie'?'电影内容':'剧集内容';return `<section class="result-section"><h3>${titleText} · ${items.length}</h3><button class="result-lead" data-mid="${Number.isFinite(firstID)&&firstID>0?firstID:0}" data-type="${kind}" data-season="0" onclick="openMediaFromElement(this)"><img class="result-poster" src="${esc(poster(first))}" alt=""><span><h4>${esc(mediaTitle(first))}</h4><div class="result-meta"><span>${esc(first.original_title||'')}</span><span>${esc(first.year||'')}</span><span>${Number(first.vote_average||0)?'★ '+Number(first.vote_average).toFixed(1):''}</span></div><p>${esc((first.genres||[]).join(' · '))}</p><span class="result-decision">${resultStatus(first)}${resultButton(first)}</span></span></button>${items.slice(1).map(x=>{const id=Number(mediaID(x));return`<button class="result-row" data-mid="${Number.isFinite(id)&&id>0?id:0}" data-type="${kind}" data-season="0" onclick="openMediaFromElement(this)"><img class="result-poster" src="${esc(poster(x))}" alt=""><span><h4>${esc(mediaTitle(x))}</h4><p>${esc(x.original_title||'')}${x.year?' · '+esc(x.year):''}</p>${resultStatus(x)}</span>${resultButton(x)}</button>`}).join('')}</section>`}
function taskGroup(item){const group=String(item?.status_group||'');if(group==='pending'||item?.status==='pending')return'pending';if(group==='active'||['approved','stuck','awaiting_library'].includes(item?.status))return'active';if(item?.status==='rejected'||item?.status==='cancelled'||group==='done'||item?.status==='completed')return item?.status==='rejected'?'missing':'done';return'missing'}
function groupedTasks(items){const out={pending:[],active:[],done:[],missing:[]};for(const item of Array.isArray(items)?items:[]){const group=taskGroup(item);out[group].push(item)}return out}
function taskNext(item){const group=taskGroup(item);if(group==='pending')return'需要处理';if(group==='active')return'正在进行';if(group==='done')return'已经完成';return'没有找到'}
function taskTone(item){const group=taskGroup(item);return group==="pending"?"pending":group==="active"?"active":group==="done"?"done":"missing"}
function taskStageLabels(item){return item?.business_type==="wash"?["创建","已批准","核验","完成"]:["提交","已批准","处理中","入库"]}
function taskStageIndex(item){const group=taskGroup(item),status=String(item?.status||"");if(group==="pending")return 1;if(group==="done")return 4;if(group==="missing")return 3;if(status==="stuck")return 2;if(status==="awaiting_library")return 3;return 3}
function taskStageTone(item){const status=String(item?.status||"");if(taskGroup(item)==="missing"||status==="stuck")return "stop";if(taskGroup(item)==="done")return "done";return "now"}
function taskTrack(item){const labels=taskStageLabels(item),reached=taskStageIndex(item),tone=taskStageTone(item);const nodes=labels.map((label,index)=>{const step=index+1;let cls="track-node";if(step<reached)cls+=" node-done";else if(step===reached)cls+=tone==="done"?" node-done":tone==="stop"?" node-stop":" node-now";const node=`<span class="${cls}" aria-hidden="true"></span>`;return index===0?node:`<span class="track-seg${step<=reached?" seg-done":""}" aria-hidden="true"></span>${node}`}).join("");return `<div class="task-track"><div class="track-nodes">${nodes}</div><div class="track-labels">${labels.map(label=>`<span>${esc(label)}</span>`).join("")}</div></div>`}
function taskPipeline(groups,total,selected){const stages=[["all","全部内容",total,""],["pending","需要处理",groups.pending.length,"stage-pending"],["active","正在进行",groups.active.length,"stage-active"],["done","已经完成",groups.done.length,"stage-done"],["missing","没有找到",groups.missing.length,"stage-missing"]];return `<div class="task-pipeline" role="group" aria-label="任务流水线">${stages.map(([value,label,count,tone])=>`<button class="pipeline-stage ${tone}${selected===value?" active":""}" ${selected===value?`aria-current="true"`:""} onclick="setTaskFilter('${value}')"><b>${count}</b><small>${label}</small></button>`).join("")}</div>`}
function taskTimelineBlock(requestID){if(!requestID||S.timelineOpen!==requestID)return "";const entry=S.timelines?.[requestID];if(entry?.error)return `<div class="task-timeline"><div class="persistent-error">${esc(entry.error)}</div></div>`;if(!entry||entry.loading)return `<div class="task-timeline"><div class="empty">正在加载时间线…</div></div>`;const events=Array.isArray(entry.events)?entry.events:[];if(!events.length)return `<div class="task-timeline"><div class="empty">暂无进度记录</div></div>`;return `<div class="task-timeline">${events.map(event=>{const tone=event.code==="completed"||event.code==="download_complete"?"done":"active";return `<div class="timeline-item"><span class="timeline-node timeline-${tone}" aria-label="进度节点"></span><span><strong>${esc(event.text)}</strong><small>${esc(fmtDate(event.at))}</small></span></div>`}).join("")}</div>`}
function taskCard(item){const id=Number(item.tmdb_id),type=mediaType(item),requestID=String(item.request_id||""),tone=taskTone(item),art=poster(item);const expanded=requestID&&S.timelineOpen===requestID;return `<article class="task-card tone-${tone}"><div class="task-card-head">${art?`<img class="poster" src="${esc(art)}" alt="">`:`<span class="poster" aria-hidden="true"></span>`}<span><h4>${item.business_type==="wash"?`<span class="business-badge">洗版模式</span>`:""}${esc(mediaTitle(item))}</h4><p>${esc(taskScope(item).replace(' · ',''))}${taskScope(item)?' · ':''}${esc(item.status_text||taskNext(item))} · ${esc(fmtDate(item.updated_at||item.created_at))}</p></span><span class="task-state tone-${tone}">${esc(taskNext(item))}</span></div>${taskTrack(item)}<div class="task-actions"><button data-mid="${id}" data-type="${type}" data-season="${Number(item.season)||0}" onclick="openMediaFromElement(this)">${esc(taskNext(item))}</button>${requestID?`<button data-request-id="${esc(requestID)}" aria-expanded="${expanded?"true":"false"}" onclick="toggleTaskTimeline(this)">${expanded?"收起进度":"展开进度"}</button>`:""}${requestID?`<button data-request-id="${esc(requestID)}" onclick="openProgressFromElement(this)">查看进度</button>`:""}${item.can_cancel&&requestID?`<button data-request-id="${esc(requestID)}" onclick="cancelTaskFromElement(this)">撤回任务</button>`:""}</div>${taskTimelineBlock(requestID)}</article>`}
function toggleTaskTimeline(element){const requestID=String(element?.dataset?.requestId||"");if(!requestID)return;if(S.timelineOpen===requestID){S.timelineOpen="";render();return}S.timelineOpen=requestID;if(!S.timelines)S.timelines={};if(!S.timelines[requestID]||S.timelines[requestID].error){S.timelines[requestID]={loading:true};loadTaskTimeline(requestID)}render()}

function yhFreshPanel(){const items=(S.homeDynamic?.recently_added||[]).filter(validDynamicMedia);const first=items[0];if(!first)return '<section class="yh-panel"><div class="yh-panel-head"><span class="yh-panel-label">刚刚入库</span></div><div class="yh-empty"><span>'+(S.homeLoading?"正在确认媒体库…":"媒体库还没有新入库")+'</span><button type="button" onclick="goSearch()">开始搜索</button></div></section>';const art=poster(first);const id=Number(mediaID(first));const t=mediaType(first);return '<section class="yh-panel"><div class="yh-panel-head"><span class="yh-panel-label">刚刚入库</span><span class="yh-panel-label">'+(t==="tv"?"剧集内容":"电影内容")+'</span></div><button type="button" class="yh-panel-row" data-mid="'+id+'" data-type="'+t+'" data-season="'+(Number(first?.season)||0)+'" onclick="openMediaFromElement(this)">'+(art?'<img src="'+esc(art)+'" alt="">':'<span class="yh-ph" aria-hidden="true"></span>')+'<span><strong>'+esc(mediaTitle(first))+'</strong><small>'+esc(first?.year||"")+' · 已入库可直接看</small></span></button></section>'}

function homePage(){const fresh=(S.homeDynamic?.recently_added||[]).filter(validDynamicMedia).slice(0,9);const hot=(S.homeDynamic?.recent_requests||[]).filter(validDynamicMedia).slice(0,9);return yhBrandBar()+yhHero()+yhDoingSection()+yhQuickV2()+yhRail("刚刚入库","已入库可直接看",fresh,"已入库")+yhRail("大家都在求","最近提交",hot,"处理中")+'<div class="mc-foot">YUNHAI &middot; CINEMA</div>'}

function yhStateTone(item){const g=taskGroup(item);return g==="done"?"is-done":g==="pending"?"is-wait":""}
function yhSteps(item){const wash=item?.business_type==="wash";const labels=wash?["创建","已批准","核验","完成"]:["提交","已批准","处理中","入库"];const at=taskStageIndex(item);return '<div class="yh-time">'+labels.map(function(l,i){const cls=i<at?"is-done":i===at?"is-now":"";return '<div class="yh-step"><span class="yh-node '+cls+'" aria-hidden="true"></span><span><b>'+l+'</b><small>'+(i<at?"已完成":i===at?(item?.status_text||"进行中"):"待进行")+'</small></span></div>'}).join("")+'</div>'}

function settingsPage(){const u=S.settings?.user||{},a=Array.isArray(S.settings?.requests)?S.settings.requests:[],q=S.settings?.quota;return "<section class=\"aux-screen\">"+auxHeader("ACCOUNT","\u7cfb\u7edf\u8bbe\u7f6e","\u5c55\u793a\u8d26\u53f7\u72b6\u6001\uff1b\u901a\u77e5\u548c\u5468\u62a5\u4ecd\u7531\u804a\u5929\u547d\u4ee4\u7ba1\u7406\u3002")+"<article class=\"aux-card\"><h2>"+esc([u.first_name,u.last_name].filter(Boolean).join(" ")||u.username||"\u4e91\u6d77\u7528\u6237")+"</h2><table class=\"aux-facts\"><tr><td>\u6c42\u7247\u4efb\u52a1</td><td>"+a.length+" \u6761</td></tr><tr><td>\u7ed1\u5b9a\u72b6\u6001</td><td>\u4ee5\u804a\u5929\u7ed3\u679c\u4e3a\u51c6</td></tr>"+(q?"<tr><td>\u7535\u5f71\u989d\u5ea6</td><td>"+Number(q.movie_used||0)+" / "+Number(q.movie_limit||0)+"</td></tr><tr><td>\u5267\u96c6\u989d\u5ea6</td><td>"+Number(q.tv_used||0)+" / "+Number(q.tv_limit||0)+"</td></tr>":"")+"</table></article><div class=\"aux-readonly\">Mini App \u6ca1\u6709\u7ed1\u5b9a\u3001\u901a\u77e5\u6216\u5468\u62a5\u5199\u5165\u63a5\u53e3\uff0c\u6b64\u9875\u53ea\u8bfb\u5c55\u793a\u3002</div>"+auxGrid([[{text:AUX.progress,icon:"progress",action:"goTasks()"},{text:AUX.issue,icon:"issue",action:"showIssues()"},{text:AUX.home,icon:"home",action:"goHome()"}]])+"</section>"}
async function loadWishes(){try{const d=await api("/api/miniapp/v1/wishes");if(S.view==="wishes"){S.wishes={items:Array.isArray(d.items)?d.items:[]};render()}}catch(e){if(S.view==="wishes"){S.wishes={items:[],error:e.message};render()}}}
async function loadIssues(){try{const d=await api("/api/miniapp/v1/issues");if(S.view==="issues"){S.issues={items:Array.isArray(d.items)?d.items:[]};render()}}catch(e){if(S.view==="issues"){S.issues={items:[],error:e.message};render()}}}
async function loadSettings(){try{const d=await api("/api/miniapp/v1/me");if(S.view==="settings"){S.settings={...d,requests:Array.isArray(d.requests)?d.requests:[]};render()}}catch(e){if(S.view==="settings"){S.settings={user:{},requests:[],error:e.message};render()}}}
function updateIssueCounts(){const a=document.getElementById("issue-title"),b=document.getElementById("issue-description"),x=document.getElementById("issue-title-count"),y=document.getElementById("issue-description-count");if(a&&x)x.textContent=Array.from(a.value).length+" / 80";if(b&&y)y.textContent=Array.from(b.value).length+" / 2000"}
function submitIssue(e){e.preventDefault();const t=document.getElementById("issue-title")?.value.trim()||"",d=document.getElementById("issue-description")?.value.trim()||"";if(!t||!d){toast("请填写标题和问题描述");return}if(Array.from(t).length>80||Array.from(d).length>2000){toast("标题最多80字，描述最多2000字");return}api("/api/miniapp/v1/issues",{method:"POST",body:JSON.stringify({title:t,description:d,media_type:"",media_id:"",media_title:""})}).then(function(){toast("反馈已提交");S.issues=null;render()}).catch(function(e){toast(e.message||"反馈提交失败")})}
function showSettings(){S.settings=null;S.view="settings";render();loadSettings()}
function showWishes(){S.wishes=null;S.view="wishes";render();loadWishes()}
function showIssues(){S.issues=null;S.view="issues";render();loadIssues()}
function addWishFromDetail(){const x=S.detail;if(!x)return;const season=x.type==="tv"?Number(S.season)||0:0;api("/api/miniapp/v1/wishes",{method:"POST",body:JSON.stringify({tmdb_id:Number(mediaID(x)),type:mediaType(x),season:season})}).then(function(d){toast(d.status==="joined"?"已加入许愿":"许愿已提交");showWishes()}).catch(function(e){const m=e?.body&&typeof e.body.message==="string"?e.body.message:e.message;toast(m||"许愿提交失败")})}
function navigate(view){closeDialog();invalidatePageRequests();S.detailVisible=false;if(view==="home"){S.view="home";render();return}if(view==="search"){S.view="search";render();return}if(view==="tasks"||view==="progress"){S.view="tasks";S.tasks=null;render();return}if(view==="wishes"){showWishes();return}if(view==="issues"){showIssues();return}if(view==="settings"){showSettings();return}}
function showMore(){document.getElementById("app").innerHTML=chrome("<section class=\"aux-screen\"><div class=\"mc-eyebrow\">MORE</div><h1 class=\"mc-title-sm\">更多功能</h1><p>设置和反馈都在这里。</p>"+auxGrid([[{text:"系统设置",icon:"settings",action:"showSettings()"},{text:"问题反馈",icon:"issue",action:"showIssues()"}],[{text:"返回首页",icon:"home",action:"goHome()"}]])+"</section>","home")}
function render(){const body=S.detailVisible?detailPage():S.view==="home"?homePage():S.view==="search"?searchPage():S.view==="tasks"?tasksPage():S.view==="wishes"?wishesPage():S.view==="issues"?issuesPage():S.view==="settings"?settingsPage():searchPage();document.getElementById("app").innerHTML=chrome(body,S.detailVisible?S.detailFrom:S.view);if(S.view==="home"&&!S.detailVisible&&(!S.tasks||!S.homeDynamic)&&!S.homeLoading)loadHome();if(S.view==="tasks"&&!S.tasks)loadTasks();if(S.view==="settings"&&!S.settings)loadSettings();if(S.view==="wishes"&&!S.wishes)loadWishes();if(S.view==="issues"&&!S.issues)loadIssues();document.querySelectorAll("#issue-title,#issue-description").forEach(function(n){n.addEventListener("input",updateIssueCounts)});updateIssueCounts();syncBack()}
function startRoute(){const q=new URLSearchParams(location.search),raw=String(q.get("tgWebAppStartParam")||q.get("start_param")||"home").trim();if(raw==="tasks"||raw==="progress")return{view:"tasks"};if(raw==="search")return{view:"search"};if(raw==="wishes")return{view:"wishes"};if(raw==="issues")return{view:"issues"};if(raw==="settings")return{view:"settings"};const m=raw.match(/^detail_(\d+)_(movie|tv)(?:_(\d+))?$/);if(m)return{view:"detail",id:Number(m[1]),type:m[2],season:Number(m[3]||0)};return{view:"home"}}
function showHelp(){document.getElementById("app").innerHTML=chrome("<section class=\"aux-screen\"><div class=\"mc-eyebrow\">GUIDE</div><h1 class=\"mc-title-sm\">帮助说明</h1><p>发片名、选结果、等审核；状态变化会同步到聊天。</p>"+auxGrid([[{text:"搜索求片",icon:"search",tone:"success",action:"goSearch()"},{text:"查看进度",icon:"progress",action:"goTasks()"},{text:"返回首页",icon:"home",action:"goHome()"}]])+"</section>","home")}
const auxStartRoute=startRoute();S.view=auxStartRoute.view==="detail"?"home":auxStartRoute.view;if(auxStartRoute.view==="detail")setTimeout(function(){openDetail(auxStartRoute.id,auxStartRoute.type,auxStartRoute.season)},0);

render();initTelegramWebApp();syncBack();
</script>
<script async src="/miniapp/telegram-web-app.js" onload="initTelegramWebApp()" onerror="resolveTelegramReady?.()"></script>
</body>
</html>
