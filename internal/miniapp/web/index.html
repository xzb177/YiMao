<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11100f"><title>云海影视</title>
<style>
:root{--ink:#f7f1ea;--muted:#b6ada4;--dim:#817870;--bg:#11100f;--panel:#1b1917;--line:#332e29;--accent:#ef765e;--accent2:#ffb099;--good:#8bc9a4;--safe:max(18px,env(safe-area-inset-bottom))}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif}body{min-height:100dvh}button,input{font:inherit}button{border:0;color:inherit}.shell{max-width:720px;margin:auto;padding:0 18px calc(104px + var(--safe))}.top{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:-.03em}.mark{width:31px;height:31px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#25130f}.avatar{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:var(--panel);display:grid;place-items:center;color:var(--accent2);font-size:13px}.hero{padding:15px 0 18px}.kicker{font-size:10px;letter-spacing:.16em;color:var(--accent);font-weight:800}.hero h1{font-size:clamp(34px,9.4vw,50px);line-height:1.01;letter-spacing:-.065em;margin:8px 0 9px}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}.search{margin-top:21px;display:flex;gap:8px;padding:5px 5px 5px 15px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.search:focus-within{border-color:#ef765e99;box-shadow:0 0 0 3px #ef765e16}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink)}.search input::placeholder{color:var(--dim)}.search button,.primary{background:var(--accent);color:#28130e;font-weight:850;border-radius:11px;padding:11px 15px}.section{margin-top:25px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:13px}.section-head h2{font-size:20px;letter-spacing:-.045em;margin:0}.section-head span{font-size:11px;color:var(--dim)}.feature{height:226px;border-radius:22px;overflow:hidden;position:relative;background:var(--panel);box-shadow:0 18px 42px #0005}.feature img{width:100%;height:100%;object-fit:cover}.feature:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#1110 22%,#11100fee 100%)}.feature-copy{position:absolute;z-index:1;left:17px;right:17px;bottom:16px}.feature h2{font-size:26px;letter-spacing:-.055em;margin:5px 0}.feature p{font-size:12px;color:#d5cbc3;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rail{display:grid;grid-auto-flow:column;grid-auto-columns:31%;gap:11px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}.media{min-width:0;text-align:left;background:none;padding:0;scroll-snap-align:start}.poster{aspect-ratio:2/3;border-radius:14px;background:#24211e;overflow:hidden;position:relative}.poster img{width:100%;height:100%;object-fit:cover;display:block}.poster .fallback{height:100%;padding:10px;display:flex;align-items:end;background:linear-gradient(145deg,#382e29,#171514);font-size:12px;font-weight:750}.media h3{font-size:12px;line-height:1.3;margin:8px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:var(--dim);margin:4px 2px}.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.chip{white-space:nowrap;padding:9px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 11px}.empty{grid-column:1/-1;padding:34px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;background:var(--panel)}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}.skeleton{background:linear-gradient(100deg,#1b1917 30%,#302a26 50%,#1b1917 70%);background-size:200% 100%;animation:shine 1.3s infinite}@keyframes shine{to{background-position:-200% 0}}.detail{padding:8px 0 20px}.back{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--muted)}.detail-hero{height:330px;margin:0 -18px 22px;position:relative;overflow:hidden}.detail-hero img{width:100%;height:100%;object-fit:cover}.detail-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#11100f05 20%,#11100f 100%)}.detail h1{font-size:36px;line-height:1.03;letter-spacing:-.06em;margin:7px 0}.detail-copy{color:var(--muted);font-size:14px;line-height:1.75}.primary{width:100%;padding:15px;margin-top:12px}.account{padding:22px 0 8px}.account h1{font-size:34px;letter-spacing:-.055em;margin:8px 0}.quota{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quota-card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px}.quota-card b{display:block;font-size:24px;margin-top:5px}.request-list{display:grid;gap:9px}.request{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:8px}.request h3{font-size:14px;margin:0 0 5px}.status{font-size:11px;color:var(--accent2)}.bottom{position:fixed;z-index:10;left:0;right:0;bottom:0;background:#11100ff5;border-top:1px solid #332e29aa;backdrop-filter:blur(18px);padding:8px 14px calc(8px + var(--safe))}.bottom nav{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.nav{min-height:48px;background:none;color:#8e857d;font-size:11px;display:grid;place-items:center;gap:2px}.nav i{font-style:normal;font-size:19px;line-height:1}.nav.active{color:var(--accent2)}.toast{position:fixed;z-index:20;left:50%;bottom:calc(88px + var(--safe));transform:translate(-50%,12px);background:var(--ink);color:#201713;padding:11px 15px;border-radius:12px;font-size:12px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}button:active{transform:scale(.98)}@media(min-width:600px){.rail{grid-auto-columns:22%}.grid{grid-template-columns:repeat(4,1fr)}.detail-hero{margin-left:0;margin-right:0;border-radius:22px}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();tg?.setHeaderColor?.('#11100f');tg?.setBackgroundColor?.('#11100f');
const S={view:'home',query:'',loading:false,results:[],discover:[],me:null,user:tg?.initDataUnsafe?.user||null,detail:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=p=>!p?'':p.startsWith('http')?p:'https://image.tmdb.org/t/p/w780'+p;const title=x=>x.title||x.name||'未命名';const type=x=>x.media_type||x.type||'movie';const year=x=>(x.year||x.release_date||x.first_air_date||'').toString().slice(0,4);const id=x=>x.tmdb_id||x.id||0;
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||'',...(opts.headers||{})}});if(!r.ok)throw Error((await r.text()).trim());return r.json()}
function card(x){const p=img(x.poster_path||x.poster);return `<button class="media" onclick="openDetail(${id(x)},'${type(x)==='tv'||type(x)==='电视剧'?'tv':'movie'}')"><div class="poster">${p?`<img loading="lazy" src="${esc(p)}" alt="${esc(title(x))}">`:`<div class="fallback">${esc(title(x))}</div>`}</div><h3>${esc(title(x))}</h3><div class="meta">${esc(year(x)||'待定')} · ${x.vote_average?Number(x.vote_average).toFixed(1):'待评分'}</div></button>`}
function chrome(content,active=S.view){const n=S.user?.first_name||'影迷';return `<main class="shell"><header class="top"><div class="brand"><span class="mark">✦</span><span>云海影视</span></div><div class="avatar">${esc(n.slice(0,1))}</div></header>${content}</main><div class="bottom"><nav><button class="nav ${active==='home'?'active':''}" onclick="goHome()"><i>⌂</i>发现</button><button class="nav ${active==='search'?'active':''}" onclick="goSearch()"><i>⌕</i>找片</button><button class="nav ${active==='me'?'active':''}" onclick="goMe()"><i>●</i>我的</button></nav></div>`}
function render(){let body='';if(S.view==='home')body=home();else if(S.view==='search')body=searchPage();else if(S.view==='me')body=mePage();document.getElementById('app').innerHTML=chrome(body)}
function home(){const list=S.discover,lead=list[0];return `<section class="hero"><div class="kicker">今晚看点什么</div><h1>想看的，<br>交给云海。</h1><p>从一部片开始，找到今晚真正想看的故事。</p><form class="search" onsubmit="submitSearch(event)"><input id="q" placeholder="搜电影、剧集、演员..."><button>找片</button></form></section>${lead?`<button class="feature" onclick="openDetail(${id(lead)},'${type(lead)}')"><img src="${esc(img(lead.backdrop_path||lead.poster_path))}" alt="${esc(title(lead))}"><div class="feature-copy"><div class="kicker">本周热度</div><h2>${esc(title(lead))}</h2><p>${esc(lead.overview||'正在被更多人发现')}</p></div></button>`:`<div class="feature skeleton"></div>`}<section class="section"><div class="section-head"><h2>这周值得看</h2><span>真实热度</span></div><div class="rail">${list.length?list.slice(1,11).map(card).join(''):Array(5).fill('<div class="poster skeleton"></div>').join('')}</div></section><section class="section"><div class="section-head"><h2>按口味找</h2><span>换个方向</span></div><div class="chips">${['科幻','悬疑','喜剧','动画','犯罪','纪录片'].map(x=>`<button class="chip" onclick="quick('${x}')">${x}</button>`).join('')}</div></section>`}
function searchPage(){return `<section class="hero"><div class="kicker">找片</div><h1>今天想看<br>哪一部？</h1><form class="search" onsubmit="submitSearch(event)"><input id="q" value="${esc(S.query)}" placeholder="输入片名..."><button>搜索</button></form></section><section class="section"><div class="section-head"><h2>${S.query?'搜索结果':'从一个名字开始'}</h2><span>${S.results.length?S.results.length+' 部':''}</span></div><div class="grid">${S.loading?Array(6).fill('<div class="poster skeleton"></div>').join(''):S.results.length?S.results.map(card).join(''):'<div class="empty"><strong>想看什么？</strong>输入片名，云海帮你找。</div>'}</div></section>`}
function mePage(){if(!S.me)return `<section class="account"><div class="kicker">我的云海</div><h1>正在整理你的片单</h1></section><div class="poster skeleton" style="aspect-ratio:3/1"></div>`;const q=S.me.quota||{},rs=S.me.requests||[];const remain=(limit,used)=>limit===-1?'∞':Math.max(0,(limit||0)-(used||0));return `<section class="account"><div class="kicker">我的云海</div><h1>${esc(S.me.user?.first_name||'影迷')}，片单在这里。</h1><p class="detail-copy">求片进度和今日额度，一眼看清。</p></section><div class="quota"><div class="quota-card"><span class="meta">电影剩余</span><b>${remain(q.movie_limit,q.movie_used)}</b></div><div class="quota-card"><span class="meta">剧集剩余</span><b>${remain(q.tv_limit,q.tv_used)}</b></div></div><section class="section"><div class="section-head"><h2>最近求片</h2><span>${rs.length} 条</span></div><div class="request-list">${rs.length?rs.map(r=>`<div class="request"><div><h3>${esc(r.media_title||'未命名')}</h3><span class="meta">${esc(r.media_year||'')} ${r.season?'· S'+String(r.season).padStart(2,'0'):''}</span></div><span class="status">${statusText(r)}</span></div>`).join(''):'<div class="empty"><strong>还没有求片</strong>去发现页找一部想看的吧。</div>'}</div></section>`}
function statusText(r){if(r.stuck)return'同步重试';return({pending:'待审核',approved:'处理中',rejected:'未通过',completed:'已入库'}[r.status]||r.status||'处理中')}
function goHome(){S.view='home';render()}function goSearch(){S.view='search';render();setTimeout(()=>document.getElementById('q')?.focus(),50)}async function goMe(){S.view='me';S.me=null;render();try{S.me=await api('/api/miniapp/v1/me')}catch(e){toast(e.message||'暂时无法加载')}render()}
function quick(q){S.query=q;S.view='search';render();doSearch()}function submitSearch(e){e.preventDefault();S.query=document.getElementById('q').value.trim();S.view='search';render();doSearch()}async function doSearch(){if(!S.query)return;S.loading=true;render();try{const d=await api('/api/miniapp/v1/search?q='+encodeURIComponent(S.query));S.results=d.results||[]}catch(e){toast(e.message||'搜索暂时不可用')}finally{S.loading=false;render()}}
async function openDetail(mid,mt){if(!mid)return;try{S.detail=await api(`/api/miniapp/v1/detail?id=${mid}&type=${mt}`);const x=S.detail,p=img(x.backdrop_path||x.poster_path),yr=year(x);document.getElementById('app').innerHTML=chrome(`<section class="detail"><button class="back" onclick="${S.view==='home'?'goHome()':'goSearch()'}">← 返回</button><div class="detail-hero">${p?`<img src="${esc(p)}" alt="${esc(title(x))}">`:''}</div><div class="kicker">${mt==='tv'?'剧集':'电影'} · ${esc(yr||'年份待定')}</div><h1>${esc(title(x))}</h1><div class="meta">${x.vote_average?Number(x.vote_average).toFixed(1)+' 分':'暂无评分'}${x.genres?.length?' · '+esc(x.genres.join(' / ')):''}</div><p class="detail-copy">${esc(x.overview||'这部作品还没有简介。')}</p><button class="primary" onclick="requestMedia()">${mt==='tv'?'订阅第 1 季':'加入求片'}</button></section>`,S.view)}catch(e){toast(e.message||'详情暂时不可用')}}
async function requestMedia(){const x=S.detail;if(!x)return;try{const d=await api('/api/miniapp/v1/request',{method:'POST',body:JSON.stringify({tmdb_id:id(x),type:type(x)==='tv'?'tv':'movie',name:title(x),year:Number(year(x))||0,season:type(x)==='tv'?1:0})});const text={created:'已提交，等审核',duplicate_own:'已经在你的片单里',duplicate_other:'已有影迷求过了',not_bound:'请先在 Bot 绑定账号',quota_exceeded:'今天额度用完了'}[d.status]||'已提交';tg?.HapticFeedback?.notificationOccurred?.('success');toast(text)}catch(e){tg?.HapticFeedback?.notificationOccurred?.('error');toast(e.message||'提交失败')}}
function toast(s){const x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
render();api('/api/miniapp/v1/discover').then(d=>{S.discover=d.items||[];if(S.view==='home')render()}).catch(()=>{if(S.view==='home')render()});
</script></body></html>
