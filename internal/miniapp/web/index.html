const storageJSON=(key,fallback)=>{try{const v=JSON.parse(localStorage.getItem(key)||'null');return v??fallback}catch{return fallback}};
const S={view:'home',detailError:null,meError:'',watchError:'',query:localStorage.getItem('yunhai_search_query')||'',loading:false,results:storageJSON('yunhai_search_results',[]),dynamic:storageJSON('yunhai_dynamic_cache',{recently_added:[],just_available:[],recent_requests:[]}),discover:storageJSON('yunhai_discover_cache',{featured:[],movies:[],tv:[]}),me:null,watchlist:[],user:tg?.initDataUnsafe?.user||null,detail:null,detailFrom:'home',detailVisible:false,season:0,submitting:false,page:Number(localStorage.getItem('yunhai_search_page'))||1,hasMore:localStorage.getItem('yunhai_search_more')==='1',searchType:localStorage.getItem('yunhai_search_type')||'all',progressType:'all',history:storageJSON('yunhai_search_history',[]),recent:storageJSON('yunhai_recent_views',[]),searchSeq:0,detailSeq:0,lastMeRefresh:0,scroll:{home:0,search:Number(localStorage.getItem('yunhai_search_scroll'))||0,me:0}};

const icons={mark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 5h5v5H5zM14 5h5v5h-5zM5 14h5v5H5zM14 14h5v5h-5z"/></svg>',home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>',search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>',play:'<svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5z"/></svg>'};
function card(x){const p=img(x.poster_path||x.poster),mt=type(x)==='tv'||type(x)==='电视剧'?'tv':'movie',score=x.vote_average?Number(x.vote_average).toFixed(1):'';return `<button class="media" onclick="openDetail(${id(x)},'${mt}',${Number(x.season)||0})"><div class="poster">${p?`<img loading="lazy" src="${esc(p)}" alt="${esc(title(x))}" onerror="this.remove()">`:`<div class="fallback">${esc(title(x))}</div>`}<span class="type-badge">${mt==='tv'?'剧集':'电影'}</span></div><h3>${esc(title(x))}</h3><div class="meta rating">${esc(year(x)||'待定')}${score?` · <b>★</b> ${score}`:' · 待评分'}</div></button>`}
function chrome(content,active=S.view){const n=S.user?.first_name||'影迷';return `<main class="shell"><header class="top"><div class="brand"><span class="mark">${icons.mark}</span><span>云海影视</span></div><div class="avatar">${esc(n.slice(0,1))}</div></header>${content}</main><div class="bottom"><nav><button class="nav ${active==='home'?'active':''}" onclick="goHome()"><i>${icons.home}</i>发现</button><button class="nav ${active==='search'?'active':''}" onclick="goSearch()"><i>${icons.search}</i>找片</button><button class="nav ${active==='me'?'active':''}" onclick="goMe()"><i>${icons.user}</i>我的</button></nav></div>`}
function render(){let body='';if(S.view==='home')body=home();else if(S.view==='search')body=searchPage();else if(S.view==='me')body=mePage();document.getElementById('app').innerHTML=chrome(body)}
function dynamicSections(){const d=S.dynamic,sections=[['recently_added','最近入库','云海新片'],['just_available','刚刚可看','已经到库'],['recent_requests','大家最近在求','真实求片']];return sections.map(([key,label,hint])=>d[key]?.length?`<section class="section"><div class="section-head"><h2>${label}</h2><span>${hint}</span></div><div class="rail">${d[key].map(card).join('')}</div></section>`:'').join('')}
function recentSection(){if(!S.recent.length)return'';return `<section class="section"><div class="recent-head"><h2>最近看过</h2><button onclick="clearRecent()">清除</button></div><div class="recent-rail">${S.recent.map(card).join('')}</div></section>`}
function home(){const d=S.discover,lead=d.featured?.[0],movies=d.movies||[],tv=d.tv||[];return `<section class="home-intro"><h1>今晚看什么？</h1><p>先逛逛热门，也可以直接搜片名。</p></section>${lead?`<button class="feature" onclick="openDetail(${id(lead)},'${type(lead)}')"><img src="${esc(img(lead.backdrop_path||lead.poster_path))}" alt="${esc(title(lead))}" onerror="this.remove()"><div class="feature-copy"><div class="kicker">本周主打</div><h2>${esc(title(lead))}</h2><p>${esc(lead.overview||'正在被更多人发现')}</p></div><span class="feature-play">${icons.play}</span></button>`:`<div class="feature skeleton"></div>`}<form class="search" onsubmit="submitSearch(event)"><span class="search-icon">${icons.search}</span><input id="q" placeholder="搜电影、剧集、演员"><button>找片</button></form>${recentSection()}<section class="section"><div class="section-head"><h2>热门电影</h2><span>Trending now</span></div><div class="rail">${movies.length?movies.map(card).join(''):Array(5).fill('<div class="poster skeleton"></div>').join('')}</div></section>${dynamicSections()}<section class="section"><div class="section-head"><h2>热播剧集</h2><span>On air</span></div><div class="rail">${tv.length?tv.map(card).join(''):Array(5).fill('<div class="poster skeleton"></div>').join('')}</div></section><section class="section"><div class="section-head"><h2>按口味找</h2><span>Explore</span></div><div class="chips">${['科幻','悬疑','喜剧','动画','犯罪','纪录片'].map(x=>`<button class="chip" onclick="quick('${x}')">${x}</button>`).join('')}</div></section>`}
function searchPage(){const history=!S.query&&S.history.length?`<div class="history"><b>最近搜索</b>${S.history.map(q=>`<button data-query="${esc(q)}" onclick="quick(this.dataset.query)">${esc(q)}</button>`).join('')}<button onclick="clearHistory()">清除</button></div>`:'';return `<section class="hero"><div class="kicker">找片</div><h1>今天想看<br>哪一部？</h1><form class="search" onsubmit="submitSearch(event)"><input id="q" value="${esc(S.query)}" placeholder="输入片名..."><button>搜索</button></form>${history}<div class="filter-row">${[['all','全部'],['movie','电影'],['tv','剧集']].map(([v,t])=>`<button class="filter ${S.searchType===v?'active':''}" onclick="setSearchType('${v}')">${t}</button>`).join('')}</div></section><section class="section"><div class="section-head"><h2>${S.query?'搜索结果':'从一个名字开始'}</h2><span>${S.results.length?S.results.length+' 部':''}</span></div><div class="grid">${S.loading&&!S.results.length?Array(6).fill('<div class="poster skeleton"></div>').join(''):S.results.length?S.results.map(card).join(''):'<div class="empty"><strong>想看什么？</strong>输入片名，云海帮你找。</div>'}</div>${S.hasMore?`<button class="load-more" ${S.loading?'disabled':''} onclick="loadMore()">${S.loading?'加载中…':'加载更多'}</button>`:''}</section>`}
function mePage(){if(!S.me)return S.meError?`<section class="account"><div class="kicker">我的云海</div><h1>求片进度暂时没加载出来</h1><button class="primary" onclick="goMe()">重新加载</button></section>`:`<section class="account"><div class="kicker">我的云海</div><h1>正在整理你的片单</h1></section><div class="poster skeleton" style="aspect-ratio:3/1"></div>`;const q=S.me.quota||{},all=S.me.requests||[],rs=S.progressType==='all'?all:all.filter(r=>progressGroup(r)===S.progressType),remain=(limit,used)=>limit===-1?'∞':Math.max(0,(limit||0)-(used||0));const tabs=[['all','全部'],['pending','待审核'],['active','处理中'],['done','已结束']],watch=S.watchlist||[];return `<section class="account"><div class="kicker">我的云海</div><h1>${esc(S.me.user?.first_name||'影迷')}，片单在这里。</h1><p class="detail-copy">想看、求片进度和今日额度，一眼看清。</p></section><div class="quota"><div class="quota-card"><span class="meta">电影剩余</span><b>${remain(q.movie_limit,q.movie_used)}</b></div><div class="quota-card"><span class="meta">剧集剩余</span><b>${remain(q.tv_limit,q.tv_used)}</b></div></div><section class="section"><div class="section-head"><h2>我的想看</h2><span>${watch.length} 部</span></div>${S.watchError?'<div class="empty"><strong>想看片单暂时没加载出来</strong><button class="primary" onclick="goMe(true)">重试片单</button></div>':watch.length?`<div class="rail">${watch.map(card).join('')}</div>`:'<div class="empty"><strong>想看片单还是空的</strong>打开作品详情，点“加入想看”。入库后 Bot 会提醒你。</div>'}</section><section class="section"><div class="section-head"><h2>求片进度</h2><button class="refresh" onclick="refreshMe(this)">刷新 · ${all.length} 条</button></div><div class="progress-tabs">${tabs.map(([v,t])=>`<button class="progress-tab ${S.progressType===v?'active':''}" onclick="setProgressType('${v}')">${t}</button>`).join('')}</div><div class="request-list">${rs.length?rs.map(requestCard).join(''):'<div class="empty"><strong>这里还没有记录</strong>换个状态看看，或者去发现页找一部。</div>'}</div></section>`}
function progressGroup(r){return r.status_group||'active'}
function requestCard(r){const p=img(r.poster_path),date=r.created_at?new Date(r.created_at).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}):'';return `<div class="request" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" onclick="openDetail(${r.tmdb_id},'${r.media_type==='tv'||r.media_type==='电视剧'?'tv':'movie'}',${Number(r.season)||0})">${p?`<img class="request-poster" src="${esc(p)}" alt="" onerror="this.style.visibility='hidden'">`:'<span class="request-poster"></span>'}<div><h3>${esc(r.media_title||'未命名')}</h3><span class="meta">${esc(r.media_year||'')} ${r.season?'· S'+String(r.season).padStart(2,'0'):''}</span><time>${date}</time>${r.note?`<small class="request-note">${esc(r.note)}</small>`:''}</div><div class="request-actions"><span class="status">${statusText(r)}</span><button class="cancel-request" data-id="${esc(r.request_id)}" onclick="event.stopPropagation();openProgress(this.dataset.id)">时间线</button>${r.can_cancel?`<button class="cancel-request" data-id="${esc(r.request_id)}" data-title="${esc(r.media_title)}" onclick="event.stopPropagation();openCancel(this.dataset.id,this.dataset.title)">撤回</button>`:''}</div></div>`}
function statusText(r){return r.status_text||'处理中'}
async function openProgress(requestID){showNativeBack();document.body.insertAdjacentHTML('beforeend',`<div id="confirm" class="confirm"><div class="sheet"><div class="kicker">求片时间线</div><h2>正在读取真实进度…</h2></div></div>`);try{const d=await api('/api/miniapp/v1/progress?request_id='+encodeURIComponent(requestID)),events=d.events||[];const rows=events.map(e=>`<div class="summary"><div><span>${esc(e.text)}</span><b>${e.at?new Date(e.at).toLocaleString('zh-CN'):'时间未单独记录'}</b></div></div>`).join('');document.querySelector('#confirm .sheet').innerHTML=`<div class="kicker">求片时间线</div><h2>真实节点</h2>${rows||'<div class="empty">暂无进度节点</div>'}<button class="primary" style="width:100%;margin-top:14px" onclick="closeConfirm()">知道了</button>`}catch(e){closeConfirm();toast(e.message||'时间线暂时无法加载')}}
async function refreshMe(button){if(button){button.disabled=true;button.classList.add('spinning');button.textContent='刷新中…'}await goMe(true);tg?.HapticFeedback?.impactOccurred?.('light')}
function openCancel(requestID,title){showNativeBack();document.body.insertAdjacentHTML('beforeend',`<div id="confirm" class="confirm" onclick="if(event.target===this)closeConfirm()"><div class="sheet"><div class="kicker">撤回求片</div><h2>${esc(title)}</h2><p class="detail-copy">仅待审核申请可以撤回。撤回后会返还本次占用的配额，审核中的请求不会被中断。</p><div class="actions"><button class="secondary" onclick="closeConfirm()">保留</button><button class="primary" style="margin:0" data-id="${esc(requestID)}" onclick="cancelRequest(this)">确认撤回</button></div></div></div>`)}
async function cancelRequest(button){if(button.disabled)return;button.disabled=true;button.textContent='正在撤回…';try{const d=await api('/api/miniapp/v1/request/cancel',{method:'POST',body:JSON.stringify({request_id:button.dataset.id})});closeConfirm();tg?.HapticFeedback?.notificationOccurred?.('success');toast(d.quota_restored?'已撤回，配额已返还':'已撤回，配额返还待处理');await goMe(true)}catch(e){button.disabled=false;button.textContent='确认撤回';toast(e.message||'撤回失败')}}
function leaveDetail(){S.detailSeq++;S.detailVisible=false;syncNativeBack()}
function goHome(){leaveDetail();S.view='home';render();requestAnimationFrame(()=>window.scrollTo(0,S.scroll.home||0))}function goSearch(){leaveDetail();S.view='search';render();requestAnimationFrame(()=>window.scrollTo(0,S.scroll.search||0));if(!S.results.length)setTimeout(()=>document.getElementById('q')?.focus(),50)}async function goMe(silent=false){leaveDetail();S.view='me';if(!silent){S.me=null;S.meError='';S.watchError='';render()}const [me,watch]=await Promise.allSettled([api('/api/miniapp/v1/me'),api('/api/miniapp/v1/watchlist')]);if(me.status==='fulfilled'){S.me=me.value;S.meError='';S.lastMeRefresh=Date.now()}else{S.meError=me.reason?.message||'求片进度暂时无法加载';if(!silent)toast(S.meError)}if(watch.status==='fulfilled'){S.watchlist=watch.value.items||[];S.watchError=''}else{S.watchError=watch.reason?.message||'想看片单暂时没加载出来';if(!silent)toast(S.watchError)}render()}function setProgressType(v){S.progressType=v;render()}
function quick(q){S.query=q;S.view='search';S.page=1;S.results=[];rememberSearch(q);render();doSearch(false)}function submitSearch(e){e.preventDefault();S.query=document.getElementById('q').value.trim();if(!S.query)return;S.view='search';S.page=1;S.results=[];rememberSearch(S.query);render();doSearch(false)}function setSearchType(v){S.searchType=v;if(S.query){S.page=1;S.results=[];doSearch(false)}else render()}function rememberSearch(q){S.history=[q,...S.history.filter(x=>x!==q)].slice(0,5);localStorage.setItem('yunhai_search_history',JSON.stringify(S.history))}function clearHistory(){S.history=[];localStorage.removeItem('yunhai_search_history');render()}function clearRecent(){S.recent=[];localStorage.removeItem('yunhai_recent_views');render()}function rememberView(x){const item={tmdb_id:id(x),type:x.type||type(x),title:x.title||title(x),year:x.year||year(x),poster_path:x.poster_path||x.poster,vote_average:x.vote_average||0,season:x.type==='tv'?S.season:0};S.recent=[item,...S.recent.filter(y=>!(id(y)===item.tmdb_id&&type(y)===item.type))].slice(0,12);localStorage.setItem('yunhai_recent_views',JSON.stringify(S.recent))}function saveSearchState(){localStorage.setItem('yunhai_search_query',S.query);localStorage.setItem('yunhai_search_page',String(S.page));localStorage.setItem('yunhai_search_more',S.hasMore?'1':'0');localStorage.setItem('yunhai_search_type',S.searchType);localStorage.setItem('yunhai_search_results',JSON.stringify(S.results));localStorage.setItem('yunhai_search_scroll',String(S.scroll.search||0))}function loadMore(){if(!S.loading&&S.hasMore){S.page++;doSearch(true)}}async function doSearch(append){if(!S.query)return;const seq=++S.searchSeq;S.loading=true;render();try{const f=S.searchType==='all'?'':'&type='+S.searchType,d=await api('/api/miniapp/v1/search?q='+encodeURIComponent(S.query)+'&page='+S.page+f);if(seq!==S.searchSeq)return;S.results=append?[...S.results,...(d.results||[])]:d.results||[];S.hasMore=!!d.has_more}catch(e){if(seq!==S.searchSeq)return;if(!append)S.results=[];toast(e.message||'搜索暂时不可用')}finally{if(seq===S.searchSeq){S.loading=false;saveSearchState();render()}}}
async function openDetail(mid,mt,wantedSeason=0){if(!mid)return;S.detailError=null;S.scroll[S.view]=window.scrollY;if(S.view==='search'){localStorage.setItem('yunhai_search_scroll',String(S.scroll.search));saveSearchState()}const seq=++S.detailSeq;S.detailFrom=S.view;S.season=0;S.detailVisible=true;showDetailSkeleton();try{const detail=await api(`/api/miniapp/v1/detail?id=${mid}&type=${mt}`);if(seq!==S.detailSeq)return;if(mt==='tv'&&detail.seasons?.length){const allowed=detail.seasons.some(s=>s.number===Number(wantedSeason));S.season=allowed?Number(wantedSeason):detail.seasons[0].number;detail.media_status=detail.seasons.find(s=>s.number===S.season)?.status||{code:'unknown',text:'暂时无法确认'}}S.detail=detail;rememberView(detail);showDetail()}catch(e){if(seq===S.detailSeq){S.detailError={mid,mt,season:wantedSeason,message:'详情暂时没加载出来'};showDetailError()}}}
function showDetailError(){const e=S.detailError;showNativeBack();document.getElementById('app').innerHTML=chrome(`<section class="detail"><div class="empty" style="margin-top:32px"><strong>${esc(e.message)}</strong><p class="detail-copy">上游响应有点慢，不影响其他页面。</p><button class="primary" onclick="openDetail(${e.mid},'${e.mt}',${e.season})">重新加载</button></div></section>`,S.detailFrom)}
function showDetailSkeleton(){showNativeBack();document.getElementById('app').innerHTML=chrome(`<section class="detail"><div class="detail-hero skeleton"></div><div class="poster skeleton" style="height:44px;aspect-ratio:auto;margin:12px 0"></div><div class="poster skeleton" style="height:90px;aspect-ratio:auto"></div><div class="detail-actions"><button class="primary" disabled>正在加载详情…</button><button class="watch-action" disabled>加入想看</button><button class="share" disabled>分享</button></div></section>`,S.detailFrom)}
function showDetail(){const x=S.detail,mt=x.type,p=img(x.backdrop_path||x.poster_path),q=x.quota||{},used=mt==='tv'?q.tv_used:q.movie_used,limit=mt==='tv'?q.tv_limit:q.movie_limit,remain=limit===-1?'不限':Math.max(0,(limit||0)-(used||0));const disabled=x.media_status?.code!=='available';const seasons=mt==='tv'?(x.seasons||[]).map(s=>`<button class="season ${S.season===s.number?'selected':''}" onclick="selectSeason(${s.number})">${s.poster_path?`<img src="${esc(img(s.poster_path))}" alt="">`:'<span></span>'}<div><b>${esc(s.name||'第 '+s.number+' 季')}</b><span>${esc((s.air_date||'').slice(0,4)||'年份待定')} · ${s.episode_count||0} 集</span></div><em class="season-state ${esc(s.status?.code||'unknown')}">${esc(s.status?.text||'暂时无法确认')}</em></button>`).join(''):'';showNativeBack();document.getElementById('app').innerHTML=chrome(`<section class="detail"><div class="detail-hero">${p?`<img src="${esc(p)}" alt="${esc(x.title)}">`:''}</div><div class="detail-content"><div class="kicker">${mt==='tv'?'剧集':'电影'} · ${esc(x.year||'年份待定')}</div><h1>${esc(x.title)}</h1>${x.original_title&&x.original_title!==x.title?`<div class="meta">${esc(x.original_title)}</div>`:''}<div class="fact-row">${x.vote_average?`<span class="fact">★ ${Number(x.vote_average).toFixed(1)} · ${x.vote_count||0} 人评分</span>`:''}${x.runtime?`<span class="fact">${x.runtime} 分钟</span>`:''}${(x.genres||[]).map(g=>`<span class="fact">${esc(g)}</span>`).join('')}</div><div class="media-state"><div><b>${esc(x.media_status?.text||'可以求片')}</b><span>当前状态</span></div><span>今日剩余 ${remain}</span></div><p class="detail-copy">${esc(x.overview||'这部作品还没有简介。')}</p>${mt==='tv'?`<h2 class="season-title">选择要看的季</h2><div class="season-list">${seasons||'<div class="empty">暂无可选季</div>'}</div>`:''}<div class="detail-actions"><button class="primary" ${disabled||mt==='tv'&&!S.season?'disabled':''} onclick="openConfirm()">${disabled?esc(x.media_status.text):mt==='tv'?'求第 '+S.season+' 季':'加入求片'}</button><button class="watch-action" onclick="toggleWatchlist(this)">${x.in_watchlist?'取消想看':'加入想看'}</button><button class="share" onclick="shareDetail()">分享</button></div>${mt==='tv'?'<p class="meta">剧集想看按整部作品提醒，不区分季。</p>':''}</div></section>`,S.detailFrom)}
async function toggleWatchlist(button){if(button.disabled)return;button.disabled=true;const x=S.detail,adding=!x.in_watchlist;try{await api('/api/miniapp/v1/watchlist',{method:adding?'POST':'DELETE',body:JSON.stringify({tmdb_id:id(x),type:x.type})});x.in_watchlist=adding;if(adding){const item={tmdb_id:id(x),type:x.type,title:x.title,year:x.year,poster_path:x.poster_path};S.watchlist=[item,...S.watchlist.filter(y=>!(id(y)===id(x)&&type(y)===x.type))]}else S.watchlist=S.watchlist.filter(y=>!(id(y)===id(x)&&type(y)===x.type));button.textContent=adding?'取消想看':'加入想看';tg?.HapticFeedback?.notificationOccurred?.('success');toast(adding?'已加入想看，入库后会提醒你':'已取消想看')}catch(e){toast(e.message||'操作失败')}finally{button.disabled=false}}

function shareDetail(){const x=S.detail,kind=x.type==='tv'?'t':'m',season=x.type==='tv'?S.season:0,payload=`yh_${kind}_${id(x)}_${season}`,shareURL='https://t.me/share/url?url='+encodeURIComponent(`https://t.me/yunhaiqp_bot?start=${payload}`)+'&text='+encodeURIComponent(`云海影视 · ${x.title}${season?' 第'+season+'季':''}`);tg?.HapticFeedback?.impactOccurred?.('light');if(tg?.openTelegramLink)tg.openTelegramLink(shareURL);else window.open(shareURL,'_blank')}
function nativeBack(){if(document.getElementById('confirm')){closeConfirm();return}if(S.detailVisible)backDetail()}
function showNativeBack(){tg?.BackButton?.offClick(nativeBack);tg?.BackButton?.onClick(nativeBack);tg?.BackButton?.show()}
function syncNativeBack(){if(S.detailVisible||document.getElementById('confirm'))showNativeBack();else{tg?.BackButton?.offClick(nativeBack);tg?.BackButton?.hide()}}
function backDetail(){S.detailVisible=false;S.view=S.detailFrom;syncNativeBack();render();requestAnimationFrame(()=>window.scrollTo(0,S.scroll[S.view]||0))}
function selectSeason(n){S.season=n;S.detail.media_status=S.detail.seasons?.find(s=>s.number===n)?.status||{code:'unknown',text:'暂时无法确认'};showDetail()}
function openConfirm(){const x=S.detail,season=x.type==='tv'?S.season:0,q=x.quota||{},limit=x.type==='tv'?q.tv_limit:q.movie_limit,used=x.type==='tv'?q.tv_used:q.movie_used,remain=limit===-1?'不限':Math.max(0,(limit||0)-(used||0));showNativeBack();document.body.insertAdjacentHTML('beforeend',`<div id="confirm" class="confirm" onclick="if(event.target===this)closeConfirm()"><div class="sheet"><div class="kicker">确认求片</div><h2>${esc(x.title)}</h2><div class="summary"><div><span>类型</span><b>${x.type==='tv'?'剧集':'电影'}</b></div>${season?`<div><span>目标</span><b>第 ${season} 季</b></div>`:''}<div><span>今日剩余</span><b>${remain}</b></div><div><span>提交后</span><b>进入审核</b></div></div><div class="actions"><button class="secondary" onclick="closeConfirm()">再看看</button><button class="primary" style="margin:0" onclick="requestMedia()">确认求片</button></div></div></div>`)}
function closeConfirm(){document.getElementById('confirm')?.remove();syncNativeBack()}
async function requestMedia(){if(S.submitting)return;S.submitting=true;const x=S.detail,button=document.querySelector('#confirm .primary');if(button){button.disabled=true;button.textContent='正在提交…'}try{const d=await api('/api/miniapp/v1/request',{method:'POST',body:JSON.stringify({tmdb_id:id(x),type:x.type,season:x.type==='tv'?S.season:0})});const messages={created:['已提交审核','进度会同步到“我的”'],duplicate_own:['已经求过了','可以在“我的”查看进度'],duplicate_other:['已经有人求过了','无需重复占用额度'],not_bound:['还没绑定账号','请先回 Bot 完成绑定'],quota_exceeded:['今天额度用完了','明天再来看看']};const m=messages[d.status]||['提交完成','去“我的”查看进度'];closeConfirm();tg?.HapticFeedback?.notificationOccurred?.(d.status==='created'?'success':'warning');document.body.insertAdjacentHTML('beforeend',`<div id="confirm" class="confirm"><div class="sheet"><div class="result-mark">✓</div><h2>${m[0]}</h2><p class="detail-copy">${m[1]}</p><button class="primary" onclick="closeConfirm();goMe()">查看我的求片</button><button class="secondary" style="width:100%;padding:14px;margin-top:8px" onclick="closeConfirm()">留在详情</button></div></div>`)}catch(e){tg?.HapticFeedback?.notificationOccurred?.('error');toast(e.message||'提交失败');if(button){button.disabled=false;button.textContent='确认求片'}}finally{S.submitting=false}}
function toast(s){const x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function readDeepLink(){const q=new URLSearchParams(location.search),raw=(tg?.initDataUnsafe?.start_param||'').trim();let mid=Number(q.get('tmdb_id'))||0,mt=q.get('type'),season=Number(q.get('season'))||0;if(raw){const p=raw.split('_');if(p.length===4&&p[0]==='yh'){mid=Number(p[2])||0;mt=p[1]==='t'?'tv':p[1]==='m'?'movie':'';season=Number(p[3])||0}}if(mid>0&&(mt==='movie'&&season===0||mt==='tv'&&season>0))return{mid,mt,season};return null}
render();Promise.allSettled([api('/api/miniapp/v1/discover').then(d=>{S.discover=d;localStorage.setItem('yunhai_discover_cache',JSON.stringify(d))}),api('/api/miniapp/v1/dynamic').then(d=>{S.dynamic=d;localStorage.setItem('yunhai_dynamic_cache',JSON.stringify(d))})]).then(()=>{if(S.view==='home')render()});const deepLink=readDeepLink();if(deepLink)setTimeout(()=>openDetail(deepLink.mid,deepLink.mt,deepLink.season),0);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.view==='me'&&Date.now()-S.lastMeRefresh>15000)goMe(true)});
</script></body></html>
