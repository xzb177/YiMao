<title>私人影视任务中心</title>
<style>

.backdrop{position:fixed;z-index:30;inset:0;display:grid;align-items:end;padding:14px;background:rgba(0,0,0,.58)}.sheet{max-width:600px;width:100%;max-height:calc(100dvh - 28px);margin:auto;overflow:auto;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.sheet-close{float:right;width:44px;height:44px;font-size:24px;color:var(--muted)}.sheet h2{margin:5px 44px 10px 0;font-size:20px}.sheet p{color:var(--muted);font-size:13px;line-height:1.5}.sheet-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}.submission-identity{display:grid;gap:4px;padding:11px;border-left:3px solid var(--good);background:rgba(47,163,111,.10)}.submission-identity.submission-failed{border-color:var(--bad);background:rgba(255,129,117,.08)}.submission-identity strong{font-size:14px}.submission-identity span{color:var(--muted);font-size:11px}.submission-meta{display:grid;gap:8px;margin:14px 0}.submission-meta div{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;align-items:start}.submission-meta dt{color:var(--muted);font-size:12px}.submission-meta dd{min-width:0;margin:0;font-size:12px;overflow-wrap:anywhere}.submission-meta code{color:var(--ink);font-size:11px}.wash-result-note{padding:10px;border-left:3px solid var(--warn);background:rgba(201,138,18,.10)}.timeline{display:grid;gap:0;margin:15px 0}.timeline-item{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);gap:9px;min-height:48px}.timeline-item::before{content:"";position:absolute;top:17px;bottom:-1px;left:8px;width:1px;background:var(--line)}.timeline-item:last-child::before{display:none}.timeline-node{position:relative;z-index:1;width:17px;height:17px;margin-top:2px;border:3px solid var(--accent);border-radius:50%;background:var(--panel)}.timeline-node.timeline-done{border-color:var(--good)}.timeline-item strong{font-size:12px}.timeline-item small{display:block;margin-top:3px;color:var(--muted);font-size:10px}
@media (max-width: 600px){.shell{--gutter:14px}.action-home{gap:18px}.home-context{min-height:52vh}.home-context h1{font-size:30px}.home-workbench{gap:20px}.home-rail{gap:20px}.task-entry-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.task-entry{min-height:96px;padding:11px 8px}.task-entry span{font-size:10px}}
@media (max-width: 350px){.shell{--gutter:12px}.task-entry-grid{gap:5px}.task-entry{padding:10px 7px}.result-lead{grid-template-columns:84px minmax(0,1fr);gap:9px}.result-lead .result-poster{width:84px}.detail-actions{grid-template-columns:1fr}.task-pipeline{grid-template-columns:repeat(3,minmax(0,1fr))}.pipeline-stage b{font-size:17px}.rail-card{flex-basis:104px;width:104px;max-width:104px;min-width:104px}.rail-card-body,.rail-art,.rail-card strong,.rail-card small{width:104px;max-width:104px;min-width:104px}.rail-card-body{grid-template-columns:104px}.rail-art{height:156px}.rail-card.rail-wide{flex-basis:200px;width:200px;max-width:200px;min-width:200px}.rail-card.rail-wide .rail-card-body,.rail-card.rail-wide .rail-art,.rail-card.rail-wide strong,.rail-card.rail-wide small{width:200px;max-width:200px;min-width:200px}.rail-card.rail-wide .rail-card-body{grid-template-columns:200px}.rail-card.rail-wide .rail-art{height:112px}}
@media (min-width: 760px){.shell{max-width:1120px;--gutter:28px}.home-workbench{grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);align-items:start}.home-tonight{grid-column:1}.home-rail{grid-column:2}.home-discovery{grid-column:1/-1}.task-entry-grid{grid-column:1/-1}.result-section{max-width:760px}.detail-hero{max-height:360px}}

<body>
<main id="app" class="shell"><section class="boot-fallback" aria-live="polite"><div class="empty">正在打开任务中心…</div></section></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
function telegramWebApp(){return window.Telegram?.WebApp}
let tg=telegramWebApp();
let resolveTelegramReady;
const telegramReady=new Promise(resolve=>{resolveTelegramReady=resolve});
let telegramBackBound=false;
function initTelegramWebApp(){tg=telegramWebApp();if(!tg)return;resolveTelegramReady?.();resolveTelegramReady=null;tg.ready();tg.expand?.();tg.setHeaderColor?.(tg.themeParams?.bg_color||'#0f1115');tg.setBackgroundColor?.(tg.themeParams?.bg_color||'#0f1115');if(!telegramBackBound&&tg.BackButton){tg.BackButton.onClick(()=>{if(S.detailVisible)backDetail();else if(S.view!=='search')navigate('search')});telegramBackBound=true}syncBack()}
const DEMO=new URLSearchParams(location.search).get('demo')==='1';
const S={view:'home',query:'',mode:'request',results:[],loading:false,searchError:'',searchSeq:0,meSeq:0,homeSeq:0,homeLoading:false,homeDynamic:null,detail:null,detailVisible:false,detailFrom:'search',detailLoading:false,detailError:'',detailSeq:0,tasks:null,tool:null,toolData:null,toolError:'',toolSeq:0,submitting:false,timelineOpen:'',timelines:{},timelineSeq:0};
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const mediaTitle=x=>String(x?.title||x?.name||x?.media_title||'未命名');
const mediaType=x=>x?.type==='tv'||x?.media_type==='tv'||x?.media_type==='电视剧'?'tv':'movie';
const mediaID=x=>x?.tmdb_id??x?.id??0;
const poster=x=>{const p=x?.poster_path||x?.poster||'';return p?(String(p).startsWith('http')?p:'https://image.tmdb.org/t/p/w342'+p):''};
const fmtDate=value=>{if(!value)return'';try{return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value))}catch{return''}};
const demoMedia=(id,type,title,year,posterPath)=>({tmdb_id:id,media_type:type,title,year,vote_average:8.2,poster_path:posterPath||'',original_title:title,genres:['剧情'],media_status:{code:'available',text:'可以求片'}});
function demoResponse(path,options={}){const method=(options.method||'GET').toUpperCase();if(DEMO&&method!=='GET'){if(path.includes('/request'))return{ok:true,status:201,json:async()=>({ok:true,status:'created',request_id:'demo-request'})};if(path.includes('/wash'))return{ok:true,status:201,json:async()=>({ok:true,status:'created',request_id:'demo-wash'})};return{ok:true,status:200,json:async()=>({ok:true})}}
if(!DEMO)return null;const p=String(path);const base='https://images.unsplash.com/photo-';const movie=demoMedia(101,'movie','星际穿越','2014',base+'1500534623283-312aade485b7?auto=format&fit=crop&w=600');const tv={...demoMedia(102,'tv','真探','2014',base+'1478720568477-152d9b164e26?auto=format&fit=crop&w=600'),media_status:{code:'in_library',text:'已在库中'}};
if(p.includes('/search'))return{ok:true,status:200,json:async()=>({results:[movie,tv],page:1,limit:12,has_more:false})};
if(p.includes('/detail'))return{ok:true,status:200,json:async()=>({...movie,quota:{movie_used:1,movie_limit:5,tv_used:1,tv_limit:5},in_watchlist:false})};
if(p.includes('/progress'))return{ok:true,status:200,json:async()=>({request_id:'demo-request',events:[{code:'created',text:'已提交求片',at:'2026-08-01T10:00:00Z'},{code:'approved',text:'审核通过',at:'2026-08-01T12:00:00Z'}]})};
if(p.includes('/me'))return{ok:true,status:200,json:async()=>({requests:[{request_id:'demo-request',tmdb_id:101,media_title:'星际穿越',media_year:2014,media_type:'movie',status:'approved',status_text:'处理中',status_group:'active',business_type:'request',created_at:'2026-08-01T10:00:00Z',poster_path:movie.poster_path,can_cancel:false},{request_id:'demo-wash',tmdb_id:102,media_title:'真探',media_year:2014,media_type:'tv',season:1,status:'completed',status_text:'洗版完成',status_group:'done',business_type:'wash',created_at:'2026-07-01T10:00:00Z',poster_path:tv.poster_path,can_cancel:false}],user:{first_name:'Demo'}})};
if(p.includes('/dynamic'))return{ok:true,status:200,json:async()=>({recently_added:[{tmdb_id:101,type:'movie',title:'星际穿越',year:2014,poster_path:movie.poster_path}],just_available:[{tmdb_id:102,type:'tv',title:'真探',year:2014,poster_path:tv.poster_path}],recent_requests:[]})};
if(p.includes('/discover'))return{ok:true,status:200,json:async()=>({featured:[movie],movies:[movie],tv:[tv]})};
if(p.includes('/watchlist'))return{ok:true,status:200,json:async()=>({items:[]})};
if(p.includes('/wishes')||p.includes('/issues'))return{ok:true,status:200,json:async()=>({items:[]})};
if(p.includes('/assistant'))return{ok:true,status:200,json:async()=>({reply:'可以从这几部开始。',items:[movie]})};return null}
class APIError extends Error{constructor(message,status=0,body=null){super(message);this.status=status;this.body=body}}
async function api(path,options={}){const demo=demoResponse(path,options);if(demo)return demo.json();await telegramReady;tg=telegramWebApp()||tg;let response;try{response=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||'',...(options.headers||{})}})}catch(error){if(error?.name==='AbortError')throw error;throw new APIError('网络连接不稳定，请稍后再试')}if(!response.ok){let body=null;try{body=await response.json()}catch{}const message=typeof body?.message==='string'?body.message:response.status>=500?'服务暂时繁忙，请稍后再试':response.status===401?'Mini App 会话已过期，请从 Telegram 重新打开':'请求没有完成，请稍后再试';throw new APIError(message,response.status,body)}return response.json()}
function toast(message){const node=document.getElementById('toast');node.textContent=message;node.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.classList.remove('show'),2400)}
function icon(name){if(name==='home')return'<svg viewBox="0 0 24 24"><path d="m4 11 8-7 8 7"></path><path d="M6 10v10h12V10M10 20v-6h4v6"></path></svg>';if(name==='search')return'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>';if(name==='tasks')return'<svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"></path><path d="m8 12 2 2 5-5"></path></svg>';if(name==='user')return'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 19c1.2-3.2 3.5-5 6.5-5s5.3 1.8 6.5 5"></path></svg>';return'<svg viewBox="0 0 24 24"><path d="M5 18h14M7 15v-3M12 15V8M17 15v-6"></path></svg>'}
function chrome(content,active=S.view){const current=active==='home'?'home':active==='tasks'?'tasks':'search';return `${content}<nav class="app-dock glass-dock" aria-label="主导航"><button data-view="home" ${current==='home'?'aria-current="page"':''} onclick="goHome()">${icon('home')}首页</button><button data-view="search" ${current==='search'?'aria-current="page"':''} onclick="navigate('search')">${icon('search')}找片</button><button data-view="tasks" ${current==='tasks'?'aria-current="page"':''} onclick="navigate('tasks')">${icon('tasks')}任务</button></nav>`}
function render(){const body=S.detailVisible?detailPage():S.view==='home'?homePage():S.view==='search'?searchPage():S.view==='tasks'?tasksPage():searchPage();document.getElementById('app').innerHTML=chrome(body,S.detailVisible?S.detailFrom:S.view);if(S.view==='home'&&!S.detailVisible&&(!S.tasks||!S.homeDynamic)&&!S.homeLoading)loadHome();if(S.view==='tasks'&&!S.tasks)loadTasks()}
function profileInitial(){const name=String(tg?.initDataUnsafe?.user?.first_name||S.tasks?.user?.first_name||'春').trim();return Array.from(name)[0]||'春'}
function homePage(){return `<section class="action-home"><header class="home-context">${heroArt()}<div class="hero-scrim" aria-hidden="true"></div><div class="context-line"><span>今晚看点什么</span><button class="profile-trigger" type="button" aria-label="我的任务" onclick="navigate('tasks')">${icon('user')}</button></div><h1>把想看的，<br>一次搞定。</h1><p>你的私人影视任务中心</p>${heroFeature()}</header><section class="home-search"><form class="search-form" onsubmit="submitSearch(event)"><label class="sr-only" for="home-q">搜索影视</label><input id="home-q" value="${esc(S.query)}" placeholder="搜片名、演员或关键词" autocomplete="off"><button class="primary" type="submit">找片</button></form></section>${homeWorkbench()}</section>`}
function heroMedia(){const items=(S.homeDynamic?.recently_added||[]).filter(validDynamicMedia);return items[0]||null}
function heroArt(){const item=heroMedia(),art=item?poster(item):"";return art?`<img class="hero-art" src="${esc(art)}" alt="" aria-hidden="true">`:`<div class="hero-art-fallback" aria-hidden="true"></div>`}
function heroFeature(){const item=heroMedia();if(!item)return `<div class="hero-feature"><p class="hero-feature-line">${S.homeLoading?"正在确认媒体库…":"媒体库还没有新入库，先搜一部想看的。"}</p></div>`;const id=Number(item?.tmdb_id??item?.id),type=mediaType(item);return `<div class="hero-feature"><div class="hero-feature-line"><span class="hero-kicker">刚刚入库</span><span>${esc(mediaTitle(item))}${item?.year?" · "+esc(item.year):""} · ${type==="tv"?"剧集":"电影"}</span></div><div class="hero-actions"><button class="primary" data-mid="${id}" data-type="${type}" data-season="${Number(item?.season)||0}" onclick="openMediaFromElement(this)">看看这部</button><button class="secondary" onclick="startSearchMode('request')">求别的片</button></div></div>`}
function homeWorkbench(){return `<section class="home-workbench" aria-label="从想看到能看的任务工作台">${homeTonightSection()}<div class="home-rail">${homeBlockerSection()}${homeActiveSection()}</div><div class="home-discovery">${homeRequestRailSection()}${homeWashRailSection()}</div><section class="home-section home-shortcuts" aria-label="快捷任务"><div class="section-title"><h2>快捷任务</h2></div><div class="task-entry-grid"><button class="task-entry" data-action="request" onclick="startSearchMode('request')"><strong class="task-entry-icon task-entry-request">＋</strong><b>求片</b><span>搜到目标，直接提交</span></button><button class="task-entry" data-action="wash" onclick="startSearchMode('wash')"><strong class="task-entry-icon task-entry-wash">↻</strong><b>洗版</b><span>已有内容换个更好的版本</span></button></div></section></section>`}
function homeLoadError(message){return `<div class="home-empty home-error" role="alert"><span>${esc(message)}</span><button onclick="loadHome()">重试</button></div>`}
function railCard(item,caption,wide){const id=Number(item?.tmdb_id??item?.id),type=mediaType(item),art=poster(item);return `<button class="rail-card${wide?" rail-wide":""}" type="button" data-mid="${id}" data-type="${type}" data-season="${Number(item?.season)||0}" onclick="openMediaFromElement(this)"><span class="rail-card-body"><span class="rail-art">${art?`<img src="${esc(art)}" alt="">`:`<span class="rail-art-fallback" aria-hidden="true"></span>`}${caption?`<span class="rail-badge">${esc(caption)}</span>`:""}</span><strong>${esc(mediaTitle(item))}</strong><small>${esc(item?.year||"")}${item?.year&&caption?" · ":""}${esc(caption||"")}</small></span></button>`}
function homeTonightSection(){const items=(S.homeDynamic?.recently_added||[]).filter(validDynamicMedia).slice(0,8);const content=S.homeDynamic?.error?homeLoadError("媒体库暂时没加载成功"):items.length?`<div class="poster-rail">${items.map(item=>railCard(item,"已入库",false)).join("")}</div>`:`<div class="rail-empty"><span>${S.homeLoading?"正在确认媒体库…":"还没有刚入库的内容"}</span><button onclick="startSearchMode('request')">找一部</button></div>`;return `<section class="home-section home-tonight" aria-label="今晚要看"><div class="section-title"><h2>今晚要看</h2><span>${items.length?"已在库，可直接选":"等一部能看的"}</span></div>${content}</section>`}
function homeRequestRailSection(){const items=(S.homeDynamic?.recent_requests||[]).filter(validDynamicMedia).slice(0,10);const content=S.homeDynamic?.error?homeLoadError("媒体库暂时没加载成功"):items.length?`<div class="poster-rail">${items.map(item=>railCard(item,"正在处理",false)).join("")}</div>`:`<div class="rail-empty"><span>${S.homeLoading?"正在同步求片动态…":"最近还没有人求片"}</span><button onclick="startSearchMode('request')">求第一部</button></div>`;return `<section class="home-section home-requests" aria-label="大家都在求片"><div class="section-title"><h2>大家都在求片</h2><span>最近提交</span></div>${content}</section>`}
function washRailItems(){return (S.tasks?.requests||[]).filter(item=>item?.business_type==="wash"&&taskGroup(item)!=="done").sort((a,b)=>taskTimestamp(b)-taskTimestamp(a)).slice(0,8)}
function homeWashRailSection(){const items=washRailItems();if(S.tasks?.error)return "";if(!items.length)return "";return `<section class="home-section home-wash" aria-label="洗版进行中"><div class="section-title"><h2>洗版进行中</h2><button onclick="navigate('tasks')">查看全部</button></div><div class="poster-rail">${items.map(item=>railCard(item,item.status_text||taskNext(item),false)).join("")}</div></section>`}
function homeBlockerSection(){const blocked=(S.tasks?.requests||[]).filter(isBlockedTask).sort((a,b)=>taskTimestamp(b)-taskTimestamp(a)).slice(0,3);const content=S.tasks?.error?homeLoadError('任务暂时没加载成功'):blocked.length?blocked.map(taskCompact).join(''):`<div class="home-empty"><span>${S.homeLoading?'正在检查…':'目前没有需要你处理的事'}</span></div>`;return `<section class="home-section home-blockers" aria-label="卡住的事"><div class="section-title"><h2>卡住的事</h2><button onclick="navigate('tasks')">查看全部</button></div><div class="blocker-list">${content}</div></section>`}
function homeActiveSection(){const active=(S.tasks?.requests||[]).filter(item=>taskGroup(item)==='active'&&!isBlockedTask(item)).sort((a,b)=>taskTimestamp(b)-taskTimestamp(a)).slice(0,3);const content=S.tasks?.error?homeLoadError('任务暂时没加载成功'):active.length?active.map(taskCompact).join(''):`<div class="home-empty"><span>${S.homeLoading?'正在同步任务…':'现在没有后台任务'}</span></div>`;return `<section class="home-section home-active" aria-label="正在替你办"><div class="section-title"><h2>正在替你办</h2><button onclick="navigate('tasks')">查看全部</button></div><div class="activity-track">${content}</div></section>`}
function validDynamicMedia(item){const id=Number(item?.tmdb_id??item?.id),type=mediaType(item);return Number.isFinite(id)&&id>0&&['movie','tv'].includes(type)}
function isBlockedTask(item){const status=String(item?.status||'');return taskGroup(item)==='pending'||['stuck','awaiting_library'].includes(status)}
function taskTimestamp(item){const value=Date.parse(item?.updated_at||item?.created_at||'');return Number.isFinite(value)?value:0}
const RECENT_SEARCHES_KEY='yimao.recent-searches.v1';
function recentSearches(){try{const values=JSON.parse(localStorage.getItem(RECENT_SEARCHES_KEY)||'[]');if(!Array.isArray(values))return[];return values.filter(value=>typeof value==='string').map(value=>value.trim()).filter(Boolean).slice(0,5)}catch{return[]}}
function rememberSearch(query){const value=String(query??'').trim();if(!value)return;const values=[value,...recentSearches().filter(item=>item!==value)].slice(0,5);try{localStorage.setItem(RECENT_SEARCHES_KEY,JSON.stringify(values))}catch{}}
function repeatRecentSearch(element){const query=String(element?.dataset?.query||'').trim();if(!query)return;S.query=query;S.view='search';S.results=[];S.searchError='';render();searchNow(false)}
function taskAccessibleLabel(item){const title=mediaTitle(item),kind=item.business_type==='wash'?'洗版':'求片',status=item.status_text||taskNext(item);return `${title}，${kind}，${status}`}

function groupedSearchResults(items){const groups={movie:[],tv:[]};for(const item of Array.isArray(items)?items:[]){const kind=mediaType(item);if(groups[kind])groups[kind].push(item)}return groups}
function statusCode(x){return String(x?.media_status?.code||x?.status?.code||'unknown')}
function detailPrimaryAction(x){const status=statusCode(x);if(status==='in_library')return'已在库中 · 洗版';if(status==='requested'||status==='subscribed')return'查看进度';if(status==='unknown')return'状态待确认';return x.type==='tv'?'选择季':'求这部'}
function resultButton(x){const mt=mediaType(x),id=Number(mediaID(x));if(!Number.isFinite(id)||id<=0)return'';return `<span class="result-action">${esc(detailPrimaryAction(x))}</span>`}

function searchResultSection(kind,items){if(!items.length)return'';const first=items[0],firstID=Number(mediaID(first));const titleText=kind==='movie'?'电影':'剧集';return `<section class="result-section"><h3>${titleText} · ${items.length}</h3><button class="result-lead" data-mid="${Number.isFinite(firstID)&&firstID>0?firstID:0}" data-type="${kind}" data-season="0" onclick="openMediaFromElement(this)"><img class="result-poster" src="${esc(poster(first))}" alt=""><span><h4>${esc(mediaTitle(first))}</h4><div class="result-meta"><span>${esc(first.original_title||'')}</span><span>${esc(first.year||'')}</span><span>${Number(first.vote_average||0)?'★ '+Number(first.vote_average).toFixed(1):''}</span></div><p>${esc((first.genres||[]).join(' · '))}</p><span class="result-decision">${resultStatus(first)}${resultButton(first)}</span></span></button>${items.slice(1).map(x=>{const id=Number(mediaID(x));return`<button class="result-row" data-mid="${Number.isFinite(id)&&id>0?id:0}" data-type="${kind}" data-season="0" onclick="openMediaFromElement(this)"><img class="result-poster" src="${esc(poster(x))}" alt=""><span><h4>${esc(mediaTitle(x))}</h4><p>${esc(x.original_title||'')}${x.year?' · '+esc(x.year):''}</p>${resultStatus(x)}</span>${resultButton(x)}</button>`}).join('')}</section>`}
function searchPage(){const groups=groupedSearchResults(S.results);return `<section class="page search-page"><h2>${S.mode==='wash'?'洗版':'找片'}</h2><p class="page-intro">${S.mode==='wash'?'已有内容换个更好的版本。新版本确认可用前，旧版会保留。':'搜索电影或剧集，按媒体库状态决定下一步。'}</p><section class="search-controls"><form class="search-form" onsubmit="submitSearch(event)"><label class="sr-only" for="q">搜索影视</label><input id="q" value="${esc(S.query)}" placeholder="搜片名、演员或关键词" autocomplete="off"><button class="primary" type="submit">搜索</button></form><div class="mode-switch"><button class="${S.mode==='request'?'active':''}" onclick="startSearchMode('request')">求片</button><button class="${S.mode==='wash'?'active':''}" onclick="startSearchMode('wash')">洗版</button></div><div class="filter-row"><button class="${S.searchType==='all'?'active':''}" onclick="setSearchType('all')">全部</button><button class="${S.searchType==='movie'?'active':''}" onclick="setSearchType('movie')">电影</button><button class="${S.searchType==='tv'?'active':''}" onclick="setSearchType('tv')">剧集</button></div></section>${S.searchError?`<div class="persistent-error">${esc(S.searchError)}</div>`:''}${S.loading?'<div class="empty">正在搜索…</div>':''}${!S.loading&&S.query&&!S.results.length?'<div class="empty">没有找到匹配内容。</div>':''}${searchResultSection('movie',groups.movie)}${searchResultSection('tv',groups.tv)}${S.hasMore?'<button class="secondary" onclick="loadMoreSearch()">加载更多</button>':''}</section>`}
function taskGroup(item){const group=String(item?.status_group||'');if(group==='pending'||item?.status==='pending')return'pending';if(group==='active'||['approved','stuck','awaiting_library'].includes(item?.status))return'active';if(item?.status==='rejected'||item?.status==='cancelled'||group==='done'||item?.status==='completed')return item?.status==='rejected'?'missing':'done';return'missing'}
function groupedTasks(items){const out={pending:[],active:[],done:[],missing:[]};for(const item of Array.isArray(items)?items:[]){const group=taskGroup(item);out[group].push(item)}return out}
function taskNext(item){const group=taskGroup(item);if(group==='pending')return'需要处理';if(group==='active')return'进行中';if(group==='done')return'已完成';return'没有找到'}
function taskTone(item){const group=taskGroup(item);return group==="pending"?"pending":group==="active"?"active":group==="done"?"done":"missing"}
function taskStageLabels(item){return item?.business_type==="wash"?["创建","已批准","核验","完成"]:["提交","已批准","处理中","入库"]}
function taskStageIndex(item){const group=taskGroup(item),status=String(item?.status||"");if(group==="pending")return 1;if(group==="done")return 4;if(group==="missing")return 3;if(status==="stuck")return 2;if(status==="awaiting_library")return 3;return 3}
function taskStageTone(item){const status=String(item?.status||"");if(taskGroup(item)==="missing"||status==="stuck")return "stop";if(taskGroup(item)==="done")return "done";return "now"}
function taskTrack(item){const labels=taskStageLabels(item),reached=taskStageIndex(item),tone=taskStageTone(item);const nodes=labels.map((label,index)=>{const step=index+1;let cls="track-node";if(step<reached)cls+=" node-done";else if(step===reached)cls+=tone==="done"?" node-done":tone==="stop"?" node-stop":" node-now";const node=`<span class="${cls}" aria-hidden="true"></span>`;return index===0?node:`<span class="track-seg${step<=reached?" seg-done":""}" aria-hidden="true"></span>${node}`}).join("");return `<div class="task-track"><div class="track-nodes">${nodes}</div><div class="track-labels">${labels.map(label=>`<span>${esc(label)}</span>`).join("")}</div></div>`}
function taskPipeline(groups,total,selected){const stages=[["all","全部",total,""],["pending","需要处理",groups.pending.length,"stage-pending"],["active","进行中",groups.active.length,"stage-active"],["done","已完成",groups.done.length,"stage-done"],["missing","没有找到",groups.missing.length,"stage-missing"]];return `<div class="task-pipeline" role="group" aria-label="任务流水线">${stages.map(([value,label,count,tone])=>`<button class="pipeline-stage ${tone}${selected===value?" active":""}" ${selected===value?`aria-current="true"`:""} onclick="setTaskFilter('${value}')"><b>${count}</b><small>${label}</small></button>`).join("")}</div>`}
function taskTimelineBlock(requestID){if(!requestID||S.timelineOpen!==requestID)return "";const entry=S.timelines?.[requestID];if(entry?.error)return `<div class="task-timeline"><div class="persistent-error">${esc(entry.error)}</div></div>`;if(!entry||entry.loading)return `<div class="task-timeline"><div class="empty">正在加载时间线…</div></div>`;const events=Array.isArray(entry.events)?entry.events:[];if(!events.length)return `<div class="task-timeline"><div class="empty">暂无进度记录</div></div>`;return `<div class="task-timeline">${events.map(event=>{const tone=event.code==="completed"||event.code==="download_complete"?"done":"active";return `<div class="timeline-item"><span class="timeline-node timeline-${tone}" aria-label="进度节点"></span><span><strong>${esc(event.text)}</strong><small>${esc(fmtDate(event.at))}</small></span></div>`}).join("")}</div>`}
function tasksPage(){const data=S.tasks?.requests||[],groups=groupedTasks(data);const selected=S.taskFilter||"all";const list=selected==="all"?data:groups[selected]||[];return `<section class="page tasks-page"><h2>任务</h2><p class="page-intro">求片和洗版会聚合在同一条时间线上。</p>${S.tasks?.error?`<div class="persistent-error">${esc(S.tasks.error)}</div>`:""}${taskPipeline(groups,data.length,selected)}${list.length?`<div class="task-group">${list.map(taskCard).join("")}</div>`:`<div class="empty">这个分类还没有任务。</div>`}<section class="secondary-tools"><h3>更多入口</h3><div class="tool-grid"><button onclick="openTool('dynamic')">动态</button><button onclick="openTool('discover')">发现</button><button onclick="openTool('assistant')">助手</button><button onclick="openTool('watchlist')">想看</button><button onclick="openTool('wishes')">许愿</button><button onclick="openTool('issues')">反馈</button></div>${S.tool?toolPanel():""}</section></section>`}
function taskCard(item){const id=Number(item.tmdb_id),type=mediaType(item),requestID=String(item.request_id||""),tone=taskTone(item),art=poster(item);const expanded=requestID&&S.timelineOpen===requestID;return `<article class="task-card tone-${tone}"><div class="task-card-head">${art?`<img class="poster" src="${esc(art)}" alt="">`:`<span class="poster" aria-hidden="true"></span>`}<span><h4>${item.business_type==="wash"?`<span class="business-badge">洗版</span>`:""}${esc(mediaTitle(item))}</h4><p>${esc(item.status_text||taskNext(item))} · ${esc(fmtDate(item.updated_at||item.created_at))}</p></span><span class="task-state tone-${tone}">${esc(taskNext(item))}</span></div>${taskTrack(item)}<div class="task-actions"><button data-mid="${id}" data-type="${type}" data-season="${Number(item.season)||0}" onclick="openMediaFromElement(this)">${esc(taskNext(item))}</button>${requestID?`<button data-request-id="${esc(requestID)}" aria-expanded="${expanded?"true":"false"}" onclick="toggleTaskTimeline(this)">${expanded?"收起时间线":"展开时间线"}</button>`:""}${requestID?`<button data-request-id="${esc(requestID)}" onclick="openProgressFromElement(this)">查看进度</button>`:""}${item.can_cancel&&requestID?`<button data-request-id="${esc(requestID)}" onclick="cancelTaskFromElement(this)">撤回</button>`:""}</div>${taskTimelineBlock(requestID)}</article>`}
function toggleTaskTimeline(element){const requestID=String(element?.dataset?.requestId||"");if(!requestID)return;if(S.timelineOpen===requestID){S.timelineOpen="";render();return}S.timelineOpen=requestID;if(!S.timelines)S.timelines={};if(!S.timelines[requestID]||S.timelines[requestID].error){S.timelines[requestID]={loading:true};loadTaskTimeline(requestID)}render()}
async function loadTaskTimeline(requestID){const seq=++S.timelineSeq;try{const data=await api('/api/miniapp/v1/progress?request_id='+encodeURIComponent(requestID));if(seq!==S.timelineSeq||S.timelineOpen!==requestID)return;S.timelines[requestID]={events:Array.isArray(data?.events)?data.events:[]};render()}catch(error){if(error?.name==='AbortError'||seq!==S.timelineSeq||S.timelineOpen!==requestID)return;S.timelines[requestID]={error:error.message||'进度暂时不可用'};render()}}
function toolPanel(){if(!S.toolData&&!S.toolError)return'<div class="tool-panel"><span class="empty">加载中…</span></div>';if(S.toolError)return`<div class="tool-panel"><span class="persistent-error">${esc(S.toolError)}</span></div>`;const items=Array.isArray(S.toolData?.items)?S.toolData.items:Array.isArray(S.toolData)?S.toolData:[];return `<div class="tool-panel"><h3>${esc(S.tool)}</h3><div class="tool-list">${items.length?items.map(x=>`<article>${esc(mediaTitle(x)||x.title||x.description||'记录')}<small>${esc(x.state||x.status||x.updated_at||'')}</small></article>`).join(''):'<span class="empty">暂无记录</span>'}</div></div>`}
function dynamicMediaCard(item){const mid=Number(item?.tmdb_id??item?.id);if(!Number.isFinite(mid)||mid<=0)return'';const mt=item?.type==='tv'||item?.media_type==='tv'?'tv':'movie';if(!['movie','tv'].includes(mt))return'';return`<button class="result-row" data-mid="${mid}" data-type="${mt}" data-season="${Number(item?.season)||0}" onclick="openMediaFromElement(this)"><img class="result-poster" src="${esc(poster(item))}" alt=""><span><h4>${esc(mediaTitle(item))}</h4><p>${esc(item?.year||'')}</p></span></button>`}
function openMediaFromElement(element){const mid=Number(element?.dataset?.mid),type=element?.dataset?.type,season=Number(element?.dataset?.season)||0;if(!Number.isFinite(mid)||mid<=0||!['movie','tv'].includes(type))return;openDetail(mid,type,season)}
function detailPage(){const x=S.detail;if(!x)return'<section class="empty">详情加载中…</section>';const mt=mediaType(x),status=x.media_status||{code:'unknown',text:'暂时无法确认'},seasons=(x.seasons||[]).map(s=>`<button class="season-option ${S.season===Number(s.number)?'selected':''}" onclick="selectSeason(${Number(s.number)})">${s.poster_path?`<img src="${esc(s.poster_path.startsWith('http')?s.poster_path:poster({poster_path:s.poster_path}))}" alt="">`:'<span class="poster"></span>'}<span><strong>${esc(s.name||'第 '+s.number+' 季')}</strong><small>${esc(s.air_date||'')} · ${Number(s.episode_count)||0} 集</small></span><em class="${esc(s.status?.code||'unknown')}">${esc(s.status?.text||'未知')}</em></button>`).join('');return`<section class="detail"><div class="detail-hero">${x.backdrop_path?`<img src="${esc(x.backdrop_path)}" alt="">`:''}</div><h2>${esc(mediaTitle(x))}</h2>${x.original_title?`<h3>${esc(x.original_title)}</h3>`:''}<div class="detail-facts"><span class="fact">${mt==='tv'?'剧集':'电影'}</span><span class="fact">${esc(x.year||'年份待定')}</span>${(x.genres||[]).map(g=>`<span class="fact">${esc(g)}</span>`).join('')}</div><div class="media-status"><span><b>${esc(status.text)}</b><small>真实媒体库状态</small></span><span>${Number(x.vote_average||0)?'★ '+Number(x.vote_average).toFixed(1):''}</span></div><p class="detail-copy">${esc(x.overview||'暂无简介')}</p>${mt==='tv'?`<h3>选择季</h3><div class="season-list">${seasons||'<div class="empty">暂无可选季</div>'}</div>`:''}<div class="detail-actions">${detailActionButton(x)}<button class="secondary" onclick="toggleWatchlist(this)">${x.in_watchlist?'取消想看':'加入想看'}</button></div></section>`}
function detailActionButton(x){const status=statusCode(x),season=S.season;if(status==='in_library')return`<button class="primary" onclick="openWashConfirm()">洗版</button>`;if(status==='requested'||status==='subscribed')return`<button class="primary" onclick="goTasks()">查看进度</button>`;if(status==='available')return`<button class="primary" ${x.type==='tv'&&!season?'disabled':''} onclick="openRequestConfirm()">${x.type==='tv'&&!season?'选择季':'求这部'}</button>`;return`<button class="secondary" disabled>状态待确认</button>`}
function showDialog(content){closeDialog();const holder=document.createElement('div');holder.id='dialog';holder.className='backdrop';holder.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1">${content}</div>`;document.body.appendChild(holder);D.returnFocus=document.activeElement;D.controller=new AbortController();D.seq++;holder.addEventListener('click',event=>{if(event.target===holder&&!D.busy)closeDialog()});holder.querySelector('.sheet')?.focus();return{seq:D.seq,signal:D.controller.signal,dialog:holder}}
const D={seq:0,controller:null,busy:false,returnFocus:null};
function isCurrentDialog(seq){return Number(D.seq)===Number(seq)&&document.getElementById('dialog')}
function setDialogBusy(seq,busy){if(!isCurrentDialog(seq))return;D.busy=busy;document.getElementById('dialog')?.setAttribute('aria-busy',String(busy))}
function closeDialog(){const node=document.getElementById('dialog');const restore=D.returnFocus;D.controller?.abort();D.controller=null;D.busy=false;if(node)node.remove();D.seq++;D.returnFocus=null;if(restore?.isConnected)restore.focus?.({preventScroll:true})}
function handleDialogKeys(event){const dialog=document.getElementById('dialog');if(!dialog)return;if(event.key==='Escape'){if(!D.busy){event.preventDefault();closeDialog()}return}if(event.key!=='Tab')return;const items=[...dialog.querySelectorAll('button:not([disabled]),input,textarea,select,[tabindex]:not([tabindex="-1"])')];if(!items.length)return;const first=items[0],last=items.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}
document.addEventListener('keydown',handleDialogKeys);
function openRequestConfirm(){const x=S.detail;const season=x.type==='tv'?S.season:0;if(x.type==='tv'&&season<=0){toast('请选择季');return}const ctx=showDialog(`<button class="sheet-close" aria-label="关闭" onclick="closeDialog()">×</button><h2 id="dialog-title">确认求片</h2><p>将提交 ${esc(mediaTitle(x))}${season?' · 第 '+season+' 季':''}，进入审核后可在任务中查看。</p><div class="sheet-actions"><button class="secondary" onclick="closeDialog()">再看看</button><button class="primary" onclick="submitRequest(this)">确认求片</button></div>`);return ctx}
function openWashConfirm(){const x=S.detail;const season=x.type==='tv'?S.season:0;if(x.type==='tv'&&season<=0){toast('请选择季');return}showDialog(`<button class="sheet-close" aria-label="关闭" onclick="closeDialog()">×</button><h2 id="dialog-title">确认洗版</h2><p>已有内容换个更好的版本。新版本确认可用前，旧版会保留。</p><div class="sheet-actions"><button class="secondary" onclick="closeDialog()">再看看</button><button class="primary" onclick="submitWash(this)">确认洗版</button></div>`)}
function submissionStatusText(status){const labels={created:'已创建',duplicate_own:'已有你的相同任务',duplicate_other:'已有相同任务',not_bound:'未提交：账号尚未绑定',quota_exceeded:'未提交：额度不足',failed:'提交未完成'};return labels[status]||`状态待确认${status?'（'+status+'）':''}`}
function submissionResultTitle(status,businessType){const label=businessType==='wash'?'洗版':'求片';if(status==='created')return label+'任务已提交';if(status==='duplicate_own'||status==='duplicate_other')return label+'任务已存在';if(status==='failed')return label+'提交失败';return label+'提交结果'}
function showSubmissionResult(result,businessType){const detail=S.detail||{};const wash=businessType==='wash';const status=String(result.status??'');const message=typeof result.message==='string'?result.message:'';const rawRequestID=wash?String(result.request_id??''):typeof result.request_id==='string'?result.request_id:'';const requestID=wash?rawRequestID:['created','duplicate_own'].includes(status)&&/^[A-Za-z0-9_-]{1,128}$/.test(rawRequestID)?rawRequestID:'';const typeLabel=mediaType(detail)==='tv'?'剧集':'电影';const season=mediaType(detail)==='tv'&&Number(S.season)>0?' · 第 '+Number(S.season)+' 季':'';const requestLine=requestID?`<div><dt>任务编号</dt><dd><code>${esc(requestID)}</code></dd></div>`:'';showDialog(`<button class="sheet-close" aria-label="关闭提交结果" onclick="closeDialog()">×</button><h2 id="dialog-title">${esc(submissionResultTitle(status,businessType))}</h2><div class="submission-identity${status==='failed'?' submission-failed':''}"><strong>${esc(mediaTitle(detail))}</strong><span>${typeLabel}${season}</span></div><dl class="submission-meta"><div><dt>当前状态</dt><dd>${esc(submissionStatusText(status))}</dd></div>${requestLine}</dl>${message?`<p class="submission-message">${esc(message)}</p>`:''}${wash?'<p class="wash-result-note">新版本确认可用前，旧版会保留。</p>':''}<div class="sheet-actions">${!wash&&status==='failed'&&result.retryable!==false?'<button class="primary" onclick="openRequestConfirm()">重试</button>':''}${requestID?'<button class="primary" onclick="viewSubmittedTasks()">查看任务</button>':''}<button class="secondary" onclick="continueFinding()">继续找片</button></div>`);const tone=status==='created'?'success':status.startsWith('duplicate_')?'warning':'error';tg?.HapticFeedback?.notificationOccurred?.(tone)}
function viewSubmittedTasks(){goTasks()}
function continueFinding(){closeDialog();S.detailVisible=false;S.view='search';render();document.getElementById('q')?.focus()}
function requestFailureResult(error){const body=error?.body&&typeof error.body==='object'?error.body:{};const bodyStatus=typeof body.status==='string'?body.status:'';const knownStatus=['not_bound','quota_exceeded','in_library','upcoming','unknown','failed'].includes(bodyStatus)?bodyStatus:'failed';const message=Number(error?.status)===401?'身份验证已失效，请重新打开 Mini App':typeof body.message==='string'&&body.message.trim()?body.message:typeof error?.message==='string'&&error.message.trim()?error.message:'提交失败，请稍后再试';return{status:Number(error?.status)===401?'failed':knownStatus,message,retryable:Number(error?.status)!==401}}
async function submitRequest(button){const ctx={seq:D.seq,signal:D.controller?.signal,dialog:document.getElementById('dialog')};if(!isCurrentDialog(ctx.seq))return;setDialogBusy(ctx.seq,true);button.disabled=true;const x=S.detail;try{const result=await api('/api/miniapp/v1/request',{method:'POST',signal:ctx.signal,body:JSON.stringify({tmdb_id:Number(mediaID(x)),type:mediaType(x),season:mediaType(x)==='tv'?S.season:0})});if(!isCurrentDialog(ctx.seq))return;S.tasks=null;showSubmissionResult(result,'request')}catch(error){if(error?.name==='AbortError'||!isCurrentDialog(ctx.seq))return;const failure=requestFailureResult(error);showSubmissionResult(failure,'request')}}
async function submitWash(button){const ctx={seq:D.seq,signal:D.controller?.signal,dialog:document.getElementById('dialog')};if(!isCurrentDialog(ctx.seq))return;setDialogBusy(ctx.seq,true);button.disabled=true;const x=S.detail;const season=x.type==='tv'?S.season:0;const payload={tmdb_id:Number(mediaID(x)),type:mediaType(x),season};try{const result=await api('/api/miniapp/v1/wash',{method:'POST',signal:ctx.signal,body:JSON.stringify(payload)});if(!isCurrentDialog(ctx.seq))return;S.tasks=null;showSubmissionResult(result,'wash')}catch(error){if(error?.name==='AbortError'||!isCurrentDialog(ctx.seq))return;setDialogBusy(ctx.seq,false);button.disabled=false;toast(error.message||'洗版失败')}}
async function toggleWatchlist(button){const x=S.detail,adding=!x.in_watchlist;button.disabled=true;try{await api('/api/miniapp/v1/watchlist',{method:adding?'POST':'DELETE',body:JSON.stringify({tmdb_id:Number(mediaID(x)),type:mediaType(x)})});x.in_watchlist=adding;button.textContent=adding?'取消想看':'加入想看';tg?.HapticFeedback?.notificationOccurred?.('success');toast(adding?'已加入想看':'已取消想看')}catch(error){toast(error.message||'操作失败')}finally{button.disabled=false}}
function openDetail(mid,type,wantedSeason=0){closeDialog();invalidatePageRequests();const seq=++S.detailSeq;S.detailFrom=S.view;S.detailVisible=true;S.detail=null;render();const season=Number(wantedSeason)||0;api('/api/miniapp/v1/detail?id='+encodeURIComponent(mid)+'&type='+encodeURIComponent(type)+(season?'&season='+season:'')).then(detail=>{if(seq!==S.detailSeq||!S.detailVisible)return;S.detail=detail;S.season=type==='tv'&&season?season:Number(detail.seasons?.[0]?.number)||0;if(type==='tv'&&S.season){S.detail.media_status=detail.seasons?.find(s=>Number(s.number)===S.season)?.status||detail.media_status}render()}).catch(error=>{if(seq!==S.detailSeq||!S.detailVisible)return;S.detail={type,title:'详情暂时不可用',overview:error.message,media_status:{code:'unknown',text:'状态待确认'}};render()})}
function selectSeason(number){S.season=Number(number)||0;if(S.detail?.type==='tv'){const season=S.detail.seasons?.find(x=>Number(x.number)===S.season);S.detail.media_status=season?.status||{code:'unknown',text:'暂时无法确认'}}render()}
function backDetail(){closeDialog();S.detailSeq++;S.detailVisible=false;render()}
function submitSearch(event){event.preventDefault();const input=event.currentTarget.querySelector('input');S.query=input.value.trim();S.view='search';S.results=[];S.searchError='';render();if(S.query)searchNow(false)}
function startSearchMode(mode){if(!['request','wash'].includes(mode))return;S.mode=mode;S.view='search';render();document.getElementById('q')?.focus()}
function setSearchType(type){if(!['all','movie','tv'].includes(type))return;S.searchType=type;render();if(S.query)searchNow(false)}
let searchController=null;
async function searchNow(append=false,page=1){searchController?.abort();const controller=new AbortController();searchController=controller;const seq=++S.searchSeq;const current={query:S.query,type:S.searchType};S.loading=true;render();try{const typeQuery=current.type==='all'?'':'&type='+current.type;const response=await api('/api/miniapp/v1/search?q='+encodeURIComponent(current.query)+'&page='+page+'&limit=12'+typeQuery,{signal:controller.signal});if(seq!==S.searchSeq||S.view!=='search'||S.query!==current.query||S.searchType!==current.type)return;if(!append)rememberSearch(current.query);S.results=append?[...S.results,...(response.results||[])]:response.results||[];S.hasMore=!!response.has_more;S.nextPage=Number(response.next_page)||page+1;S.searchError=''}catch(error){if(error?.name==='AbortError'||seq!==S.searchSeq||S.view!=='search')return;const e=error;S.searchError=e.message;S.results=[]}finally{if(seq===S.searchSeq&&S.view==='search'){S.loading=false;searchController=null;render()}}}
function loadMoreSearch(){if(!S.loading&&S.hasMore)searchNow(true,S.nextPage)}
function taskFilterValue(){return S.taskFilter||'all'}
function setTaskFilter(value){S.taskFilter=value;render()}
async function loadTasks(){const seq=++S.meSeq;try{const response=await api('/api/miniapp/v1/me');if(seq!==S.meSeq||S.view!=='tasks')return;S.tasks={...response,requests:Array.isArray(response.requests)?response.requests:[]};render()}catch(error){if(seq!==S.meSeq||S.view!=='tasks')return;S.tasks={requests:[],error:error.message};render()}}
async function loadHome(){const seq=++S.homeSeq;if(S.tasks?.error)S.tasks={...S.tasks,error:''};if(S.homeDynamic?.error)S.homeDynamic={...S.homeDynamic,error:''};S.homeLoading=true;render();const results=await Promise.allSettled([api('/api/miniapp/v1/me'),api('/api/miniapp/v1/dynamic')]);if(seq!==S.homeSeq||S.view!=='home'||S.detailVisible)return;const me=results[0],dynamic=results[1];S.tasks=me.status==='fulfilled'?{...me.value,requests:Array.isArray(me.value.requests)?me.value.requests:[]}:{requests:[],error:me.reason?.message||'任务加载失败'};S.homeDynamic=dynamic.status==='fulfilled'?dynamic.value:{recently_added:[],error:dynamic.reason?.message||'媒体库加载失败'};S.homeLoading=false;render()}
function goTasks(){closeDialog();S.detailVisible=false;S.view='tasks';S.tasks=null;render()}
function openProgressFromElement(element){openProgress(element.dataset.requestId)}
async function openProgress(requestID){const ctx=showDialog('<h2 id="dialog-title">任务进度</h2><div class="empty">正在加载时间线…</div>');try{const data=await api('/api/miniapp/v1/progress?request_id='+encodeURIComponent(requestID),{signal:ctx.signal});if(!isCurrentDialog(ctx.seq))return;const d=data;const events=Array.isArray(d.events)?d.events:[];document.querySelector('#dialog .sheet').innerHTML=`<button class="sheet-close" aria-label="关闭" onclick="closeDialog()">×</button><h2 id="dialog-title">任务进度</h2><div class="timeline">${events.map(event=>{const nodeTone=event.code==='completed'||event.code==='download_complete'?'done':'active';return`<div class="timeline-item"><span class="timeline-node timeline-${nodeTone}" aria-label="进度节点"></span><span><strong>${esc(event.text)}</strong><small>${esc(fmtDate(event.at))}</small></span></div>`}).join('')||'<div class="empty">暂无进度记录</div>'}</div>`}catch(error){if(error?.name==='AbortError'||!isCurrentDialog(ctx.seq))return;document.querySelector('#dialog .sheet').innerHTML=`<h2 id="dialog-title">进度暂时不可用</h2><p>${esc(error.message)}</p>`}}
async function cancelTaskFromElement(element){if(DEMO){toast('Demo 只读');return}const requestID=String(element.dataset.requestId||'');const ctx=showDialog(`<h2 id="dialog-title">撤回任务？</h2><p>撤回后会停止这条待审核任务。</p><div class="sheet-actions"><button class="secondary" onclick="closeDialog()">保留</button><button class="danger" data-request-id="${esc(requestID)}" onclick="cancelTaskFromDialog(this)">确认撤回</button></div>`);ctx}
function cancelTaskFromDialog(element){cancelTask(element.dataset.requestId)}
async function cancelTask(requestID){const ctx={seq:D.seq,signal:D.controller?.signal};if(!isCurrentDialog(ctx.seq))return;setDialogBusy(ctx.seq,true);try{await api('/api/miniapp/v1/request/cancel',{method:'POST',signal:ctx.signal,body:JSON.stringify({request_id:requestID})});if(!isCurrentDialog(ctx.seq))return;closeDialog();toast('任务已撤回');S.tasks=null;render()}catch(error){if(error?.name==='AbortError'||!isCurrentDialog(ctx.seq))return;setDialogBusy(ctx.seq,false);toast(error.message||'撤回失败')}}
async function openTool(tool){const paths={dynamic:'/api/miniapp/v1/dynamic',discover:'/api/miniapp/v1/discover',assistant:'/api/miniapp/v1/assistant',watchlist:'/api/miniapp/v1/watchlist',wishes:'/api/miniapp/v1/wishes',issues:'/api/miniapp/v1/issues'};if(!paths[tool])return;const seq=++S.toolSeq;S.tool=tool;S.toolData=null;S.toolError='';render();try{const data=await api(paths[tool]);if(seq!==S.toolSeq||S.view!=='tasks'||S.tool!==tool)return;S.toolData=data;render()}catch(error){if(seq!==S.toolSeq||S.view!=='tasks'||S.tool!==tool)return;S.toolError=error.message;render()}}
function invalidatePageRequests(){searchController?.abort();searchController=null;S.loading=false;S.searchSeq++;S.detailSeq++;S.meSeq++;S.homeSeq++;S.homeLoading=false;S.toolSeq++}
function navigate(view){closeDialog();invalidatePageRequests();S.detailVisible=false;if(view==='search'){S.view='search';render();return}if(view==='tasks'){S.view='tasks';S.tasks=null;render();return}}
function goHome(){closeDialog();invalidatePageRequests();S.detailVisible=false;S.view='home';render()}
function showNativeBack(){tg?.BackButton?.show()}
function syncBack(){if(S.detailVisible)showNativeBack();else tg?.BackButton?.hide?.()}

<style>
:root{--cinema-success:#34c759;--cinema-primary:#1c3d73;--cinema-line:#ececec;--cinema-muted:#6e6e73}
body{background:var(--tg-theme-bg-color,#fff);color:#111}.shell{max-width:430px;padding:calc(var(--safe-top) + 12px) 10px calc(var(--safe-bottom) + 18px)}
.app-dock{display:none}.cinema-card{overflow:hidden;margin:0 0 14px;border:1px solid var(--cinema-line);border-radius:18px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.cinema-hero{position:relative;height:148px;background:linear-gradient(160deg,#1b1430,#0b0d18);overflow:hidden}.cinema-hero img{width:100%;height:100%;object-fit:cover}.cinema-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.62))}.cinema-credit{position:absolute;z-index:1;left:14px;bottom:12px;color:#fff;font-size:11px;letter-spacing:.12em;opacity:.85}
.cinema-copy{padding:14px 14px 8px}.cinema-kicker{font-size:11px;letter-spacing:.18em;color:#8e8e93;font-weight:600}.cinema-copy h1{margin:0;font-size:22px;line-height:1.45;letter-spacing:-.03em;font-weight:700}.cinema-tag{margin-top:4px;font-size:15px}.cinema-body{margin-top:8px;color:#3c3c43;font-size:14px;line-height:1.45}.cinema-status{margin-top:10px;color:var(--cinema-muted);font-size:12px}.cinema-rule{height:1px;margin-top:10px;background:#eee}
.cinema-facts{width:100%;margin-top:8px;border-collapse:collapse;font-size:13px}.cinema-facts td{padding:5px 0;border-bottom:1px solid #f1f1f1;color:#3c3c43}.cinema-facts td:first-child{width:38%;color:#8e8e93}
.cinema-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}.cinema-button{min-height:44px;padding:11px 8px;border:0;border-radius:12px;color:#fff;font-size:14px;font-weight:600}.cinema-button.success{background:var(--cinema-success)}.cinema-button.primary{background:var(--cinema-primary)}
.cinema-search-form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.cinema-search-form input{min-width:0;padding:10px 12px;border:1px solid #ddd;border-radius:12px;color:#111;background:#fff}
.cinema-list{display:grid;gap:10px;padding:0 12px 12px}.cinema-result{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:8px;border:1px solid #eee;border-radius:12px;text-align:left;color:#111}.cinema-result img{width:58px;height:87px;object-fit:cover;border-radius:7px}.cinema-result strong,.cinema-result small{display:block}.cinema-result small{margin-top:5px;color:#6e6e73}
.cinema-task-list{display:grid;gap:12px}.cinema-empty{padding:22px 14px;color:#6e6e73;text-align:center}
.detail,.sheet{color:var(--tg-theme-text-color,#111)}
</style>
<script>
function startRoute(){const q=new URLSearchParams(location.search);const raw=String(q.get("tgWebAppStartParam")||q.get("start_param")||"home").trim();if(raw==="tasks"||raw==="progress")return{view:"tasks"};if(raw==="search")return{view:"search"};const m=raw.match(/^detail_(\d+)_(movie|tv)(?:_(\d+))?$/);if(m)return{view:"detail",id:Number(m[1]),type:m[2],season:Number(m[3]||0)};return{view:"home"}}
function miniBackdrop(item){const p=String(item?.backdrop_path||item?.backdrop||"");if(!p)return"";return p.startsWith("http")?p:"https://image.tmdb.org/t/p/w1280"+p}
function cinemaButtons(rows){return `<div class="cinema-buttons">${rows.flat().map(b=>`<button class="cinema-button ${b.style||"primary"}" onclick="${b.action}">${b.text}</button>`).join("")}</div>`}
function chrome(content){return content}
function homePage(){const featured=(S.homeDynamic?.featured||[]).find(x=>miniBackdrop(x))||null;const art=featured?miniBackdrop(featured):"";return `<section class="cinema-card" id="welcome"><div class="cinema-hero">${art?`<img src="${esc(art)}" alt="">`:""}<span class="cinema-credit">YUNHAI · CINEMA</span></div><div class="cinema-copy"><h1>云海求片</h1><div class="cinema-tag">想看的，交给云海</div><div class="cinema-body">直接发片名，或点搜索。提交后可在进度里查到。</div><div class="cinema-status">在线 · 可求片</div></div>${cinemaButtons([[{text:"搜索求片",style:"success",action:"navigate(\\\"search\\\")"},{text:"求片进度",action:"navigate(\\\"tasks\\\")"}],[{text:"帮助",action:"showHelp()"},{text:"更多",action:"showMore()"}]])}</section>`}
function searchPage(){return `<section class="cinema-card" id="search"><div class="cinema-copy"><h1>搜索求片</h1><div class="cinema-tag">发中文或英文片名</div><div class="cinema-body">点结果看详情，确认后再提交。已在库的会直接告诉你。</div><form class="cinema-search-form" onsubmit="submitSearch(event)"><input id="q" value="${esc(S.query)}" placeholder="输入片名，中英文都行" autocomplete="off"><button class="cinema-button success" type="submit">搜索求片</button></form></div>${cinemaButtons([[{text:"返回",action:"goHome()"},{text:"求片进度",action:"navigate(\\\"tasks\\\")"}]])}<div class="cinema-list">${S.loading?`<div class="cinema-empty">正在搜索…</div>`:(S.results||[]).map(x=>{const id=Number(mediaID(x)),type=mediaType(x),art=poster(x);return`<button class="cinema-result" onclick="openDetail(${id},\\\"${type}\\\",0)">${art?`<img src="${esc(art)}" alt="">`:"<span></span>"}<span><strong>${esc(mediaTitle(x))}</strong><small>${esc(x.year||"")} · ${esc(x?.media_status?.text||"可求片")}</small></span></button>`}).join("")}</div></section>`}
function taskFacts(item){const kind=mediaType(item)==="tv"?"剧集":"电影";const next=item?.status_text||"等待确认";return `<table class="cinema-facts"><tr><td>年份</td><td>${esc(item?.media_year||item?.year||"—")}</td></tr><tr><td>类型</td><td>${kind}</td></tr><tr><td>下一步</td><td>${esc(next)}</td></tr></table>`}
function taskPlaybill(item){const title=mediaTitle(item);const status=item?.status_text||"等待确认";const sentence=status.includes("入库")?"Emby 确认可看后会再通知你。":"进度变化后会在聊天里通知你。";return `<article class="cinema-card"><div class="cinema-copy"><div class="cinema-kicker">NOW PLAYING</div><h1>${esc(title)}</h1><div class="cinema-tag">${esc(status)}</div><div class="cinema-body">${sentence}</div>${taskFacts(item)}</div>${cinemaButtons([[{text:"主菜单",action:"goHome()"},{text:"刷新",action:"loadTasks()"}]])}</article>`}
function tasksPage(){const items=S.tasks?.requests||[];return `<section class="cinema-task-list" id="progress">${items.length?items.map(taskPlaybill).join(""):`<article class="cinema-card"><div class="cinema-copy"><div class="cinema-kicker">NOW PLAYING</div><h1>求片进度</h1><div class="cinema-tag">提交过的片在这里</div><div class="cinema-body">还没有记录的话，可以先去搜索求片。</div></div>${cinemaButtons([[{text:"主菜单",action:"goHome()"},{text:"刷新",action:"loadTasks()"}]])}</article>`}</section>`}
function showHelp(){document.getElementById("app").innerHTML=`<section class="cinema-card"><div class="cinema-copy"><h1>帮助</h1><div class="cinema-tag">三步就能求到</div><div class="cinema-body">发片名 → 选结果 → 等审核。通过后会开始下载，可看时再通知你。</div></div>${cinemaButtons([[{text:"搜索求片",style:"success",action:"navigate(\\\"search\\\")"},{text:"返回",action:"goHome()"}]])}</section>`}
function showMore(){document.getElementById("app").innerHTML=`<section class="cinema-card"><div class="cinema-copy"><h1>更多</h1><div class="cinema-tag">不常用的入口</div><div class="cinema-body">洗版、许愿、设置都在这，不影响正常求片。</div></div>${cinemaButtons([[{text:"洗版",action:"startSearchMode(\\\"wash\\\")"},{text:"许愿池",action:"navigate(\\\"tasks\\\")"}],[{text:"设置",action:"navigate(\\\"tasks\\\")"},{text:"返回",action:"goHome()"}]])}</section>`}
async function loadHome(){const seq=++S.homeSeq;S.homeLoading=true;const results=await Promise.allSettled([api("/api/miniapp/v1/me"),api("/api/miniapp/v1/discover")]);if(seq!==S.homeSeq||S.view!=="home")return;S.tasks=results[0].status==="fulfilled"?results[0].value:{requests:[]};S.homeDynamic=results[1].status==="fulfilled"?results[1].value:{featured:[]};S.homeLoading=false;render()}
function navigate(view){closeDialog();invalidatePageRequests();S.detailVisible=false;if(view==="home"){S.view="home";render();return}if(view==="search"){S.view="search";render();return}if(view==="tasks"){S.view="tasks";S.tasks=null;render();return}}
function goHome(){navigate("home")}
const approvedStartRoute=startRoute();S.view=approvedStartRoute.view==="detail"?"home":approvedStartRoute.view;if(approvedStartRoute.view==="detail")setTimeout(()=>openDetail(approvedStartRoute.id,approvedStartRoute.type,approvedStartRoute.season),0);
</script>

render();initTelegramWebApp();syncBack();
</script>
