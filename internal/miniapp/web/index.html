<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>YiMao 任务中心</title>
<style>
:root {

}
*{box-sizing:border-box;letter-spacing:0}

.shell{width:100%;max-width:760px;min-width: 0;min-height:100dvh;margin:0 auto;padding:calc(var(--safe-top) + 12px) 16px var(--dock-clearance);padding-bottom: var(--dock-clearance);overflow-x: clip}
.topbar{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}

.home-active{display:grid;gap:10px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.section-title h2{margin:0;font-size:18px}.section-title span{color:var(--dim);font-size:11px}

.tasks-page{display:grid;gap:14px}.task-filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:8px;background:var(--panel)}.task-filters button{min-height:44px;border-radius:6px;color:var(--muted);font-size:11px}.task-filters button.active{background:var(--panel-2);color:var(--ink)}.task-group{display:grid;gap:8px}.task-group h3{margin:8px 0 0;font-size:13px}.task-card{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;min-width:0;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.task-card h4{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.task-card p{margin:4px 0;color:var(--muted);font-size:11px}.task-card .task-actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.task-card .task-actions button{min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:5px;color:var(--accent);font-size:11px}.business-badge{display:inline-block;margin-right:5px;padding:2px 5px;border-radius:3px;background:rgba(255,112,93,.15);color:var(--accent);font-size:10px}
.adventure-page{display:grid;gap:14px}.quest-panel{display:grid;gap:13px;padding:15px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.quest-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.quest-head strong{font-size:15px}.quest-head small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.quest-score{text-align:right;color:var(--warn)}.quest-scene{min-height:150px;display:grid;align-content:end;padding:15px;border-radius:7px;background:var(--panel-2);overflow:hidden}.quest-scene h2{margin:0;font-size:20px}.quest-scene p{margin:4px 0 0;color:var(--muted);font-size:12px}.quest-choice-list{display:grid;gap:7px}.quest-choice{display:grid;grid-template-columns:30px minmax(0,1fr);align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:6px;text-align:left}.quest-choice b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--panel-2);color:var(--accent)}.quest-result{padding:10px;border-left:3px solid var(--good);background:rgba(115,211,155,.08);font-size:12px;line-height:1.45}.quest-tools{display:flex;justify-content:space-between;gap:8px}.quest-tools button{min-height:44px;color:var(--muted);font-size:11px}.adventure-empty{padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.adventure-empty h2{margin:0;font-size:20px}.adventure-empty p{color:var(--muted);font-size:13px;line-height:1.5}
.secondary-tools{display:grid;gap:8px;margin-top:5px}.secondary-tools h3{margin:0;color:var(--muted);font-size:12px}.tool-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tool-grid button{min-height:44px;border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:11px}.tool-panel{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.tool-panel h3{margin:0;font-size:14px}.tool-list{display:grid;gap:6px}.tool-list article{padding:9px;border-bottom:1px solid var(--line);font-size:12px}.tool-list article small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.empty{padding:20px 10px;text-align:center;color:var(--muted);font-size:13px}
.app-dock{position:fixed;z-index:20;right:0;bottom:0;left:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:calc(var(--dock-height) + var(--safe-bottom));padding:4px max(10px,env(safe-area-inset-left, 0px)) var(--safe-bottom) max(10px,env(safe-area-inset-right, 0px));border-top:1px solid var(--line);background:rgba(11,13,16,.97)}.app-dock button{min-height:44px;color:var(--muted);font-size:11px}.app-dock button[aria-current="page"]{color:var(--accent);font-weight:720}.app-dock svg{width:18px;height:18px;display:block;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:1.8}
.toast{position:fixed;z-index:40;right:16px;bottom:calc(var(--dock-clearance) + 4px);left:16px;max-width:500px;margin:auto;padding:11px 13px;border-radius:7px;background:var(--panel-2);box-shadow:0 8px 24px #0008;color:var(--ink);font-size:12px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .18s ease,transform .18s ease}.toast.show{opacity:1;transform:none}
.backdrop{position:fixed;z-index:30;inset:0;display:grid;align-items:end;padding:14px;background:#0009}.sheet{max-width:600px;width:100%;max-height:calc(100dvh - 28px);margin:auto;overflow:auto;padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.sheet-close{float:right;width:44px;height:44px;font-size:24px;color:var(--muted)}.sheet h2{margin:5px 44px 10px 0;font-size:20px}.sheet p{color:var(--muted);font-size:13px;line-height:1.5}.sheet-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}.submission-identity{display:grid;gap:4px;padding:11px;border-left:3px solid var(--good);background:rgba(115,211,155,.08)}.submission-identity strong{font-size:14px}.submission-identity span{color:var(--muted);font-size:11px}.submission-meta{display:grid;gap:8px;margin:14px 0}.submission-meta div{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;align-items:start}.submission-meta dt{color:var(--muted);font-size:12px}.submission-meta dd{min-width:0;margin:0;font-size:12px;overflow-wrap:anywhere}.submission-meta code{color:var(--ink);font-size:11px}.wash-result-note{padding:10px;border-left:3px solid var(--warn);background:rgba(241,189,103,.08)}.timeline{display:grid;gap:0;margin:15px 0}.timeline-item{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);gap:9px;min-height:48px}.timeline-item::before{content:"";position:absolute;top:17px;bottom:-1px;left:8px;width:1px;background:var(--line)}.timeline-item:last-child::before{display:none}.timeline-node{position:relative;z-index:1;width:17px;height:17px;margin-top:2px;border:3px solid var(--accent);border-radius:50%;background:var(--panel)}.timeline-node.timeline-done{border-color:var(--good)}.timeline-item strong{font-size:12px}.timeline-item small{display:block;margin-top:3px;color:var(--muted);font-size:10px}
@media (max-width: 350px){.shell{padding-right:12px;padding-left:12px}.task-entry-grid{gap:5px}.task-entry{padding:10px 7px}.result-lead{grid-template-columns:84px minmax(0,1fr);gap:9px}.result-lead .result-poster{width:84px}.detail-actions{grid-template-columns:1fr}.task-filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width: 900px){.shell{max-width:900px;padding-right:28px;padding-left:28px}.action-home{grid-template-columns:1.15fr .85fr;align-items:start}.action-home .home-context,.action-home .home-search{grid-column:1}.action-home .task-entry-grid,.action-home .home-active{grid-column:2}.result-section{max-width:760px}.detail-hero{max-height:360px}}

</style>
</head>
<body>
<main id="app" class="shell"><section class="boot-fallback" aria-live="polite"><div class="topbar"><h1>YiMao 任务中心</h1></div><div class="empty">正在打开任务中心…</div></section></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
function telegramWebApp(){return window.Telegram?.WebApp}
let tg=telegramWebApp();
let telegramBackBound=false;
function initTelegramWebApp(){tg=telegramWebApp();if(!tg)return;tg.ready();tg.expand?.();tg.setHeaderColor?.('#0b0d10');tg.setBackgroundColor?.('#0b0d10');if(!telegramBackBound&&tg.BackButton){tg.BackButton.onClick(()=>{if(S.detailVisible)backDetail();else if(S.view!=='search')navigate('search')});telegramBackBound=true}syncBack()}
const DEMO=new URLSearchParams(location.search).get('demo')==='1';
const S={view:'home',query:'',searchType:'all',searchMode:'request',results:[],searchError:'',loading:false,searchSeq:0,detailSeq:0,meSeq:0,detail:null,detailFrom:'home',detailVisible:false,season:0,tasks:null,adventure:null,tool:'',toolData:null,toolError:'',submitting:false};
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const mediaTitle=x=>String(x?.title||x?.name||x?.media_title||'未命名');
const mediaType=x=>x?.type==='tv'||x?.media_type==='tv'||x?.media_type==='电视剧'?'tv':'movie';
const mediaID=x=>x?.tmdb_id??x?.id??0;
const poster=x=>{const p=x?.poster_path||x?.poster||'';return p?(String(p).startsWith('http')?p:'https://image.tmdb.org/t/p/w342'+p):''};
const fmtDate=value=>{if(!value)return'';try{return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value))}catch{return''}};
const demoMedia=(id,type,title,year,posterPath)=>({tmdb_id:id,media_type:type,title,year,vote_average:8.2,poster_path:posterPath||'',original_title:title,genres:['剧情'],media_status:{code:'available',text:'可以求片'}});
const demoAdventure={run_id:'demo-run',movie_title:'星际穿越',phase:'playing',level:2,total_levels:5,hp:86,max_hp:100,score:120,combo:1,scene_title:'穿过潮汐',description:'潮汐正在改变航线，你要做出选择。',choices:[{index:0,text:'调整引擎'},{index:1,text:'等待窗口'}]};
function demoResponse(path,options={}){const method=(options.method||'GET').toUpperCase();if(DEMO&&method!=='GET'){if(path.includes('/adventure'))return{ok:true,status:200,json:async()=>({ok:true,state:demoAdventure})};if(path.includes('/request'))return{ok:true,status:201,json:async()=>({ok:true,status:'created',request_id:'demo-request'})};if(path.includes('/wash'))return{ok:true,status:201,json:async()=>({ok:true,status:'created',request_id:'demo-wash'})};return{ok:true,status:200,json:async()=>({ok:true})}}
if(!DEMO)return null;const p=String(path);const base='https://images.unsplash.com/photo-';const movie=demoMedia(101,'movie','星际穿越','2014',base+'1500534623283-312aade485b7?auto=format&fit=crop&w=600');const tv={...demoMedia(102,'tv','真探','2014',base+'1478720568477-152d9b164e26?auto=format&fit=crop&w=600'),media_status:{code:'in_library',text:'已在库中'}};
if(p.includes('/adventure'))return{ok:true,status:200,json:async()=>({ok:true,state:demoAdventure})};
if(p.includes('/search'))return{ok:true,status:200,json:async()=>({results:[movie,tv],page:1,limit:12,has_more:false})};
if(p.includes('/detail'))return{ok:true,status:200,json:async()=>({...movie,quota:{movie_used:1,movie_limit:5,tv_used:1,tv_limit:5},in_watchlist:false})};
if(p.includes('/progress'))return{ok:true,status:200,json:async()=>({request_id:'demo-request',events:[{code:'created',text:'已提交求片',at:'2026-08-01T10:00:00Z'},{code:'approved',text:'审核通过',at:'2026-08-01T12:00:00Z'}]})};
if(p.includes('/me'))return{ok:true,status:200,json:async()=>({requests:[{request_id:'demo-request',tmdb_id:101,media_title:'星际穿越',media_year:2014,media_type:'movie',status:'approved',status_text:'处理中',status_group:'active',business_type:'request',created_at:'2026-08-01T10:00:00Z',poster_path:movie.poster_path,can_cancel:false},{request_id:'demo-wash',tmdb_id:102,media_title:'真探',media_year:2014,media_type:'tv',season:1,status:'completed',status_text:'洗版完成',status_group:'done',business_type:'wash',created_at:'2026-07-01T10:00:00Z',poster_path:tv.poster_path,can_cancel:false}],user:{first_name:'Demo'}})};
if(p.includes('/dynamic'))return{ok:true,status:200,json:async()=>({recently_added:[{tmdb_id:101,type:'movie',title:'星际穿越',year:2014,poster_path:movie.poster_path}],just_available:[{tmdb_id:102,type:'tv',title:'真探',year:2014,poster_path:tv.poster_path}],recent_requests:[]})};

class APIError extends Error{constructor(message,status=0,body=null){super(message);this.status=status;this.body=body}}
async function api(path,options={}){const demo=demoResponse(path,options);if(demo)return demo.json();let response;try{response=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||'',...(options.headers||{})}})}catch(error){if(error?.name==='AbortError')throw error;throw new APIError('网络连接不稳定，请稍后再试')}if(!response.ok){let body=null;try{body=await response.json()}catch{}const message=typeof body?.message==='string'?body.message:response.status>=500?'服务暂时繁忙，请稍后再试':response.status===401?'Mini App 会话已过期，请从 Telegram 重新打开':'请求没有完成，请稍后再试';throw new APIError(message,response.status,body)}return response.json()}
function toast(message){const node=document.getElementById('toast');node.textContent=message;node.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.classList.remove('show'),2400)}
function icon(name){if(name==='search')return'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>';if(name==='tasks')return'<svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"></path><path d="m8 12 2 2 5-5"></path></svg>';return'<svg viewBox="0 0 24 24"><path d="M8 8h8a5 5 0 0 1 4.5 7l-1 2a2.5 2.5 0 0 1-4.1.6L14 16H10l-1.4 1.6a2.5 2.5 0 0 1-4.1-.6l-1-2A5 5 0 0 1 8 8Z"></path><path d="M8 11v4M6 13h4M16 12h.01M18 14h.01"></path></svg>'}
function chrome(content,active=S.view){const current=active==='tasks'?'tasks':active==='adventure'?'adventure':'search';return `<div class="topbar"><h1>YiMao 任务中心</h1><small>${DEMO?'Demo 只读':'私人影视任务中心'}</small></div>${content}<nav class="app-dock" aria-label="主导航"><button data-view="search" ${current==='search'?'aria-current="page"':''} onclick="navigate('search')">${icon('search')}找片</button><button data-view="tasks" ${current==='tasks'?'aria-current="page"':''} onclick="navigate('tasks')">${icon('tasks')}任务</button><button data-view="adventure" ${current==='adventure'?'aria-current="page"':''} onclick="navigate('adventure')">${icon('adventure')}闯关</button></nav>`}
function render(){const body=S.detailVisible?detailPage():S.view==='home'?homePage():S.view==='search'?searchPage():S.view==='tasks'?tasksPage():adventurePage();document.getElementById('app').innerHTML=chrome(body,S.detailVisible?S.detailFrom:S.view);if(S.view==='home'&&!S.detailVisible&&!S.tasks)loadHomeTasks();if(S.view==='tasks'&&!S.tasks)loadTasks();if(S.view==='adventure'&&S.adventure===null)loadAdventure()}
function homePage(){return `<section class="action-home"><div class="home-context"><h2>今天想找哪部？</h2></div><section class="home-search"><form class="search-form" onsubmit="submitSearch(event)"><label class="sr-only" for="home-q">搜索影视</label><input id="home-q" value="${esc(S.query)}" placeholder="搜片名、演员或关键词" autocomplete="off"><button class="primary" type="submit">找片</button></form></section>${homeStatusSection()}<section class="task-entry-grid" aria-label="快捷任务"><button class="task-entry" data-action="request" onclick="startSearchMode('request')"><strong>＋</strong><b>求片</b><span>搜到目标，直接提交</span></button><button class="task-entry" data-action="wash" onclick="startSearchMode('wash')"><strong>↻</strong><b>洗版</b><span>已有内容换个更好的版本</span></button><button class="task-entry" data-action="adventure" onclick="navigate('adventure')"><strong>✦</strong><b>闯关</b><span>不知道看啥？玩着选一部</span></button></section></section>`}
function homeStatusSection(){const active=(S.tasks?.requests||[]).filter(item=>['pending','active'].includes(taskGroup(item))).sort((a,b)=>taskTimestamp(b)-taskTimestamp(a)).slice(0,3);if(active.length)return`<section class="home-active" aria-label="正在处理"><div class="section-title"><h2>最新进展</h2><span>${active.length} 个任务</span></div><div class="task-group">${active.map(taskCard).join('')}</div></section>`;const recent=recentSearches().slice(0,3);if(recent.length)return`<section class="home-active"><div class="section-title"><h2>最近搜过</h2></div><div class="recent-list">${recent.map(query=>`<button class="recent-search" data-query="${esc(query)}" onclick="repeatRecentSearch(this)"><span>${esc(query)}</span><small>再搜一次</small></button>`).join('')}</div></section>`;return`<section class="home-active"><div class="home-adventure-prompt"><h2>不知道看什么？</h2><button class="secondary" onclick="navigate('adventure')">开始闯关</button></div></section>`}
function taskTimestamp(item){const value=Date.parse(item?.updated_at||item?.created_at||'');return Number.isFinite(value)?value:0}
const RECENT_SEARCHES_KEY='yimao.recent-searches.v1';
function recentSearches(){try{const values=JSON.parse(localStorage.getItem(RECENT_SEARCHES_KEY)||'[]');if(!Array.isArray(values))return[];return values.filter(value=>typeof value==='string').map(value=>value.trim()).filter(Boolean).slice(0,5)}catch{return[]}}
function rememberSearch(query){const value=String(query??'').trim();if(!value)return;const values=[value,...recentSearches().filter(item=>item!==value)].slice(0,5);try{localStorage.setItem(RECENT_SEARCHES_KEY,JSON.stringify(values))}catch{}}
function repeatRecentSearch(element){const query=String(element?.dataset?.query||'').trim();if(!query)return;S.query=query;S.view='search';S.results=[];S.searchError='';render();searchNow(false)}
function taskCompact(item){const id=Number(item.tmdb_id);const type=mediaType(item);return `<button class="active-item" data-mid="${Number.isFinite(id)&&id>0?id:0}" data-type="${type}" data-season="${Number(item.season)||0}" onclick="openMediaFromElement(this)">${poster(item)?`<img class="poster" src="${esc(poster(item))}" alt="">`:'<span class="poster"></span>'}<span><strong>${esc(mediaTitle(item))}</strong><small>${item.business_type==='wash'?'洗版任务':'求片任务'} · ${esc(item.status_text||taskNext(item))}</small></span><em class="status-text">看进度</em></button>`}
function groupedSearchResults(items){const groups={movie:[],tv:[]};for(const item of Array.isArray(items)?items:[]){const kind=mediaType(item);if(groups[kind])groups[kind].push(item)}return groups}
function statusCode(x){return String(x?.media_status?.code||x?.status?.code||'available')}
function detailPrimaryAction(x){const status=statusCode(x);if(status==='in_library')return'已在库中 · 洗版';if(status==='requested'||status==='subscribed')return'查看进度';if(status==='unknown')return'状态待确认';return x.type==='tv'?'选择季':'求这部'}
function resultButton(x){const mt=mediaType(x),id=Number(mediaID(x));if(!Number.isFinite(id)||id<=0)return'';return `<span class="result-action">${esc(detailPrimaryAction(x))}</span>`}

function searchResultSection(kind,items){if(!items.length)return'';const first=items[0],firstID=Number(mediaID(first));const titleText=kind==='movie'?'电影':'剧集';return `<section class="result-section"><h3>${titleText} · ${items.length}</h3><button class="result-lead" data-mid="${Number.isFinite(firstID)&&firstID>0?firstID:0}" data-type="${kind}" data-season="0" onclick="openMediaFromElement(this)"><img class="result-poster" src="${esc(poster(first))}" alt=""><span><h4>${esc(mediaTitle(first))}</h4><div class="result-meta"><span>${esc(first.original_title||'')}</span><span>${esc(first.year||'')}</span><span>${Number(first.vote_average||0)?'★ '+Number(first.vote_average).toFixed(1):''}</span></div><p>${esc((first.genres||[]).join(' · '))}</p><span class="result-decision">${resultStatus(first)}${resultButton(first)}</span></span></button>${items.slice(1).map(x=>{const id=Number(mediaID(x));return`<button class="result-row" data-mid="${Number.isFinite(id)&&id>0?id:0}" data-type="${kind}" data-season="0" onclick="openMediaFromElement(this)"><img class="result-poster" src="${esc(poster(x))}" alt=""><span><h4>${esc(mediaTitle(x))}</h4><p>${esc(x.original_title||'')}${x.year?' · '+esc(x.year):''}</p>${resultStatus(x)}</span>${resultButton(x)}</button>`}).join('')}</section>`}
function searchPage(){const groups=groupedSearchResults(S.results);return `<section class="page search-page"><h2>${S.searchMode==='wash'?'洗版':'找片'}</h2><p class="page-intro">${S.searchMode==='wash'?'已有内容换个更好的版本。新版本确认可用前，旧版会保留。':'搜索电影或剧集，按媒体库状态决定下一步。'}</p><section class="search-controls"><form class="search-form" onsubmit="submitSearch(event)"><label class="sr-only" for="q">搜索影视</label><input id="q" value="${esc(S.query)}" placeholder="搜片名、演员或关键词" autocomplete="off"><button class="primary" type="submit">搜索</button></form><div class="mode-switch"><button class="${S.searchMode==='request'?'active':''}" onclick="startSearchMode('request')">求片</button><button class="${S.searchMode==='wash'?'active':''}" onclick="startSearchMode('wash')">洗版</button></div><div class="filter-row"><button class="${S.searchType==='all'?'active':''}" onclick="setSearchType('all')">全部</button><button class="${S.searchType==='movie'?'active':''}" onclick="setSearchType('movie')">电影</button><button class="${S.searchType==='tv'?'active':''}" onclick="setSearchType('tv')">剧集</button></div></section>${S.searchError?`<div class="persistent-error">${esc(S.searchError)}</div>`:''}${S.loading?'<div class="empty">正在搜索…</div>':''}${!S.loading&&S.query&&!S.results.length?'<div class="empty">没有找到匹配内容。</div>':''}${searchResultSection('movie',groups.movie)}${searchResultSection('tv',groups.tv)}${S.results.length&&S.hasMore?'<button class="secondary" onclick="loadMoreSearch()">加载更多</button>':''}</section>`}
function taskGroup(item){const group=String(item?.status_group||'');if(group==='pending'||item?.status==='pending')return'pending';if(group==='active'||['approved','stuck','awaiting_library'].includes(item?.status))return'active';if(item?.status==='rejected'||item?.status==='cancelled'||group==='done'||item?.status==='completed')return item?.status==='rejected'?'missing':'done';return'missing'}
function groupedTasks(items){const out={pending:[],active:[],done:[],missing:[]};for(const item of Array.isArray(items)?items:[]){const group=taskGroup(item);out[group].push(item)}return out}
function taskNext(item){const group=taskGroup(item);if(group==='pending')return'需要处理';if(group==='active')return'进行中';if(group==='done')return'已完成';return'没有找到'}
function tasksPage(){const data=S.tasks?.requests||[],groups=groupedTasks(data);const tabs=[['all','全部'],['pending','需要处理'],['active','进行中'],['done','已完成'],['missing','没有找到']];const selected=S.taskFilter||'all';const list=selected==='all'?data:groups[selected]||[];return `<section class="page tasks-page"><h2>任务</h2><p class="page-intro">求片和洗版会聚合在同一条时间线上。</p>${S.tasks?.error?`<div class="persistent-error">${esc(S.tasks.error)}</div>`:''}<div class="task-filters">${tabs.map(([v,label])=>`<button class="${selected===v?'active':''}" onclick="setTaskFilter('${v}')">${label}</button>`).join('')}</div>${list.length?`<div class="task-group">${list.map(taskCard).join('')}</div>`:'<div class="empty">这个分类还没有任务。</div>'}<section class="secondary-tools"><h3>更多入口</h3><div class="tool-grid"><button onclick="openTool('dynamic')">动态</button><button onclick="openTool('discover')">发现</button><button onclick="openTool('assistant')">助手</button><button onclick="openTool('watchlist')">想看</button><button onclick="openTool('wishes')">许愿</button><button onclick="openTool('issues')">反馈</button></div>${S.tool?toolPanel():''}</section></section>`}
function taskCard(item){const id=Number(item.tmdb_id),type=mediaType(item),requestID=String(item.request_id||'');return `<article class="task-card"><img class="poster" src="${esc(poster(item))}" alt=""><span><h4>${item.business_type==='wash'?'<span class="business-badge">洗版</span>':''}${esc(mediaTitle(item))}</h4><p>${esc(item.status_text||taskNext(item))} · ${esc(fmtDate(item.updated_at||item.created_at))}</p><div class="task-actions"><button data-mid="${id}" data-type="${type}" data-season="${Number(item.season)||0}" onclick="openMediaFromElement(this)">${esc(taskNext(item))}</button>${requestID?`<button data-request-id="${esc(requestID)}" onclick="openProgressFromElement(this)">查看进度</button>`:''}${item.can_cancel&&requestID?`<button data-request-id="${esc(requestID)}" onclick="cancelTaskFromElement(this)">撤回</button>`:''}</div></span></article>`}
function toolPanel(){if(!S.toolData&&!S.toolError)return'<div class="tool-panel"><span class="empty">加载中…</span></div>';if(S.toolError)return`<div class="tool-panel"><span class="persistent-error">${esc(S.toolError)}</span></div>`;const items=Array.isArray(S.toolData?.items)?S.toolData.items:Array.isArray(S.toolData)?S.toolData:[];return `<div class="tool-panel"><h3>${esc(S.tool)}</h3><div class="tool-list">${items.length?items.map(x=>`<article>${esc(mediaTitle(x)||x.title||x.description||'记录')}<small>${esc(x.state||x.status||x.updated_at||'')}</small></article>`).join(''):'<span class="empty">暂无记录</span>'}</div></div>`}
function adventurePage(){const a=S.adventure?.state||S.adventure;if(!a)return`<section class="page adventure-page"><h2>闯关</h2><p class="page-intro">选一部影片开始剧情挑战，闯关结果会回到影片详情。</p><div class="adventure-empty"><h2>准备好了吗？</h2><p>通关后直接打开对应影片详情，你可以继续求片或查看媒体状态。</p><form class="search-form" onsubmit="startAdventure(event)"><input id="adventure-movie" required maxlength="80" placeholder="输入电影或剧集名称"><button class="primary">开始</button></form></div></section>`;if(a.phase==='finished'||a.success)return`<section class="page adventure-page"><h2>闯关结果</h2><div class="quest-panel"><div class="quest-result">${esc(a.message||'挑战完成')}</div><p class="page-intro">${esc(a.movie_title||'这部影片')} 已回到任务路径。</p>${adventureResultAction(a)}</div></section>`;const scene=a.scene||{};const choices=Array.isArray(a.choices)?a.choices:[];return`<section class="page adventure-page"><h2>闯关</h2><div class="quest-panel"><div class="quest-head"><span><strong>${esc(a.movie_title||a.movie||'剧情挑战')}</strong><small>第 ${Number(a.level)||1}/${Number(a.total_levels)||5} 关 · HP ${Number(a.hp)||0}/${Number(a.max_hp)||100}</small></span><span class="quest-score">${Number(a.score)||0} 分</span></div><div class="quest-scene"><h2>${esc(scene.title||a.scene_title||'下一幕')}</h2><p>${esc(scene.description||a.description||'剧情正在展开。')}</p></div>${a.message?`<div class="quest-result">${esc(a.message)}</div>`:''}<div class="quest-choice-list">${choices.map(c=>`<button class="quest-choice" onclick="chooseAdventure(${Number(c.index)||0},this)" ${c.tried?'disabled':''}><b>${Number(c.index)+1}</b><span>${esc(c.text)}</span></button>`).join('')}</div><div class="quest-tools"><button onclick="hintAdventure(this)">${a.hint_used?'提示已使用':'使用提示'}</button><button onclick="quitAdventure()">退出闯关</button></div></div></section>`}
function adventureResultAction(item){const id=Number(item.tmdb_id||item.movie_id||item.media_id);const type=mediaType(item);return`<button class="primary" data-adventure-media="${Number.isFinite(id)&&id>0?id:0}" data-type="${type}" data-season="${Number(item.season)||0}" onclick="openAdventureMedia(this)">回影片详情</button>`}
function dynamicMediaCard(item){const mid=Number(item?.tmdb_id??item?.id);if(!Number.isFinite(mid)||mid<=0)return'';const mt=item?.type==='tv'||item?.media_type==='tv'?'tv':'movie';if(!['movie','tv'].includes(mt))return'';return`<button class="result-row" data-mid="${mid}" data-type="${mt}" data-season="${Number(item?.season)||0}" onclick="openMediaFromElement(this)"><img class="result-poster" src="${esc(poster(item))}" alt=""><span><h4>${esc(mediaTitle(item))}</h4><p>${esc(item?.year||'')}</p></span></button>`}
function openMediaFromElement(element){const mid=Number(element?.dataset?.mid),type=element?.dataset?.type,season=Number(element?.dataset?.season)||0;if(!Number.isFinite(mid)||mid<=0||!['movie','tv'].includes(type))return;openDetail(mid,type,season)}
function openAdventureMedia(element){const mid=Number(element?.dataset?.adventureMedia),type=element?.dataset?.type,season=Number(element?.dataset?.season)||0;if(!Number.isFinite(mid)||mid<=0||!['movie','tv'].includes(type))return;S.adventure=null;openDetail(mid,type,season)}
function detailPage(){const x=S.detail;if(!x)return'<section class="empty">详情加载中…</section>';const mt=mediaType(x),status=x.media_status||{code:'unknown',text:'暂时无法确认'},seasons=(x.seasons||[]).map(s=>`<button class="season-option ${S.season===Number(s.number)?'selected':''}" onclick="selectSeason(${Number(s.number)})">${s.poster_path?`<img src="${esc(s.poster_path.startsWith('http')?s.poster_path:poster({poster_path:s.poster_path}))}" alt="">`:'<span class="poster"></span>'}<span><strong>${esc(s.name||'第 '+s.number+' 季')}</strong><small>${esc(s.air_date||'')} · ${Number(s.episode_count)||0} 集</small></span><em class="${esc(s.status?.code||'unknown')}">${esc(s.status?.text||'未知')}</em></button>`).join('');return`<section class="detail"><div class="detail-hero">${x.backdrop_path?`<img src="${esc(x.backdrop_path)}" alt="">`:''}</div><h2>${esc(mediaTitle(x))}</h2>${x.original_title?`<h3>${esc(x.original_title)}</h3>`:''}<div class="detail-facts"><span class="fact">${mt==='tv'?'剧集':'电影'}</span><span class="fact">${esc(x.year||'年份待定')}</span>${(x.genres||[]).map(g=>`<span class="fact">${esc(g)}</span>`).join('')}</div><div class="media-status"><span><b>${esc(status.text)}</b><small>真实媒体库状态</small></span><span>${Number(x.vote_average||0)?'★ '+Number(x.vote_average).toFixed(1):''}</span></div><p class="detail-copy">${esc(x.overview||'暂无简介')}</p>${mt==='tv'?`<h3>选择季</h3><div class="season-list">${seasons||'<div class="empty">暂无可选季</div>'}</div>`:''}<div class="detail-actions">${detailActionButton(x)}<button class="secondary" onclick="toggleWatchlist(this)">${x.in_watchlist?'取消想看':'加入想看'}</button></div></section>`}
function detailActionButton(x){const status=statusCode(x),season=S.season;if(status==='in_library')return`<button class="primary" onclick="openWashConfirm()">洗版</button>`;if(status==='requested'||status==='subscribed')return`<button class="primary" onclick="goTasks()">查看进度</button>`;if(status==='available')return`<button class="primary" ${x.type==='tv'&&!season?'disabled':''} onclick="openRequestConfirm()">${x.type==='tv'&&!season?'选择季':'求这部'}</button>`;return`<button class="secondary" disabled>状态待确认</button>`}
function showDialog(content){closeDialog();const holder=document.createElement('div');holder.id='dialog';holder.className='backdrop';holder.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1">${content}</div>`;document.body.appendChild(holder);D.returnFocus=document.activeElement;D.controller=new AbortController();D.seq++;holder.addEventListener('click',event=>{if(event.target===holder&&!D.busy)closeDialog()});holder.querySelector('.sheet')?.focus();return{seq:D.seq,signal:D.controller.signal,dialog:holder}}
const D={seq:0,controller:null,busy:false,returnFocus:null};
function isCurrentDialog(seq){return Number(D.seq)===Number(seq)&&document.getElementById('dialog')}
function setDialogBusy(seq,busy){if(!isCurrentDialog(seq))return;D.busy=busy;document.getElementById('dialog')?.setAttribute('aria-busy',String(busy))}
function closeDialog(){const node=document.getElementById('dialog');const restore=D.returnFocus;D.controller?.abort();D.controller=null;D.busy=false;if(node)node.remove();D.seq++;D.returnFocus=null;if(restore?.isConnected)restore.focus?.({preventScroll:true})}
function handleDialogKeys(event){const dialog=document.getElementById('dialog');if(!dialog)return;if(event.key==='Escape'){if(!D.busy){event.preventDefault();closeDialog()}return}if(event.key!=='Tab')return;const items=[...dialog.querySelectorAll('button:not([disabled]),input,textarea,select,[tabindex]:not([tabindex="-1"])')];if(!items.length)return;const first=items[0],last=items.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}
document.addEventListener('keydown',handleDialogKeys);
function openRequestConfirm(){const x=S.detail;const season=x.type==='tv'?S.season:0;if(x.type==='tv'&&season<=0){toast('请选择季');return}const ctx=showDialog(`<button class="sheet-close" aria-label="关闭" onclick="closeDialog()">×</button><h2 id="dialog-title">确认求片</h2><p>将提交 ${esc(mediaTitle(x))}${season?' · 第 '+season+' 季':''}，进入审核后可在任务中查看。</p><div class="sheet-actions"><button class="secondary" onclick="closeDialog()">再看看</button><button class="primary" onclick="submitRequest(this)">确认求片</button></div>`);return ctx}
function openWashConfirm(){const x=S.detail;const season=x.type==='tv'?S.season:0;if(x.type==='tv'&&season<=0){toast('请选择季');return}showDialog(`<button class="sheet-close" aria-label="关闭" onclick="closeDialog()">×</button><h2 id="dialog-title">确认洗版</h2><p>已有内容换个更好的版本。新版本确认可用前，旧版会保留。</p><div class="sheet-actions"><button class="secondary" onclick="closeDialog()">再看看</button><button class="primary" onclick="submitWash(this)">确认洗版</button></div>`)}
function submissionStatusText(status){const labels={created:'已创建',duplicate_own:'已有你的相同任务',duplicate_other:'已有相同任务',not_bound:'未提交：账号尚未绑定',quota_exceeded:'未提交：额度不足',failed:'提交未完成'};return labels[status]||`状态待确认${status?'（'+status+'）':''}`}
function submissionResultTitle(status,businessType){const label=businessType==='wash'?'洗版':'求片';if(status==='created')return label+'任务已提交';if(status==='duplicate_own'||status==='duplicate_other')return label+'任务已存在';return label+'提交结果'}
function showSubmissionResult(result,businessType){const detail=S.detail||{};const wash=businessType==='wash';const status=String(result.status??'');const requestID=String(result.request_id??'');const typeLabel=mediaType(detail)==='tv'?'剧集':'电影';const season=mediaType(detail)==='tv'&&Number(S.season)>0?' · 第 '+Number(S.season)+' 季':'';const requestLine=requestID?`<div><dt>任务编号</dt><dd><code>${esc(requestID)}</code></dd></div>`:'';showDialog(`<button class="sheet-close" aria-label="关闭提交结果" onclick="closeDialog()">×</button><h2 id="dialog-title">${esc(submissionResultTitle(status,businessType))}</h2><div class="submission-identity"><strong>${esc(mediaTitle(detail))}</strong><span>${typeLabel}${season}</span></div><dl class="submission-meta"><div><dt>当前状态</dt><dd>${esc(submissionStatusText(status))}</dd></div>${requestLine}</dl>${wash?'<p class="wash-result-note">新版本确认可用前，旧版会保留。</p>':''}<div class="sheet-actions">${requestID?'<button class="primary" onclick="viewSubmittedTasks()">查看任务</button>':''}<button class="secondary" onclick="continueFinding()">继续找片</button></div>`);const tone=status==='created'?'success':status.startsWith('duplicate_')?'warning':'error';tg?.HapticFeedback?.notificationOccurred?.(tone)}
function viewSubmittedTasks(){goTasks()}
function continueFinding(){closeDialog();S.detailVisible=false;S.view='search';render();document.getElementById('q')?.focus()}
async function submitRequest(button){const ctx={seq:D.seq,signal:D.controller?.signal,dialog:document.getElementById('dialog')};if(!isCurrentDialog(ctx.seq))return;setDialogBusy(ctx.seq,true);button.disabled=true;const x=S.detail;try{const result=await api('/api/miniapp/v1/request',{method:'POST',signal:ctx.signal,body:JSON.stringify({tmdb_id:Number(mediaID(x)),type:mediaType(x),season:mediaType(x)==='tv'?S.season:0})});if(!isCurrentDialog(ctx.seq))return;S.tasks=null;showSubmissionResult(result,'request')}catch(error){if(error?.name==='AbortError'||!isCurrentDialog(ctx.seq))return;if(error?.body?.status){S.tasks=null;showSubmissionResult(error.body,'request');return}setDialogBusy(ctx.seq,false);button.disabled=false;toast(error.message||'提交失败')}}
async function submitWash(button){const ctx={seq:D.seq,signal:D.controller?.signal,dialog:document.getElementById('dialog')};if(!isCurrentDialog(ctx.seq))return;setDialogBusy(ctx.seq,true);button.disabled=true;const x=S.detail;const season=x.type==='tv'?S.season:0;const payload={tmdb_id:Number(mediaID(x)),type:mediaType(x),season};try{const result=await api('/api/miniapp/v1/wash',{method:'POST',signal:ctx.signal,body:JSON.stringify(payload)});if(!isCurrentDialog(ctx.seq))return;S.tasks=null;showSubmissionResult(result,'wash')}catch(error){if(error?.name==='AbortError'||!isCurrentDialog(ctx.seq))return;setDialogBusy(ctx.seq,false);button.disabled=false;toast(error.message||'洗版失败')}}
async function toggleWatchlist(button){const x=S.detail,adding=!x.in_watchlist;button.disabled=true;try{await api('/api/miniapp/v1/watchlist',{method:adding?'POST':'DELETE',body:JSON.stringify({tmdb_id:Number(mediaID(x)),type:mediaType(x)})});x.in_watchlist=adding;button.textContent=adding?'取消想看':'加入想看';tg?.HapticFeedback?.notificationOccurred?.('success');toast(adding?'已加入想看':'已取消想看')}catch(error){toast(error.message||'操作失败')}finally{button.disabled=false}}
function openDetail(mid,type,wantedSeason=0){closeDialog();const seq=++S.detailSeq;S.detailFrom=S.view;S.detailVisible=true;S.detail=null;render();const season=Number(wantedSeason)||0;api('/api/miniapp/v1/detail?id='+encodeURIComponent(mid)+'&type='+encodeURIComponent(type)+(season?'&season='+season:'')).then(detail=>{if(seq!==S.detailSeq)return;S.detail=detail;S.season=type==='tv'&&season?season:Number(detail.seasons?.[0]?.number)||0;if(type==='tv'&&S.season){S.detail.media_status=detail.seasons?.find(s=>Number(s.number)===S.season)?.status||detail.media_status}render()}).catch(error=>{if(seq!==S.detailSeq)return;S.detail={type,title:'详情暂时不可用',overview:error.message,media_status:{code:'unknown',text:'状态待确认'}};render()})}
function selectSeason(number){S.season=Number(number)||0;if(S.detail?.type==='tv'){const season=S.detail.seasons?.find(x=>Number(x.number)===S.season);S.detail.media_status=season?.status||{code:'unknown',text:'暂时无法确认'}}render()}
function backDetail(){closeDialog();S.detailSeq++;S.detailVisible=false;render()}
function submitSearch(event){event.preventDefault();const input=event.currentTarget.querySelector('input');S.query=input.value.trim();S.view='search';S.results=[];S.searchError='';render();if(S.query)searchNow(false)}
function startSearchMode(mode){if(!['request','wash'].includes(mode))return;S.searchMode=mode;S.view='search';render();document.getElementById('q')?.focus()}
function setSearchType(type){if(!['all','movie','tv'].includes(type))return;S.searchType=type;render();if(S.query)searchNow(false)}
let searchController=null;
async function searchNow(append=false,page=1){searchController?.abort();const controller=new AbortController();searchController=controller;const seq=++S.searchSeq;const current={query:S.query,type:S.searchType};S.loading=true;render();try{const typeQuery=current.type==='all'?'':'&type='+current.type;const response=await api('/api/miniapp/v1/search?q='+encodeURIComponent(current.query)+'&page='+page+'&limit=12'+typeQuery,{signal:controller.signal});if(seq!==S.searchSeq||S.query!==current.query||S.searchType!==current.type)return;if(!append)rememberSearch(current.query);S.results=append?[...S.results,...(response.results||[])]:response.results||[];S.hasMore=!!response.has_more;S.nextPage=Number(response.next_page)||page+1;S.searchError=''}catch(error){if(error?.name==='AbortError'||seq!==S.searchSeq)return;const e=error;S.searchError=e.message;S.results=[]}finally{if(seq===S.searchSeq){S.loading=false;searchController=null;render()}}}
function loadMoreSearch(){if(!S.loading&&S.hasMore)searchNow(true,S.nextPage)}
function taskFilterValue(){return S.taskFilter||'all'}
function setTaskFilter(value){S.taskFilter=value;render()}
async function loadTasks(){const seq=++S.meSeq;try{const response=await api('/api/miniapp/v1/me');if(seq!==S.meSeq||S.view!=='tasks')return;S.tasks={...response,requests:Array.isArray(response.requests)?response.requests:[]};render()}catch(error){if(seq!==S.meSeq||S.view!=='tasks')return;S.tasks={requests:[],error:error.message};render()}}
async function loadHomeTasks(){const seq=++S.meSeq;try{const response=await api('/api/miniapp/v1/me');if(seq!==S.meSeq||S.view!=='home'||S.detailVisible)return;S.tasks={...response,requests:Array.isArray(response.requests)?response.requests:[]};render()}catch(error){if(seq!==S.meSeq||S.view!=='home'||S.detailVisible)return;S.tasks={requests:[],error:error.message};render()}}
function goTasks(){closeDialog();S.detailVisible=false;S.view='tasks';S.tasks=null;render()}
function openProgressFromElement(element){openProgress(element.dataset.requestId)}
async function openProgress(requestID){const ctx=showDialog('<h2 id="dialog-title">任务进度</h2><div class="empty">正在加载时间线…</div>');try{const data=await api('/api/miniapp/v1/progress?request_id='+encodeURIComponent(requestID),{signal:ctx.signal});if(!isCurrentDialog(ctx.seq))return;const d=data;const events=Array.isArray(d.events)?d.events:[];document.querySelector('#dialog .sheet').innerHTML=`<button class="sheet-close" aria-label="关闭" onclick="closeDialog()">×</button><h2 id="dialog-title">任务进度</h2><div class="timeline">${events.map(event=>{const nodeTone=event.code==='completed'||event.code==='download_complete'?'done':'active';return`<div class="timeline-item"><span class="timeline-node timeline-${nodeTone}" aria-label="进度节点"></span><span><strong>${esc(event.text)}</strong><small>${esc(fmtDate(event.at))}</small></span></div>`}).join('')||'<div class="empty">暂无进度记录</div>'}</div>`}catch(error){if(error?.name==='AbortError'||!isCurrentDialog(ctx.seq))return;document.querySelector('#dialog .sheet').innerHTML=`<h2 id="dialog-title">进度暂时不可用</h2><p>${esc(error.message)}</p>`}}
async function cancelTaskFromElement(element){if(DEMO){toast('Demo 只读');return}const requestID=String(element.dataset.requestId||'');const ctx=showDialog(`<h2 id="dialog-title">撤回任务？</h2><p>撤回后会停止这条待审核任务。</p><div class="sheet-actions"><button class="secondary" onclick="closeDialog()">保留</button><button class="danger" data-request-id="${esc(requestID)}" onclick="cancelTaskFromDialog(this)">确认撤回</button></div>`);ctx}
function cancelTaskFromDialog(element){cancelTask(element.dataset.requestId)}
async function cancelTask(requestID){const ctx={seq:D.seq,signal:D.controller?.signal};if(!isCurrentDialog(ctx.seq))return;setDialogBusy(ctx.seq,true);try{await api('/api/miniapp/v1/request/cancel',{method:'POST',signal:ctx.signal,body:JSON.stringify({request_id:requestID})});if(!isCurrentDialog(ctx.seq))return;closeDialog();toast('任务已撤回');S.tasks=null;render()}catch(error){if(error?.name==='AbortError'||!isCurrentDialog(ctx.seq))return;setDialogBusy(ctx.seq,false);toast(error.message||'撤回失败')}}
async function loadAdventure(){try{const result=await api('/api/miniapp/v1/adventure');S.adventure=result.state||null;render()}catch(error){S.adventure={error:error.message};render()}}
async function startAdventure(event){event.preventDefault();const movie=document.getElementById('adventure-movie')?.value.trim();if(!movie)return;try{const result=await api('/api/miniapp/v1/adventure',{method:'POST',body:JSON.stringify({action:'start',movie})});S.adventure=result.state;render()}catch(error){toast(error.message||'闯关暂时不可用')}}
async function chooseAdventure(choice,button){const a=S.adventure?.state||S.adventure;if(!a||button.disabled)return;button.disabled=true;try{const result=await api('/api/miniapp/v1/adventure',{method:'POST',body:JSON.stringify({action:'choice',run_id:a.run_id,turn:Number(a.turn)||Number(a.level)||1,choice:Number(choice)})});S.adventure=result.state;render()}catch(error){button.disabled=false;toast(error.message||'选择未提交')}}
async function hintAdventure(button){const a=S.adventure?.state||S.adventure;if(!a||button.disabled)return;button.disabled=true;try{const result=await api('/api/miniapp/v1/adventure',{method:'POST',body:JSON.stringify({action:'hint',run_id:a.run_id,turn:Number(a.turn)||Number(a.level)||1})});S.adventure=result.state;render()}catch(error){button.disabled=false;toast(error.message||'提示暂时不可用')}}
async function quitAdventure(reset=false){if(!DEMO)await api('/api/miniapp/v1/adventure',{method:'DELETE'}).catch(()=>{});S.adventure=null;if(reset)render();else render()}
async function openTool(tool){const paths={dynamic:'/api/miniapp/v1/dynamic',discover:'/api/miniapp/v1/discover',assistant:'/api/miniapp/v1/assistant',watchlist:'/api/miniapp/v1/watchlist',wishes:'/api/miniapp/v1/wishes',issues:'/api/miniapp/v1/issues'};if(!paths[tool])return;S.tool=tool;S.toolData=null;S.toolError='';render();try{S.toolData=await api(paths[tool]);render()}catch(error){S.toolError=error.message;render()}}
function navigate(view){closeDialog();if(view==='search'){S.detailVisible=false;S.view='search';render();return}if(view==='tasks'){S.detailVisible=false;S.view='tasks';S.tasks=null;render();return}if(view==='adventure'){S.detailVisible=false;S.view='adventure';S.adventure=null;render()}}
function goHome(){closeDialog();S.detailVisible=false;S.view='home';render()}
function showNativeBack(){tg?.BackButton?.show()}
function syncBack(){if(S.detailVisible)showNativeBack();else tg?.BackButton?.hide?.()}
render();initTelegramWebApp();syncBack();
</script>
<script async src="https://telegram.org/js/telegram-web-app.js" onload="initTelegramWebApp()"></script>
</body>
</html>
