<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a0c"><title>云海影视</title>
<style>
:root {
  --bg: #090a0c;
  --bg-raised: #101115;
  --panel: #15161a;
  --panel-strong: #1b1c21;
  --line: #2b2d33;
  --line-soft: #202228;
  --ink: #f4f2ef;
  --muted: #bbb8b5;
  --dim: #949398;
  --accent: #f05a4f;
  --accent-strong: #ff7468;
  --accent-ink: #160807;
  --good: #63c98d;
  --warning: #e8b35e;
  --danger: #ff756b;
  --shadow: 0 18px 44px rgba(0, 0, 0, .34);
  --glass: rgba(17, 18, 21, .88);
  --glass-border: rgba(255, 255, 255, .09);
  --glass-highlight: rgba(255, 255, 255, .08);
  --safe-top: max(0px, env(safe-area-inset-top, 0px), var(--tg-safe-area-inset-top, 0px), var(--tg-content-safe-area-inset-top, 0px));
  --safe-bottom: max(0px, env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px), var(--tg-content-safe-area-inset-bottom, 0px));
  --safe:var(--safe-bottom);
  --tab-height: 50px;
  --tab-gap: 8px;
  --tab-clearance: calc(var(--tab-height) + var(--safe-bottom) + var(--tab-gap) + 18px);
}

* {
  box-sizing: border-box;
  letter-spacing: 0;
}

html {
  min-width: 0;
  background: var(--bg);
  color-scheme: dark;
  scroll-behavior: auto;
}

body {
  min-width: 0;
  min-height: 100dvh;
  margin: 0;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", "Noto Sans CJK SC", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

button,
input,
textarea,
select {
  max-width: 100%;
  font: inherit;
}

button {
  min-height: 44px;
  border: 0;
  color: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

button,
[role="button"] {
  transition: transform .16s ease, opacity .16s ease;
}

button:active:not(:disabled),
[role="button"]:not([aria-disabled="true"]):active {
  transform: scale(.98);
}

button,
a,
input,
textarea,
select {
  outline: none;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[role="button"]:focus-visible {
  outline: 2px solid var(--accent-strong);
  outline-offset: 2px;
}

button:disabled {
  cursor: default;
}

img {
  max-width: 100%;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.shell {
  width: 100%;
  max-width: 760px;
  min-height: 100dvh;
  margin: 0 auto;
  padding: var(--safe-top) 16px var(--tab-clearance);
  overflow-x: clip;
}

.glass-surface {
  --glass-x: 50%;
  --glass-y: 12%;
  --glass-shift: 0px;
  position: relative;
  border: 1px solid var(--glass-border);
  background-color: var(--glass);
  background-image:
    radial-gradient(circle at var(--glass-x) var(--glass-y), rgba(255, 255, 255, .075), transparent 42%),
    linear-gradient(180deg, rgba(255, 255, 255, .035), transparent 56%);
  box-shadow: inset 0 1px 0 var(--glass-highlight), 0 10px 28px rgba(0, 0, 0, .22);
  color: var(--ink);
}

.glass-surface::before,
.glass-surface::after {
  content: none;
}

.app-bar {
  position: sticky;
  z-index: 8;
  top: var(--safe-top);
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 -10px;
  padding: 0 10px;
  border-color: transparent transparent rgba(255, 255, 255, .055);
  border-radius: 0 0 12px 12px;
  background-color: var(--glass);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
}

.app-context {
  min-width: 0;
  display: grid;
  gap: 1px;
}

.app-context strong,
.app-context span {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.app-context strong {
  color: var(--ink);
  font-size: 15px;
  line-height: 1.25;
  font-weight: 760;
}

.app-context span {
  color: var(--dim);
  font-size: 10px;
  line-height: 1.35;
}

.avatar {
  width: 44px;
  height: 44px;
  flex: none;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, .065);
  color: var(--ink);
  font-size: 12px;
  font-weight: 750;
}

.home-shell {
  position: relative;
  padding-top: calc(var(--safe-top) + 18px);
}

.home-studio,
.studio-console,
.screening-flow {
  min-width: 0;
}

.studio-intro {
  margin: 4px 0 16px;
}

.studio-intro p,
.studio-intro h1 {
  margin: 0;
}

.studio-intro p {
  color: var(--accent-strong);
  font-size: 12px;
  line-height: 1.5;
  font-weight: 720;
}

.studio-intro h1 {
  max-width: 300px;
  margin-top: 3px;
  font-size: 28px;
  line-height: 1.18;
  font-weight: 720;
}

.prompt-composer {
  overflow: hidden;
  border-color: rgba(255, 255, 255, .1);
  border-radius: 8px;
  background-color: rgba(19, 20, 24, .78);
  box-shadow: 0 18px 48px rgba(0, 0, 0, .28);
}

.prompt-composer textarea {
  width: 100%;
  min-height: 82px;
  display: block;
  resize: none;
  padding: 15px 15px 8px;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.5;
}

.prompt-composer textarea::placeholder {
  color: #8d8b90;
}

.prompt-composer-footer {
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 2px 4px 2px 8px;
  border-top: 1px solid rgba(255, 255, 255, .065);
}

.prompt-types {
  min-width: 0;
  display: flex;
  align-items: center;
}

.prompt-kind {
  position: relative;
  min-width: 44px;
  min-height: 44px;
  padding: 0 9px;
  background: transparent;
  color: var(--dim);
  font-size: 11px;
}

.prompt-kind.active {
  color: var(--ink);
}

.prompt-kind.active::after {
  content: "";
  position: absolute;
  right: 9px;
  bottom: 5px;
  left: 9px;
  height: 2px;
  background: var(--accent);
}

.prompt-send {
  width: 44px;
  min-width: 44px;
  min-height: 44px;
  display: grid;
  place-items: center;
  padding: 0;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-ink);
}

.prompt-send svg {
  width: 20px;
  height: 20px;
}

.studio-prompts {
  display: grid;
  margin-top: 10px;
}

.studio-prompts button {
  min-height: 44px;
  padding: 9px 2px;
  border-bottom: 1px solid var(--line-soft);
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
  text-align: left;
}

.screening-flow {
  margin-top: 30px;
}

.screening-response {
  display: grid;
  grid-template-columns: 13px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
  margin: 0 0 12px;
  color: #d8d5d2;
  font-size: 14px;
  line-height: 1.55;
}

.screening-response::before {
  content: "";
  width: 9px;
  height: 9px;
  margin-top: 6px;
  border: 2px solid var(--accent);
  border-radius: 50%;
}

.screening-response p {
  margin: 0;
}

.assistant-suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 2px 0 16px 23px;
}

.assistant-suggestions button {
  min-height: 44px;
  padding: 8px 11px;
  border: 1px solid var(--line-soft);
  border-radius: 7px;
  background: var(--panel);
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
}

.assistant-results {
  margin-top: 4px;
}

.assistant-empty {
  min-height: 80px;
  margin-top: 8px;
  padding: 14px;
}

.screening-scene {
  position: relative;
  width: calc(100% + 32px);
  min-height: 208px;
  aspect-ratio: 16 / 10;
  display: block;
  margin: 0 -16px;
  padding: 0;
  overflow: hidden;
  background: #151619;
  text-align: left;
}

.studio-artwork {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #151619;
}

.studio-artwork img {
  position: absolute;
  display: block;
  pointer-events: none;
  user-select: none;
}

.studio-ambient {
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: saturate(.84) brightness(.62);
  transition: opacity .2s ease;
}

.studio-subject {
  z-index: 1;
  right: 5%;
  bottom: -3%;
  width: 38%;
  height: 94%;
  object-fit: contain;
  object-position: center bottom;
  filter: drop-shadow(0 10px 22px rgba(0, 0, 0, .58));
  transition: opacity .2s ease;
}

.studio-artwork::after {
  content: "";
  position: absolute;
  z-index: 2;
  inset: 0;
  background: linear-gradient(90deg, rgba(9, 10, 12, .94) 0%, rgba(9, 10, 12, .54) 44%, rgba(9, 10, 12, .08) 78%), linear-gradient(0deg, rgba(9, 10, 12, .88), transparent 56%);
  pointer-events: none;
}

.studio-fallback {
  position: absolute;
  z-index: 1;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: #18191d;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  text-align: center;
}

.studio-artwork.is-empty .studio-fallback,
.studio-artwork.is-error .studio-fallback {
  display: flex;
}

.scene-caption {
  position: absolute;
  z-index: 3;
  right: 42%;
  bottom: 15px;
  left: 16px;
  display: grid;
  gap: 5px;
}

.scene-caption strong {
  overflow: hidden;
  color: #fff;
  font-size: 21px;
  line-height: 1.12;
  font-weight: 740;
  text-shadow: 0 2px 12px rgba(0, 0, 0, .72);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.scene-caption small,
.thread-caption small,
.thread-caption span {
  color: rgba(255, 255, 255, .72);
  font-size: 10px;
  line-height: 1.45;
}

.film-thread {
  position: relative;
  display: flow-root;
  margin: 26px 0 0 21px;
}

.film-thread::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 20px;
  left: -17px;
  width: 1px;
  background: linear-gradient(var(--accent), rgba(240, 90, 79, .08));
}

.thread-turn {
  position: relative;
  display: block;
  width: 100%;
  margin: 0 0 24px;
  padding: 0;
  background: transparent;
  text-align: left;
}

.thread-turn::before {
  content: "";
  position: absolute;
  top: 17px;
  left: -21px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--bg);
  box-shadow: inset 0 0 0 2px var(--accent);
}

.thread-pick {
  width: 100%;
  min-height: 44px;
  display: block;
  padding: 0;
  background: transparent;
  text-align: left;
}

.thread-art {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 5;
  display: block;
  overflow: hidden;
  background: #151619;
  box-shadow: 0 16px 34px rgba(0, 0, 0, .3);
}

.thread-art .studio-subject {
  right: 13%;
  bottom: 2%;
  width: 74%;
  height: 94%;
}

.thread-art .studio-artwork::after {
  background: linear-gradient(0deg, rgba(9, 10, 12, .52), transparent 54%);
}

.thread-turn.is-wide {
  margin-top: 8px;
  margin-bottom: 38px;
}

.thread-turn.is-wide .thread-art {
  width: 100%;
  aspect-ratio: 16 / 7;
  margin-left: 0;
  box-shadow: none;
}

.thread-turn.is-wide .studio-subject {
  right: 4%;
  bottom: -6%;
  width: 31%;
  height: 108%;
}

.thread-caption {
  position: relative;
  min-width: 0;
  display: grid;
  gap: 3px;
  margin-top: 9px;
}

.thread-caption strong {
  overflow: hidden;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.3;
  font-weight: 690;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.thread-caption small {
  color: var(--accent-strong);
}

.thread-caption span {
  overflow: hidden;
  color: var(--dim);
  white-space: nowrap;
  text-overflow: ellipsis;
}

.studio-empty {
  min-height: 220px;
  display: grid;
  align-content: center;
  gap: 10px;
  padding: 24px 18px;
  border-left: 2px solid var(--accent);
  color: var(--muted);
}

.studio-empty strong {
  color: var(--ink);
  font-size: 17px;
}

.search {
  width: 100%;
  min-height: 52px;
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 14px;
  padding: 5px 5px 5px 14px;
  border: 1px solid #303238;
  border-radius: 8px;
  background: rgba(21, 22, 26, .98);
  transition: transform .2s ease, opacity .2s ease;
}

.search:focus-within {
  border-color: rgba(240, 90, 79, .72);
  box-shadow: 0 0 0 3px rgba(240, 90, 79, .12), var(--shadow);
  transform: translateY(-1px);
}

.search-icon {
  transition: transform .2s ease, opacity .2s ease;
}

.search:focus-within .search-icon {
  opacity: 1;
  transform: scale(1.06);
}

.search-icon {
  width: 20px;
  height: 20px;
  flex: none;
  display: grid;
  place-items: center;
  color: #999ba1;
}

.search-icon svg {
  width: 18px;
  height: 18px;
}

.search input {
  min-width: 0;
  min-height: 44px;
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-size: 16px;
}

.search input::placeholder,
.form-stack input::placeholder,
.form-stack textarea::placeholder {
  color: #92949a;
  opacity: 1;
}

.search button,
.primary {
  min-height: 44px;
  padding: 0 16px;
  border-radius: 7px;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 13px;
  font-weight: 760;
  white-space: nowrap;
  transition: transform .16s ease, opacity .16s ease;
}

.kicker {
  color: var(--accent-strong);
  font-size: 11px;
  line-height: 1.4;
  font-weight: 720;
}

.search button:hover,
.primary:hover {
  background: var(--accent-strong);
}

.primary[disabled] {
  opacity: .48;
}

.section {
  margin-top: 30px;
}

.section-head,
.recent-head {
  min-height: 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 11px;
}

.section-head h2,
.recent-head h2 {
  min-width: 0;
  margin: 0;
  color: var(--ink);
  font-size: 18px;
  line-height: 1.25;
  font-weight: 720;
}

.section-head span {
  flex: none;
  color: var(--muted);
  font-size: 12px;
}

.rail,
.recent-rail {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 34%;
  gap: 11px;
  margin: 0 -16px;
  padding: 7px 16px 10px;
  overflow-x: auto;
  overscroll-behavior-inline: contain;
  scroll-padding-inline: 16px;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
}

.rail::-webkit-scrollbar,
.recent-rail::-webkit-scrollbar,
.chips::-webkit-scrollbar,
.history::-webkit-scrollbar,
.progress-tabs::-webkit-scrollbar {
  display: none;
}

.media {
  min-width: 0;
  min-height: 0;
  padding: 0;
  background: transparent;
  text-align: left;
  scroll-snap-align: start;
}

.focus-rail .media {
  --rail-focus: 0;
  position: relative;
  z-index: 1;
  opacity: calc(.72 + var(--rail-focus) * .28);
  filter: saturate(calc(.76 + var(--rail-focus) * .24));
  transform: scale(calc(.95 + var(--rail-focus) * .09));
  transform-origin: center bottom;
  transition: transform .24s cubic-bezier(.2, .8, .2, 1), opacity .2s ease, filter .2s ease;
  will-change: transform;
}

.focus-rail .media.is-rail-active {
  z-index: 2;
}

.focus-rail .media.is-rail-active .poster {
  border-color: rgba(255, 255, 255, .17);
  box-shadow: 0 13px 32px rgba(0, 0, 0, .38);
}

.poster {
  position: relative;
  width: 100%;
  aspect-ratio: 2 / 3;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, .08);
  border-radius: 6px;
  background: #1a1b20;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .28);
}

.poster::before {
  content: "云海影视";
  position: absolute;
  inset: auto 10px 11px;
  color: #5f6066;
  font-size: 10px;
  font-weight: 700;
}

.poster img {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  background: #1a1b20;
  transition: transform .28s ease, opacity .2s ease;
}

.poster .fallback {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  align-items: flex-end;
  padding: 12px 10px;
  background: #1b1c21;
  color: #d3d1ce;
  font-size: 12px;
  line-height: 1.35;
  font-weight: 680;
  overflow-wrap: anywhere;
}

.media h3 {
  margin: 8px 1px 0;
  overflow: hidden;
  color: var(--ink);
  font-size: 13px;
  line-height: 1.35;
  font-weight: 650;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.meta {
  display: block;
  margin: 3px 1px 0;
  color: var(--dim);
  font-size: 10px;
  line-height: 1.45;
}

.rating b {
  color: var(--warning);
  font-weight: 750;
}

.type-badge {
  position: absolute;
  z-index: 2;
  top: 6px;
  left: 6px;
  min-height: 20px;
  display: inline-flex;
  align-items: center;
  padding: 0 6px;
  border-radius: 4px;
  background: rgba(9, 10, 12, .78);
  color: rgba(255, 255, 255, .84);
  font-size: 9px;
}

.recent-rail {
  grid-auto-columns: 25%;
  gap: 9px;
}

.recent-head button,
.refresh {
  min-height: 44px;
  padding: 0 6px;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
}

.activity-section .section-head {
  margin-bottom: 10px;
}

.activity-section .rail {
  grid-auto-columns: 28%;
}

.chips,
.history,
.progress-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}

.chips {
  margin: 0 -16px;
  padding: 0 16px 4px;
}

.chip,
.filter,
.progress-tab {
  min-height: 44px;
  flex: none;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel);
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

.chip:active,
.filter:active,
.progress-tab:active {
  border-color: var(--accent);
  color: var(--ink);
}

.home-tools {
  margin-bottom: 10px;
}

.tool-list {
  border-top: 1px solid var(--line-soft);
}

.tool-row {
  width: 100%;
  min-height: 62px;
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr) 18px;
  align-items: center;
  gap: 11px;
  padding: 8px 2px;
  border-bottom: 1px solid var(--line-soft);
  background: transparent;
  text-align: left;
}

.tool-row strong,
.tool-row small {
  display: block;
}

.tool-row strong {
  font-size: 14px;
  line-height: 1.35;
  font-weight: 660;
}

.tool-row small {
  margin-top: 3px;
  color: var(--dim);
  font-size: 11px;
  line-height: 1.35;
}

.tool-glyph {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  background: var(--panel-strong);
  color: var(--accent-strong);
  font-size: 14px;
  font-weight: 780;
}

.tool-glyph svg {
  width: 18px;
  height: 18px;
  stroke-width: 1.8;
}

.tool-arrow {
  color: #66676c;
  font-size: 18px;
}

.empty {
  grid-column: 1 / -1;
  min-height: 128px;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 7px;
  padding: 24px 18px;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  background: var(--bg-raised);
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
  text-align: center;
}

.empty strong {
  display: block;
  color: var(--ink);
  font-size: 15px;
  line-height: 1.4;
  font-weight: 680;
}

.empty p {

}

.empty .primary {
  margin-top: 6px;
}

.discover-error {
  margin-top: 15px;
}

.skeleton {
  background: #202228;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px 10px;
}

.hero,
.account {
  padding: 15px 0 7px;
}

.hero h1,
.account h1,
.detail h1 {
  margin: 5px 0 8px;
  color: var(--ink);
  font-weight: 740;
  text-wrap: balance;
}

.hero h1 {
  font-size: 28px;
  line-height: 1.16;
}

.account h1 {
  font-size: 27px;
  line-height: 1.18;
}

.detail-copy {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.72;
}

.history {
  align-items: center;
  margin: 10px -16px 0;
  padding: 0 16px;
}

.history b {
  flex: none;
  color: var(--dim);
  font-size: 11px;
  font-weight: 600;
}

.history button {
  min-height: 44px;
  flex: none;
  padding: 0 6px;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
}

.filter-row {
  width: max-content;
  display: grid;
  grid-template-columns: repeat(3, minmax(62px, 1fr));
  gap: 3px;
  margin-top: 14px;
  padding: 3px;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  background: #111216;
}

.filter {
  min-height: 44px;
  border: 0;
  background: transparent;
}

.filter.active {
  background: var(--panel-strong);
  color: var(--ink);
  box-shadow: 0 1px 5px rgba(0, 0, 0, .25);
}

.load-more {
  width: 100%;
  min-height: 48px;
  margin-top: 22px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel);
  color: var(--ink);
  font-size: 13px;
  font-weight: 650;
}

.detail {
  margin-top: 0;
  padding-bottom: 24px;
}

.detail-enter {
  animation: detail-in .24s cubic-bezier(.2, .75, .2, 1) both;
}

.detail-hero {
  position: relative;
  height: clamp(350px, 52dvh, 470px);
  margin: 0 -16px -88px;
  overflow: hidden;
  background: #18191d;
}

.detail-hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(9, 10, 12, .48) 0%, rgba(9, 10, 12, .03) 32%, rgba(9, 10, 12, .24) 57%, var(--bg) 100%);
}

.detail-hero img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: center 26%;
}

.detail-content {
  position: relative;
  z-index: 2;
}

.detail h1 {
  max-width: 640px;
  font-size: 30px;
  line-height: 1.12;
}

.fact-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  margin: 11px 0 17px;
}

.fact {
  color: #bab8b5;
  font-size: 11px;
  line-height: 1.5;
}

.fact + .fact::before {
  content: "·";
  margin: 0 7px;
  color: #606167;
}

.media-state {
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin: 17px 0;
  padding: 11px 13px;
  border-left: 2px solid var(--good);
  background: #111713;
}

.media-state div {
  min-width: 0;
}

.media-state b,
.media-state span {
  display: block;
}

.media-state b {
  color: var(--good);
  font-size: 13px;
  line-height: 1.35;
}

.media-state div span,
.media-state > span {
  margin-top: 3px;
  color: #859087;
  font-size: 10px;
}

.media-state > span {
  flex: none;
  margin: 0;
}

.season-title {
  margin: 25px 0 11px;
  font-size: 17px;
  line-height: 1.3;
}

.season-list {
  display: grid;
  gap: 7px;
}

.season {
  min-height: 82px;
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr) auto;
  align-items: center;
  gap: 11px;
  padding: 7px;
  border: 1px solid var(--line-soft);
  border-radius: 7px;
  background: var(--panel);
  text-align: left;
}

.season.selected {
  border-color: rgba(240, 90, 79, .72);
  background: rgba(240, 90, 79, .07);
}

.season img,
.season > span {
  width: 48px;
  height: 68px;
  display: block;
  border-radius: 4px;
  background: #24252a;
  object-fit: cover;
}

.season b,
.season span {
  display: block;
}

.season b {
  overflow: hidden;
  font-size: 13px;
  line-height: 1.4;
  text-overflow: ellipsis;
}

.season div span {
  margin-top: 4px;
  color: var(--dim);
  font-size: 10px;
}

.season-state {
  max-width: 104px;
  overflow: hidden;
  padding: 5px 7px;
  border-radius: 4px;
  background: #202126;
  color: var(--muted);
  font-size: 10px;
  font-style: normal;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.season-state.in_library {
  background: #15241b;
  color: var(--good);
}

.season-state.requested {
  background: #2a1918;
  color: var(--accent-strong);
}

.season-state.upcoming,
.season-state.unknown {
  color: var(--dim);
}

.detail-actions {
  position: sticky;
  z-index: 4;
  bottom: calc(var(--tab-height) + var(--safe-bottom) + var(--tab-gap) + 10px);
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin: 18px -6px 0;
  padding: 7px;
  border: 1px solid rgba(255, 255, 255, .07);
  border-radius: 8px;
  background: #17181d;
  box-shadow: 0 14px 36px rgba(0, 0, 0, .34);
}

.detail-actions .primary,
.wash-action {
  grid-column: 1 / -1;
  width: 100%;
  min-height: 46px;
}

.detail-actions .watch-action,
.detail-actions .share,
.wash-action {
  min-height: 44px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel-strong);
  color: var(--ink);
  font-size: 12px;
  font-weight: 660;
}

.wash-action {
  border-color: rgba(240, 90, 79, .52);
  background: rgba(240, 90, 79, .12);
  color: var(--accent-strong);
}

.archive-workspace {
  min-width: 0;
}

.archive-lead {
  padding: 12px 0 22px;
}

.archive-lead-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
}

.archive-lead h1 {
  max-width: 280px;
  margin: 5px 0 8px;
  font-size: clamp(30px, 9vw, 42px);
  line-height: 1.04;
  letter-spacing: -.045em;
}

.archive-lead h1 span {
  white-space: nowrap;
}

.archive-lead p {
  max-width: 32ch;
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.55;
}

.archive-refresh {
  min-width: 44px;
  min-height: 44px;
  display: grid;
  place-items: center;
  flex: 0 0 44px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--panel);
  color: var(--ink);
  font-size: 18px;
}

.archive-refresh.spinning {
  animation: spin .8s linear infinite;
}

.archive-now {
  position: relative;
  min-height: 184px;
  overflow: hidden;
  display: grid;
  grid-template-columns: 98px minmax(0, 1fr);
  gap: 18px;
  padding: 20px;
  border-top: 1px solid rgba(255, 255, 255, .16);
  border-bottom: 1px solid var(--line);
  background: linear-gradient(112deg, rgba(240, 90, 79, .13), rgba(255, 255, 255, .025) 54%, transparent);
}

.archive-now-copy {
  min-width: 0;
  align-self: end;
}

.archive-now-label {
  display: block;
  margin-bottom: 24px;
  color: var(--accent-strong);
  font-size: 11px;
  font-weight: 760;
  letter-spacing: .08em;
}

.archive-now h2 {
  margin: 0 0 6px;
  overflow: hidden;
  font-size: 22px;
  line-height: 1.14;
  letter-spacing: -.025em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.archive-now p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

.archive-now-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.archive-now-actions button {
  min-height: 44px;
  padding: 0 13px;
  border: 1px solid rgba(255, 255, 255, .18);
  border-radius: 4px;
  background: rgba(255, 255, 255, .08);
  color: var(--ink);
  font-size: 12px;
  font-weight: 680;
}

.archive-now-poster {
  width: 98px;
  height: 140px;
  align-self: center;
  border-radius: 4px;
  background: #24252a;
  object-fit: cover;
  box-shadow: 0 18px 34px rgba(0, 0, 0, .36);
}

.archive-now-empty {
  grid-template-columns: 1fr;
}

.quota-ticket {
  display: grid;
  grid-template-columns: auto 1fr 1fr;
  align-items: center;
  gap: 14px;
  margin: 18px 0 0;
  padding: 13px 0;
  border-top: 1px dashed rgba(255, 255, 255, .16);
  border-bottom: 1px dashed rgba(255, 255, 255, .16);
}

.quota-ticket > span {
  color: var(--muted);
  font-size: 11px;
}

.quota-ticket div {
  min-width: 0;
  display: flex;
  align-items: baseline;
  justify-content: flex-end;
  gap: 5px;
}

.quota-ticket b {
  color: var(--ink);
  font-size: 24px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.quota-ticket small {
  color: var(--dim);
  font-size: 10px;
}

.archive-body {
  min-width: 0;
}

.archive-section {
  margin-top: 28px;
}

.archive-section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 13px;
}

.archive-section-head h2 {
  margin: 0;
  font-size: 18px;
  line-height: 1.2;
  letter-spacing: -.02em;
}

.archive-section-head span,
.archive-section-head button {
  color: var(--muted);
  font-size: 11px;
}

.watch-stack {
  display: grid;
  gap: 1px;
}

.watch-stack-item {
  min-height: 76px;
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line-soft);
  background: transparent;
  text-align: left;
}

.watch-stack-item img,
.watch-stack-poster {
  width: 44px;
  height: 60px;
  display: block;
  border-radius: 3px;
  background: #24252a;
  object-fit: cover;
}

.watch-stack-item b,
.watch-stack-item span {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.watch-stack-item b {
  font-size: 14px;
}

.watch-stack-item span {
  margin-top: 4px;
  color: #aaaab1;
  font-size: 12px;
}

.watch-stack-item em {
  color: var(--dim);
  font-size: 18px;
  font-style: normal;
}

.service-band {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  border-top: 1px solid var(--line);
  border-left: 1px solid var(--line);
}

.service-action {
  min-height: 82px;
  display: grid;
  align-content: space-between;
  gap: 12px;
  padding: 13px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, .025);
  text-align: left;
}

.service-action b {
  font-size: 13px;
}

.service-action span {
  color: #aaaab1;
  font-size: 11px;
  line-height: 1.4;
}

.service-action.primary-service b {
  color: var(--accent-strong);
}

.tool-grid {
  display: grid;
  grid-template-columns: 1fr;
  border-top: 1px solid var(--line-soft);
}

.tool {
  min-height: 64px;
  padding: 10px 2px;
  border-bottom: 1px solid var(--line-soft);
  background: transparent;
  text-align: left;
}

.tool b,
.tool span {
  display: block;
}

.tool b {
  font-size: 14px;
  line-height: 1.4;
  font-weight: 670;
}

.tool span {
  margin-top: 3px;
  color: var(--dim);
  font-size: 11px;
  line-height: 1.4;
}

.tool.primary-tool {
  color: var(--ink);
}

.tool.primary-tool b {
  color: var(--accent-strong);
}

.progress-tabs {
  margin: 0 0 12px;
}

.progress-tab {
  min-height: 44px;
}

.progress-tab.active {
  border-color: rgba(240, 90, 79, .65);
  background: rgba(240, 90, 79, .1);
  color: var(--accent-strong);
}

.request-list {
  display: grid;
  gap: 8px;
}

.request {
  min-width: 0;
  min-height: 88px;
  display: grid;
  grid-template-columns: 50px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 8px;
  border: 1px solid var(--line-soft);
  border-radius: 7px;
  background: var(--panel);
  text-align: left;
}

.request > div {
  min-width: 0;
}

.request-poster {
  width: 50px;
  height: 70px;
  display: block;
  border-radius: 4px;
  background: #24252a;
  object-fit: cover;
}

.request h3 {
  margin: 0 0 3px;
  overflow: hidden;
  font-size: 13px;
  line-height: 1.35;
  font-weight: 650;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.request time,
.request-note {
  display: block;
  margin-top: 4px;
  color: var(--dim);
  font-size: 9px;
  line-height: 1.4;
}

.request-actions {
  min-width: 70px;
  display: grid;
  justify-items: end;
  gap: 5px;
}

.status {
  max-width: 90px;
  overflow: hidden;
  color: var(--accent-strong);
  font-size: 11px;
  line-height: 1.35;
  text-align: right;
  text-overflow: ellipsis;
}

.cancel-request {
  min-height: 44px;
  padding: 0 9px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: #1c1d22;
  color: var(--muted);
  font-size: 10px;
}

.business-badge {
  display: inline-flex;
  margin-bottom: 4px;
  padding: 2px 5px;
  border-radius: 3px;
  background: rgba(240, 90, 79, .12);
  color: var(--accent-strong);
  font-size: 9px;
  font-weight: 720;
}

.compact-row {
  width: 100%;
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 2px;
  border-bottom: 1px solid var(--line-soft);
  background: transparent;
  text-align: left;
}

.compact-row > div {
  min-width: 0;
}

.compact-row b,
.compact-row span {
  display: block;
}

.compact-row b {
  overflow: hidden;
  font-size: 13px;
  line-height: 1.4;
  text-overflow: ellipsis;
}

.compact-row span {
  margin-top: 4px;
  overflow: hidden;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.45;
  text-overflow: ellipsis;
}

.compact-row em {
  max-width: 34%;
  flex: none;
  color: var(--accent-strong);
  font-size: 10px;
  line-height: 1.4;
  font-style: normal;
  text-align: right;
}

.wish-list,
.issue-list {
  border-top: 1px solid var(--line-soft);
}

.form-stack {
  display: grid;
  gap: 9px;
}

.form-stack input,
.form-stack textarea,
.form-stack select,
.adventure-start input {
  width: 100%;
  min-height: 48px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel);
  color: var(--ink);
  font-size: 16px;
  resize: vertical;
}

.form-stack textarea {
  min-height: 116px;
}

.form-stack input:focus,
.form-stack textarea:focus,
.form-stack select:focus,
.adventure-start input:focus {
  border-color: rgba(240, 90, 79, .72);
  box-shadow: 0 0 0 3px rgba(240, 90, 79, .1);
}

.detail-utility {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.utility-action {
  min-height: 44px;
  padding: 0 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel);
  color: var(--ink);
  font-size: 12px;
  font-weight: 650;
}

.adventure-v2 {
  min-height: calc(100dvh - 130px);
  padding: 8px 0 24px;
  color: var(--ink);
}

.adventure-loading {
  display: grid;
  gap: 12px;
  padding-top: 28px;
}

.adventure-intro {
  display: grid;
  align-content: start;
  gap: 22px;
  padding-top: 18px;
}

.adventure-ticket {
  position: relative;
  min-height: 250px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  overflow: hidden;
  padding: 22px 19px;
  border: 1px solid #353138;
  border-radius: 8px;
  background: #17161a;
}

.adventure-ticket::before {
  content: "05";
  position: absolute;
  top: 15px;
  right: 18px;
  color: rgba(240, 90, 79, .18);
  font-size: 62px;
  line-height: 1;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.adventure-ticket > * {
  position: relative;
}

.adventure-ticket strong {
  max-width: 310px;
  margin-top: 8px;
  font-size: 29px;
  line-height: 1.14;
  font-weight: 730;
}

.adventure-ticket p {
  max-width: 460px;
  margin: 11px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.72;
}

.adventure-rules {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.75;
}

.adventure-rule {
  display: inline;
}

.adventure-rule:not(:last-child)::after {
  content: "  ·  ";
  color: #5f6065;
}

.adventure-rule b,
.adventure-rule span {
  display: inline;
  font-size: inherit;
  font-weight: 500;
}

.adventure-rule b {
  color: var(--ink);
}

.adventure-rule span {
  margin-left: 4px;
}

.adventure-start {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 98px;
  gap: 8px;
}

.adventure-start button {
  min-height: 48px;
}

.quest-top {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.quest-title {
  min-width: 0;
}

.quest-title small,
.quest-title strong {
  display: block;
}

.quest-title small {
  overflow: hidden;
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.quest-title strong {
  margin-top: 5px;
  font-size: 17px;
  line-height: 1.3;
  font-weight: 650;
}

.quest-score {
  flex: none;
  text-align: right;
}

.quest-score b,
.quest-score span {
  display: block;
}

.quest-score b {
  font-size: 20px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.quest-score span {
  color: var(--dim);
  font-size: 10px;
}

.quest-track {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 5px;
  margin-bottom: 17px;
}

.quest-step {
  height: 3px;
  border-radius: 2px;
  background: #303137;
}

.quest-step.done {
  background: #8a3732;
}

.quest-step.current {
  background: var(--accent);
}

.quest-hud {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
  color: var(--muted);
  font-size: 11px;
}

.quest-hud > div:first-child {
  min-width: 0;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 9px;

.hp-label {
  flex: none;
}

.hp-label span:first-child {
  display: none;
}

.hp-label span:last-child::before {
  content: "生命 ";
  color: var(--dim);
}

.hp-track {
  height: 4px;
  flex: 1;
  overflow: hidden;
  border-radius: 2px;
  background: #2a2b30;
}

.hp-fill {
  height: 100%;
  background: var(--accent);
}

.combo-chip {
  flex: none;
  display: flex;
  align-items: baseline;
  gap: 4px;
}

.combo-chip b {
  font-size: 16px;
  font-weight: 650;
}

.combo-chip span {
  color: var(--dim);
  font-size: 10px;
}

.quest-scene {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  overflow: hidden;
  border-radius: 7px;
  background: #18191d;
}

.quest-scene::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 30%, rgba(7, 8, 10, .9) 100%);
}

.quest-scene img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.quest-scene-copy {
  position: absolute;
  z-index: 1;
  left: 17px;
  right: 17px;
  bottom: 16px;
}

.quest-scene-copy small {
  color: var(--accent-strong);
  font-size: 10px;
  font-weight: 650;
}

.quest-scene-copy h1 {
  margin: 5px 0 0;
  color: #fff;
  font-size: 23px;
  line-height: 1.18;
  font-weight: 680;
  text-shadow: 0 2px 12px rgba(0, 0, 0, .55);
}

.quest-narrative {
  max-width: 44em;
  margin: 16px 1px 19px;
  color: #d0cecc;
  font-size: 14px;
  line-height: 1.76;
}

.quest-message,
.quest-hint {
  margin: 10px 0;
  padding: 11px 12px;
  border-left: 2px solid var(--accent);
  background: rgba(240, 90, 79, .08);
  color: #d7d3d1;
  font-size: 12px;
  line-height: 1.65;
}

.quest-hint {
  border-color: var(--warning);
  background: rgba(232, 179, 94, .08);
}

.quest-prompt {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 19px 0 8px;
}

.quest-prompt strong {
  font-size: 15px;
  font-weight: 650;
}

.quest-prompt span {
  color: var(--dim);
  font-size: 10px;
}

.quest-choices {
  border-top: 1px solid var(--line-soft);
}

.quest-choice {
  width: 100%;
  min-height: 60px;
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto;
  align-items: center;
  gap: 9px;
  padding: 10px 2px;
  border-bottom: 1px solid var(--line-soft);
  background: transparent;
  text-align: left;
}

.quest-choice.selected {
  background: rgba(240, 90, 79, .06);
}

.quest-choice:disabled {
  opacity: .56;
}

.choice-key {
  color: var(--accent-strong);
  font-size: 11px;
  font-weight: 700;
}

.choice-text {
  min-width: 0;
  font-size: 13px;
  line-height: 1.5;
}

.choice-state {
  color: var(--dim);
  font-size: 10px;
}

.quest-tools {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 14px;
}

.quest-tool {
  min-height: 44px;
  padding: 0 8px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel);
  color: var(--muted);
  font-size: 12px;
}

.quest-tool:disabled {
  opacity: .48;
}

.quest-finish {
  display: grid;
  gap: 18px;
  padding-top: 15px;
}

.finish-hero {
  display: grid;
  grid-template-columns: 78px minmax(0, 1fr);
  align-items: center;
  gap: 15px;
  padding: 18px 0 22px;
  border-bottom: 1px solid var(--line-soft);
}

.finish-grade {
  width: 78px;
  height: 78px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(240, 90, 79, .56);
  border-radius: 50%;
  color: var(--accent-strong);
  font-size: 32px;
  font-weight: 750;
}

.finish-hero h1 {
  margin: 5px 0 6px;
  font-size: 25px;
  line-height: 1.18;
}

.finish-hero p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.finish-stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1px;
  background: var(--line-soft);
}

.finish-stat {
  min-width: 0;
  min-height: 70px;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 4px;
  padding: 10px 5px;
  background: var(--bg);
  text-align: center;
}

.finish-stat b {
  font-size: 18px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.finish-stat span {
  color: var(--dim);
  font-size: 10px;
}

.actions {
  display: grid;
  grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr);
  gap: 8px;
}

.secondary {
  min-height: 44px;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel);
  color: var(--ink);
  font-size: 12px;
  font-weight: 650;
}

.confirm {
  position: fixed;
  z-index: 30;
  inset: 0;
  display: flex;
  align-items: flex-end;
  padding-top: var(--safe-top);
  background: rgba(0, 0, 0, .8);
  animation: veil-in .18s ease-out both;
}

.sheet {
  width: 100%;
  max-width: 720px;
  max-height: min(88dvh, 760px);
  margin: 0 auto;
  padding: 20px 16px calc(16px + var(--safe-bottom));
  overflow-y: auto;
  border: 1px solid #33353b;
  border-bottom: 0;
  border-radius: 8px 8px 0 0;
  background: #15161a;
  box-shadow: 0 -22px 50px rgba(0, 0, 0, .42);
  animation: sheet-up .24s cubic-bezier(.2, .75, .2, 1) both;
}

.sheet::before {
  content: "";
  width: 34px;
  height: 3px;
  display: block;
  margin: -7px auto 15px;
  border-radius: 2px;
  background: #4b4c52;
}

.sheet h2 {
  margin: 7px 0 9px;
  font-size: 23px;
  line-height: 1.2;
  font-weight: 720;
  text-wrap: balance;
}

.sheet .summary {
  display: grid;
  gap: 0;
  margin: 16px 0;
  border-top: 1px solid var(--line-soft);
}

.sheet .summary div {
  min-height: 45px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  border-bottom: 1px solid var(--line-soft);
  color: var(--muted);
  font-size: 11px;
}

.sheet .summary b {
  color: var(--ink);
  font-weight: 620;
  text-align: right;
}

.result-mark {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #173322;
  color: var(--good);
  font-size: 22px;
}

.bottom {
  position: fixed;
  z-index: 10;
  right: 0;
  bottom: 0;
  left: 0;
  width: 100%;
  min-height: calc(var(--tab-height) + var(--safe-bottom));
  padding: 3px 8px var(--safe-bottom);
  border-top: 1px solid #2b2d33;
  background: #15161a;
  box-shadow: 0 -10px 28px rgba(0, 0, 0, .26);
}

.bottom nav {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}

.nav {
  position: relative;
  min-width: 0;
  min-height: 44px;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 1px;
  padding: 1px 2px 3px;
  border-radius: 14px;
  background: transparent;
  color: #d5d2d5;
  font-size: 10px;
}

.nav i {
  width: 19px;
  height: 19px;
  display: grid;
  place-items: center;
  font-style: normal;
  opacity: .72;
  transition: transform .2s ease, opacity .2s ease;
}

.nav svg {
  width: 18px;
  height: 18px;
  stroke-width: 1.7;
}

.nav.active {
  background: transparent;
  color: var(--accent-strong);
}

.nav.active::after {
  content: "";
  position: absolute;
  bottom: 1px;
  left: 50%;
  width: 16px;
  height: 2px;
  border-radius: 2px;
  background: var(--accent-strong);
  transform: translateX(-50%);
}

.nav.active i {
  opacity: 1;
  transform: translateY(-1px) scale(1.06);
}

.toast {
  position: fixed;
  z-index: 40;
  left: 50%;
  bottom: calc(var(--tab-height) + var(--safe-bottom) + var(--tab-gap) + 14px);
  width: max-content;
  max-width: calc(100vw - 32px);
  padding: 10px 13px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, .14);
  border-radius: 7px;
  background: #f2f0ed;
  color: #181719;
  font-size: 12px;
  line-height: 1.4;
  white-space: normal;
  text-align: center;
  text-overflow: ellipsis;
  opacity: 0;
  transform: translate(-50%, 10px);
  transition: opacity .18s ease, transform .18s ease;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@keyframes root-in-forward {
  from {
    opacity: .35;
    transform: translateX(14px);
  }
}

@keyframes root-in-backward {
  from {
    opacity: .35;
    transform: translateX(-14px);
  }
}

@keyframes row-in {
  from {
    opacity: .5;
    transform: translateY(5px);
  }
}

@keyframes detail-in {
  from {
    opacity: .55;
    transform: translateY(14px);
  }
}

@keyframes tab-active {
  from {
    opacity: .7;
    transform: scale(.9);
  }
}

.root-view {
  min-width: 0;
}

.root-enter-forward {
  animation: root-in-forward .22s ease-out both;
}

.root-enter-backward {
  animation: root-in-backward .22s ease-out both;
}

.root-enter :is(.grid, .request-list, .tool-list) > :nth-child(-n + 6) {
  animation: row-in .18s ease-out both;
}

.root-enter :is(.grid, .request-list, .tool-list) > :nth-child(2) { animation-delay: .014s; }
.root-enter :is(.grid, .request-list, .tool-list) > :nth-child(3) { animation-delay: .028s; }
.root-enter :is(.grid, .request-list, .tool-list) > :nth-child(4) { animation-delay: .042s; }
.root-enter :is(.grid, .request-list, .tool-list) > :nth-child(5) { animation-delay: .056s; }
.root-enter :is(.grid, .request-list, .tool-list) > :nth-child(6) { animation-delay: .07s; }

.tab-transition .nav.active i {
  animation: tab-active .18s ease-out both;
}

@keyframes veil-in {
  from {
    opacity: 0;
  }
}

@keyframes sheet-up {
  from {
    opacity: .6;
    transform: translateY(24px);
  }
}

@supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .glass-surface {
    background-color: rgba(17, 18, 21, .72);
    -webkit-backdrop-filter: blur(16px) saturate(118%);
    backdrop-filter: blur(16px) saturate(118%);
  }

}

@supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .glass-surface {
    background-color: rgba(20, 21, 24, .96);
  }
}

@media (hover: hover) {
  .media:hover .poster img {
    transform: scale(1.025);
  }

  .tool-row:hover,
  .tool:hover,
  .compact-row:hover,
  .quest-choice:hover {
    background: rgba(255, 255, 255, .025);
  }
}

.tool-workspace {
  min-width: 0;
}

.tool-header {
  padding: 10px 0 26px;
  border-bottom: 1px solid var(--line);
}

.tool-header > p {
  margin: 0 0 7px;
  color: var(--accent);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .09em;
}

.tool-header h1 {
  margin: 0 0 22px;
  max-width: 680px;
  font-size: clamp(28px, 8vw, 44px);
  line-height: 1.06;
  letter-spacing: -.045em;
}

.tool-body {
  padding-top: 24px;
}

.search-workspace {
  min-width: 0;
  padding: 12px 0 8px;
}

.view-search .app-bar {
  border-radius: 0;
}

.search-console {
  min-width: 0;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line-soft);
}

.search-workspace .search {
  min-height: 52px;
  margin: 0;
  padding: 3px 3px 3px 13px;
  border-color: #393b42;
  background: #17181c;
  box-shadow: 0 8px 20px rgba(0, 0, 0, .2);
}

.search-workspace .search:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(240, 90, 79, .15), 0 10px 24px rgba(0, 0, 0, .26);
}

.search-workspace .search-icon {
  color: #a6a7ac;
}

.search-workspace .search-submit {
  width: 44px;
  min-width: 44px;
  height: 44px;
  min-height: 44px;
  display: grid;
  place-items: center;
  padding: 0;
  border-radius: 6px;
  background: var(--accent);
  color: var(--accent-ink);
}

.search-workspace .search-submit svg {
  width: 20px;
  height: 20px;
  stroke-width: 2;
}

.search-history {
  min-width: 0;
  margin-top: 14px;
}

.search-history-head {
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.search-history-head h2 {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
  font-weight: 680;
}

.search-history-head button {
  min-width: 44px;
  min-height: 44px;
  padding: 0 4px;
  background: transparent;
  color: var(--dim);
  font-size: 11px;
}

.search-history-list {
  min-width: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.search-history-list button {
  min-width: 0;
  min-height: 44px;
  max-width: 100%;
  overflow: hidden;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #131418;
  color: #d8d6d3;
  font-size: 12px;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.search-workspace .filter-row {
  width: 100%;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin-top: 12px;
  padding: 3px;
  border-color: #2a2c32;
  background: #101115;
}

.search-workspace .filter {
  min-width: 0;
  padding: 0 8px;
  border-radius: 5px;
  color: #aeadb1;
}

.search-workspace .filter.active {
  background: #292b30;
  color: #fff;
  box-shadow: none;
}

.search-results {
  min-width: 0;
  padding: 16px 0 12px;
}

.search-result-head {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line-soft);
}

.search-result-context {
  min-width: 0;
}

.search-result-context small {
  display: block;
  margin-bottom: 2px;
  color: var(--dim);
  font-size: 10px;
  line-height: 1.3;
}

.search-result-head h2 {
  margin: 0;
  overflow: hidden;
  color: var(--ink);
  font-size: 17px;
  line-height: 1.3;
  font-weight: 720;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.search-result-count {
  min-height: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  color: #b6b4b1;
  font-size: 11px;
  line-height: 1.3;
  white-space: nowrap;
}

.search-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px 8px;
}

.search-grid .media {
  width: 100%;
  overflow: hidden;
}

.search-grid .media h3 {
  margin-top: 7px;
}

.search-card-skeleton {
  min-width: 0;
}

.search-card-skeleton .poster {
  box-shadow: none;
}

.search-skeleton-line {
  width: 78%;
  height: 11px;
  display: block;
  margin: 8px 1px 0;
  border-radius: 3px;
}

.search-skeleton-line.is-meta {
  width: 48%;
  height: 8px;
  margin-top: 6px;
}

.search-idle {
  grid-column: 1 / -1;
  min-height: 220px;
  display: grid;
  align-content: start;
  gap: 18px;
  padding: 18px 0 24px;
  color: var(--muted);
}

.search-idle-copy {
  display: grid;
  gap: 5px;
}

.search-idle-copy strong {
  color: var(--ink);
  font-size: 18px;
  line-height: 1.35;
}

.search-idle-copy span {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

.search-starters {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.search-starters button {
  min-width: 0;
  min-height: 48px;
  overflow: hidden;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #15161a;
  color: #d8d6d3;
  font-size: 12px;
  text-align: left;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.search-workspace .empty {
  min-height: 190px;
  border-right: 0;
  border-left: 0;
  border-radius: 0;
  background: transparent;
}

.search-workspace .load-more {
  margin-bottom: 8px;
}

.tool-workspace .section:first-child {
  margin-top: 0;
}

.app-dock {
  border-radius: 0;
  box-shadow: 0 -12px 28px rgba(0, 0, 0, .28);
}

@media (min-width: 600px) {
  .shell {
    padding-right: 28px;
    padding-left: 28px;
  }

  .detail-hero {
    margin-right: -28px;
    margin-left: -28px;
  }

  .rail,
  .recent-rail,
  .chips,
  .history {

    margin-left: -28px;

    padding-left: 28px;
  }

  .rail {
    grid-auto-columns: 22%;
  }

  .recent-rail {
    grid-auto-columns: 18%;

  .activity-section .rail {

  .grid {

  }

  .search-workspace {

  }

  .search-console {

  .search-history {

  }

  .search-workspace .filter-row {

  }

  .search-grid {
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 20px 10px;
  }

  .detail h1 {

  }

  .tool-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0 18px;
  }

    max-width: 1040px;
  }

    top: calc(var(--safe-top) + 24px);

  .thread-turn {

    margin: 0;

  .thread-turn.is-wide {

    margin: 0;
  }

  .thread-turn.is-wide .thread-art {

    margin-left: 0;
  }

  .thread-turn.is-wide .thread-caption {
    z-index: 3;
    margin: -53px 12px 0 0;
    padding: 0 12px 11px;
  }

  .thread-turn.is-wide .thread-caption strong {

    text-shadow: 0 2px 10px rgba(0, 0, 0, .75);

  .search-workspace {

  }

  .search-history {

  }

  .search-history-list {

  }

  .search-history-list button {

    text-align: left;
  }

  }

  .search-results {

  }

  .search-results .search-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));

  }

  }

  .tool-header {
    position: sticky;
    top: calc(var(--safe-top) + 76px);
    border-bottom: 0;

/* Liquid Glass v2: shared material system and native root scenes. */
:root {
  --glass-thin: rgba(29, 30, 35, .54);
  --glass-regular: rgba(24, 25, 30, .7);
  --glass-thick: rgba(18, 19, 23, .88);
  --glass-edge: rgba(255, 255, 255, .2);
  --glass-sheen: rgba(255, 255, 255, .14);
  --glass-saturation: 142%;
  --glass-elevation: 0 16px 44px rgba(0, 0, 0, .32), inset 0 1px 0 rgba(255, 255, 255, .17), inset 0 -1px 0 rgba(255, 255, 255, .035);
}

body {
  background:
    linear-gradient(90deg, rgba(240, 90, 79, .045), transparent 26%, transparent 74%, rgba(99, 201, 141, .025)),
    linear-gradient(180deg, #101115 0, var(--bg) 28%, #0c0d10 100%);
  background-attachment: fixed;
}

body::before {
  content: "";
  position: fixed;
  z-index: -1;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(155deg, rgba(255, 255, 255, .035), transparent 31%, rgba(240, 90, 79, .028) 68%, transparent);
}

.app-dock,

.progress-tabs,

.request-list,
.service-band,
.sheet,
.toast {
  border-color: var(--glass-edge);
  background-color: var(--glass-regular);
  box-shadow: var(--glass-elevation);
}

.app-bar {
  border-radius: 0 0 18px 18px;
}

.app-dock {
  right: 12px;

/* Timeline states stay semantic even when the source only exposes event codes. */
.progress-tabs { position: relative; padding-right: 10px; mask-image: linear-gradient(90deg,#000 0,#000 calc(100% - 18px),transparent); }
.progress-tab { display: inline-flex; align-items: center; gap: 7px; }
.progress-tab b { min-width: 20px; height: 20px; display: grid; place-items: center; padding: 0 5px; border-radius: 10px; background: rgba(255,255,255,.07); color: var(--ink); font-size: 10px; font-weight: 720; }
.confirm { background: rgba(0,0,0,.88); }
.sheet { position: relative; background: #15161a; }
.sheet-close { position: absolute; z-index: 2; top: 10px; right: 10px; width: 44px; height: 44px; display: grid; place-items: center; margin: 0; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.08); color: var(--ink); font-size: 24px; line-height: 1; }
.sheet-close + .kicker { padding-right: 48px; }
.request-active { border-left: 2px solid #79b4ff !important; }
.request-done { border-left: 2px solid #78d89b !important; }
.request-failed, .request-cancelled { border-left: 2px solid #ff746b !important; }
.status-dot { width: 7px; height: 7px; display: inline-block; margin-right: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px rgba(240,90,79,.08); }
.request-active .status { color: #79b4ff; }
.request-done .status { color: #78d89b; }
.request-failed .status, .request-cancelled .status { color: #ff928a; }
.timeline-loading { height: 180px; margin-top: 16px; border-radius: 8px; }
.timeline-current { margin: 14px 0 18px; padding: 14px; border: 1px solid var(--line-soft); border-left: 3px solid #8d8f96; border-radius: 8px; background: rgba(255,255,255,.035); }
.timeline-current > span { color: var(--muted); font-size: 10px; font-weight: 720; }
.timeline-current h2 { margin: 5px 0 4px; font-size: 20px; }
.timeline-current p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
.timeline-current.timeline-active { border-left-color: #79b4ff; }
.timeline-current.timeline-queued { border-left-color: #f0b75a; }
.timeline-current.timeline-done { border-left-color: #78d89b; }
.timeline-current.timeline-failed, .timeline-current.timeline-cancelled { border-left-color: #ff746b; }
.timeline-list { margin: 0; padding: 0; list-style: none; }
.timeline-node { position: relative; min-height: 68px; display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 10px; }
.timeline-node:not(:last-child)::before { content: ""; position: absolute; left: 9px; top: 20px; bottom: 0; width: 1px; background: var(--line); }
.timeline-marker { z-index: 1; width: 11px; height: 11px; margin: 5px 0 0 4px; border: 3px solid #1b1c21; border-radius: 50%; background: #777a82; box-shadow: 0 0 0 1px #777a82; }
.timeline-active .timeline-marker { background: #79b4ff; box-shadow: 0 0 0 1px #79b4ff; }
.timeline-queued .timeline-marker { background: #f0b75a; box-shadow: 0 0 0 1px #f0b75a; }
.timeline-done .timeline-marker { background: #78d89b; box-shadow: 0 0 0 1px #78d89b; }
.timeline-failed .timeline-marker, .timeline-cancelled .timeline-marker { background: #ff746b; box-shadow: 0 0 0 1px #ff746b; }
.timeline-node.is-current .timeline-marker { transform: scale(1.18); }
.timeline-copy { padding: 0 0 14px; border-bottom: 1px solid var(--line-soft); }
.timeline-copy > div { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
.timeline-copy b { color: var(--ink); font-size: 13px; line-height: 1.45; }
.timeline-copy span, .timeline-copy time { color: var(--dim); font-size: 10px; line-height: 1.45; }
.timeline-copy span { flex: none; }
.timeline-copy time { display: block; margin-top: 4px; }
.timeline-actions { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; margin-top: 16px; }
.timeline-actions button { width: 100%; min-height: 46px; margin: 0; }
.timeline-actions button:nth-child(3) { grid-column: 1 / -1; }

/* ============================================================
   YIMAO · DESIGN SYSTEM v2 — 「一屏一台戏」深夜点播台
   整合原则：
   1. 焦点纪律：一屏只突出一个主体（电影/输入），其余退让
   2. 色彩纪律：深海青绿 = 品牌与导航；珊瑚 = 唯一动作色（发送/求片）
   3. 材质纪律：玻璃只用在承载层（输入面板、底栏、弹层、操作条），
      海报与背景靠氛围光与景深，不做无意义 blur
   ============================================================ */
:root{
  --bg:#070b0d;
  --bg-raised:#0e171b;
  --panel:#132026;
  --panel-strong:#1a2b32;
  --ink:#eef6f3;
  --muted:#9fb4b2;
  --dim:#6d8584;
  --accent:#57c7b2;

  box-shadow:var(--spec), 0 18px 44px rgba(0,0,0,.30);
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
}

/* ---------- 动作色纪律：珊瑚 = 唯一的“做” ---------- */

  background:linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,.05) 46%, rgba(255,255,255,.16)), linear-gradient(120deg, rgba(255,128,108,.66), rgba(255,128,108,.14) 54%, rgba(255,128,108,.40));

}
.primary{min-height:48px; padding:0 22px}
.primary:hover,.search button:hover{filter:brightness(1.08)}

.secondary,.sheet-close,.detail-actions .watch-action,.detail-actions .share{
  min-height:44px; border:1px solid var(--line); border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.03)), rgba(20,34,41,.6);
  box-shadow:var(--spec), 0 8px 18px rgba(0,0,0,.2); color:var(--ink);

function relativeTime(value){if(!value)return'时间未单独记录';const t=new Date(value).getTime();if(!Number.isFinite(t))return'时间未单独记录';const delta=Math.max(0,Date.now()-t),minute=Math.floor(delta/60000),hour=Math.floor(minute/60),day=Math.floor(hour/24);if(minute<1)return'刚刚';if(minute<60)return minute+' 分钟前';if(hour<24)return hour+' 小时前';if(day<7)return day+' 天前';return new Date(t).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})}

async function openProgress(requestID){const ctx=openDialog(`<div class="kicker">进度时间线</div><h2 id="dialog-title">正在读取真实进度…</h2><div class="timeline-loading skeleton"></div>`);try{const d=await api('/api/miniapp/v1/progress?request_id='+encodeURIComponent(requestID),{signal:ctx.signal});if(!isCurrentDialog(ctx.seq))return;const events=Array.isArray(d.events)?d.events:[],latest=events.at(-1)||{},tone=progressTone(latest.code),record=(S.me?.requests||[]).find(r=>String(r.request_id??r.id??'')===String(requestID)),mid=Number(record?.tmdb_id),mt=record?.media_type==='tv'||record?.media_type==='电视剧'?'tv':'movie',season=Number(record?.season)||0,rows=events.map((e,index)=>{const nodeTone=progressTone(e.code);return `<li class="timeline-node timeline-${nodeTone} ${index===events.length-1?'is-current':''}"><span class="timeline-marker" aria-hidden="true"></span><div class="timeline-copy"><div><b>${esc(e.text||progressLabel(e.code))}</b><span>${esc(progressLabel(e.code))}</span></div><time datetime="${esc(e.at||'')}">${esc(relativeTime(e.at))}${e.at?' · '+esc(new Date(e.at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})):''}</time></div></li>`}).join(''),canOpen=Number.isFinite(mid)&&mid>0,primary=['failed','cancelled'].includes(tone)?`<button class="primary" onclick="closeConfirm();goSearch()">重新找片</button>`:canOpen?`<button class="primary" data-mid="${mid}" data-type="${mt}" data-season="${season}" onclick="openProgressDetail(this)">${tone==='done'?'查看作品':'作品详情'}</button>`:`<button class="primary" onclick="closeConfirm()">知道了</button>`,secondary=['failed','cancelled'].includes(tone)?`${canOpen?`<button class="secondary" data-mid="${mid}" data-type="${mt}" data-season="${season}" onclick="openProgressDetail(this)">作品详情</button>`:''}<button class="secondary" onclick="closeConfirm();goIssues()">反馈问题</button>`:`<button class="secondary" onclick="closeConfirm()">关闭</button>`,dialog=document.getElementById('confirm');dialog.querySelector( async function refreshMe(button){if(button){button.disabled=true;button.classList.add('spinning');button.textContent='刷新中…'}await goMe(true);tg?.HapticFeedback?.impactOccurred?.('light')}
function openCancel(requestID,title,kind='求片'){const wash=kind==='洗版工单';openDialog(`<div class="kicker">撤回${esc(kind)}</div><h2 id="dialog-title">${esc(title)}</h2><p class="detail-copy">仅待审核${wash?'洗版工单':'申请'}可以撤回。${wash?'撤回不会影响当前版本。':'撤回后会返还本次占用的配额，审核中的请求不会被中断。'}</p><div class="actions"><button class="secondary" onclick="closeConfirm()">保留</button><button class="primary" style="margin:0" data-id="${esc(requestID)}" data-wash="${wash?'1':'0'}" onclick="cancelRequest(this)">确认撤回</button></div>`,{initialFocus:'.secondary'})}
async function cancelRequest(button){if(button.disabled)return;const ctx=dialogContext();if(!ctx)return;const requestID=button.dataset.id,wash=button.dataset.wash==='1';button.disabled=true;button.textContent='正在撤回…';setDialogBusy(ctx.seq,true);try{const d=await api('/api/miniapp/v1/request/cancel',{method:'POST',signal:ctx.signal,body:JSON.stringify({request_id:requestID})});if(!isCurrentDialog(ctx.seq))return;closeConfirm(ctx.seq);tg?.HapticFeedback?.notificationOccurred?.('success');toast(wash?'洗版工单已撤回':d.quota_restored?'已撤回，配额已返还':'已撤回，配额返还待处理');await goMe(true)}catch(e){if(e?.name==='AbortError'||!isCurrentDialog(ctx.seq))return;setDialogBusy(ctx.seq,false);button.disabled=false;button.textContent='确认撤回';toast(e.message||'撤回失败')}}
function leaveDetail(){S.detailSeq++;S.detailVisible=false;syncNativeBack()}
function queueRootMotion(next){const from=S.detailVisible?S.detailFrom:S.view;if(!ROOT_VIEWS.includes(next)||!ROOT_VIEWS.includes(from)||from===next){S.rootMotion='';return}S.rootMotion=ROOT_VIEWS.indexOf(next)>ROOT_VIEWS.indexOf(from)?'forward':'backward'}
function goHome(){queueRootMotion('home');leaveDetail();S.view='home';render();requestAnimationFrame(()=>window.scrollTo(0,S.scroll.home||0))}function goSearch(){cancelAssistant();queueRootMotion('search');leaveDetail();S.view='search';render();requestAnimationFrame(()=>window.scrollTo(0,S.scroll.search||0));if(!S.results.length)setTimeout(()=>document.getElementById('q')?.focus(),50)}async function goMe(silent=false){cancelAssistant();queueRootMotion('me');leaveDetail();S.view='me';syncNativeBack();const seq=++S.meSeq;if(!silent){S.me=null;S.meError='';S.watchError='';render()}const [me,watch]=await Promise.allSettled([api('/api/miniapp/v1/me'),api('/api/miniapp/v1/watchlist')]);if(seq!==S.meSeq||S.view!=='me')return;if(me.status==='fulfilled'){S.me=me.value;S.meError='';S.lastMeRefresh=Date.now()}else{S.meError=me.reason?.message||'求片进度暂时无法加载';if(!silent)toast(S.meError)}if(watch.status==='fulfilled'){S.watchlist=watch.value.items||[];S.watchError=''}else{S.watchError=watch.reason?.message||'想看片单暂时没加载出来';if(!silent)toast(S.watchError)}render()}function setProgressType(v){S.progressType=v;render()}
let searchController=null;
function cancelSearch(){searchController?.abort();searchController=null;S.searchSeq++;S.loading=false}
function resetSearchPage(){S.page=1;S.nextPage=2;S.hasMore=false;S.results=[]}
function quick(q){queueRootMotion('search');S.query=q;S.view='search';resetSearchPage();rememberSearch(q);doSearch(false,1)}
function submitSearch(e){e.preventDefault();const query=document.getElementById('q').value.trim();if(!query){cancelSearch();S.query='';resetSearchPage();render();return}queueRootMotion('search');S.query=query;S.view='search';resetSearchPage();rememberSearch(S.query);doSearch(false,1)}
function setSearchType(v){S.searchType=v;if(S.query){resetSearchPage();doSearch(false,1)}else{cancelSearch();render()}}
function setSearchSort(v){if(!['relevance','rating','newest'].includes(v)||S.searchSort===v)return;S.searchSort=v;localStorage.setItem('yunhai_search_sort',v);render();tg?.HapticFeedback?.selectionChanged?.()}
function rememberSearch(q){S.history=[q,...S.history.filter(x=>x!==q)].slice(0,5);localStorage.setItem('yunhai_search_history',JSON.stringify(S.history))}function clearHistory(){S.history=[];localStorage.removeItem('yunhai_search_history');render()}function clearRecent(){S.recent=[];localStorage.removeItem('yunhai_recent_views');render()}function rememberView(x){const item={tmdb_id:id(x),type:x.type||type(x),title:x.title||title(x),year:x.year||year(x),poster_path:x.poster_path||x.poster,vote_average:x.vote_average||0,season:x.type==='tv'?S.season:0};S.recent=[item,...S.recent.filter(y=>!(id(y)===item.tmdb_id&&type(y)===item.type))].slice(0,12);localStorage.setItem('yunhai_recent_views',JSON.stringify(S.recent))}function saveSearchState(){localStorage.setItem('yunhai_search_query',S.query);localStorage.setItem('yunhai_search_page',String(S.page));localStorage.setItem('yunhai_search_more',S.hasMore?'1':'0');localStorage.setItem('yunhai_search_type',S.searchType);localStorage.setItem('yunhai_search_results',JSON.stringify(S.results));localStorage.setItem('yunhai_search_scroll',String(S.scroll.search||0))}
function loadMore(){if(!S.loading&&S.hasMore){const request={query:S.query,type:S.searchType,page:S.nextPage};doSearch(true,request.page,request)}}
async function searchWithAssistant(query,typeName,signal){try{const d=await api('/api/miniapp/v1/assistant',{method:'POST',signal,body:JSON.stringify({message:query,history:[]})});if(d?.degraded)return[];const wanted=['movie','tv'].includes(typeName)?typeName:'';return(Array.isArray(d?.items)?d.items:[]).map(safeAssistantItem).filter(x=>x&&(!wanted||type(x)===wanted)).slice(0,12)}catch(e){if(e?.name==='AbortError')throw e;return[]}}
async function doSearch(append,targetPage=1,request=null){if(!S.query)return;searchController?.abort();const controller=new AbortController();searchController=controller;const seq=++S.searchSeq,current=request||{query:S.query,type:S.searchType,page:targetPage};S.loading=true;render();try{const f=current.type==='all'?'':'&type='+encodeURIComponent(current.type),d=await api('/api/miniapp/v1/search?q='+encodeURIComponent(current.query)+'&page='+current.page+f,{signal:controller.signal});if(seq!==S.searchSeq||searchController!==controller||S.query!==current.query||S.searchType!==current.type)return;S.results=append?[...S.results,...(d.results||[])]:d.results||[];S.page=Number(d.page)||current.page;S.nextPage=Number(d.next_page)||S.page+1;S.hasMore=!!d.has_more;if(!append&&!S.results.length&&!S.hasMore){const assisted=await searchWithAssistant(current.query,current.type,controller.signal);if(seq!==S.searchSeq||searchController!==controller||S.query!==current.query||S.searchType!==current.type)return;S.results=assisted;S.page=1;S.nextPage=2;S.hasMore=false}}catch(e){if(e?.name==='AbortError'||seq!==S.searchSeq||searchController!==controller)return;if(!append){S.results=[];S.hasMore=false}toast(e.message||'搜索暂时不可用')}finally{if(seq===S.searchSeq&&searchController===controller&&S.query===current.query&&S.searchType===current.type){searchController=null;S.loading=false;saveSearchState();render()}}}
async function openDetail(mid,mt,wantedSeason=0){if(!mid)return;S.detailError=null;S.scroll[S.view]=window.scrollY;if(S.view==='search'){localStorage.setItem('yunhai_search_scroll',String(S.scroll.search));saveSearchState()}const seq=++S.detailSeq;S.detailFrom=S.view;S.season=0;S.detailVisible=true;showDetailSkeleton();try{const seasonParam=mt==='tv'&&Number(wantedSeason)>0?'&season='+encodeURIComponent(Number(wantedSeason)):'';const detail=await api(`/api/miniapp/v1/detail?id=${mid}&type=${mt}${seasonParam}`);if(seq!==S.detailSeq)return;if(mt==='tv'&&detail.seasons?.length){const allowed=detail.seasons.some(s=>s.number===Number(wantedSeason));S.season=allowed?Number(wantedSeason):detail.seasons[0].number;detail.media_status=detail.seasons.find(s=>s.number===S.season)?.status||{code:'unknown',text:'暂时无法确认'}}S.detail=detail;rememberView(detail);showDetail()}catch(e){if(seq===S.detailSeq){S.detailError={mid,mt,season:wantedSeason,message:'详情暂时没加载出来'};showDetailError()}}}
function showDetailError(){const e=S.detailError;showNativeBack();document.getElementById('app').innerHTML=chrome(`<section class="detail"><div class="empty" style="margin-top:32px"><strong>${esc(e.message)}</strong><p class="detail-copy">上游响应有点慢，不影响其他页面。</p><button class="primary" onclick="openDetail(${e.mid},'${e.mt}',${e.season})">重新加载</button></div></section>`,S.detailFrom);scheduleChromeDynamics()}
function showDetailSkeleton(){showNativeBack();document.getElementById('app').innerHTML=chrome(`<section class="detail detail-enter"><div class="detail-hero skeleton"></div><div class="poster skeleton" style="height:44px;aspect-ratio:auto;margin:12px 0"></div><div class="poster skeleton" style="height:90px;aspect-ratio:auto"></div><div class="detail-actions"><button class="primary" disabled>正在加载详情…</button><button class="watch-action" disabled>加入想看</button><button class="share" disabled>分享</button></div></section>`,S.detailFrom);scheduleChromeDynamics()}
function showDetail(){const x=S.detail,mt=x.type,p=img(x.backdrop_path||x.poster_path),q=x.quota||{},used=mt==='tv'?q.tv_used:q.movie_used,limit=mt==='tv'?q.tv_limit:q.movie_limit,remain=limit===-1?'不限':Math.max(0,(limit||0)-(used||0));const disabled=x.media_status?.code!=='available';const seasons=mt==='tv'?(x.seasons||[]).map(s=>`<button class="season ${S.season===s.number?'selected':''}" onclick="selectSeason(${s.number})">${s.poster_path?`<img src="${esc(img(s.poster_path))}" alt="">`:'<span></span>'}<div><b>${esc(s.name||'第 '+s.number+' 季')}</b><span>${esc((s.air_date||'').slice(0,4)||'年份待定')} · ${s.episode_count||0} 集</span></div><em class="season-state ${esc(s.status?.code||'unknown')}">${esc(s.status?.text||'暂时无法确认')}</em></button>`).join(''):'';showNativeBack();document.getElementById('app').innerHTML=chrome(`<section class="detail"><div class="detail-hero">${p?`<img src="${esc(p)}" alt="${esc(x.title)}">`:''}</div><div class="detail-content"><div class="kicker">${mt==='tv'?'剧集':'电影'} · ${esc(x.year||'年份待定')}</div><h1>${esc(x.title)}</h1>${x.original_title&&x.original_title!==x.title?`<div class="meta">${esc(x.original_title)}</div>`:''}<div class="fact-row">${x.vote_average?`<span class="fact">★ ${Number(x.vote_average).toFixed(1)} · ${x.vote_count||0} 人评分</span>`:''}${x.runtime?`<span class="fact">${x.runtime} 分钟</span>`:''}${(x.genres||[]).map(g=>`<span class="fact">${esc(g)}</span>`).join('')}</div><div class="media-state"><div><b>${esc(x.media_status?.text||'可以求片')}</b><span>当前状态</span></div><span>今日剩余 ${remain}</span></div><p class="detail-copy">${esc(x.overview||'这部作品还没有简介。')}</p>${mt==='tv'?`<h2 class="season-title">选择要看的季</h2><div class="season-list">${seasons||'<div class="empty">暂无可选季</div>'}</div>`:''}<div class="detail-actions">${x.media_status?.code==='in_library'?`<button class="wash-action" onclick="openWashConfirm()">${mt==='tv'?'申请洗版第 '+S.season+' 季':'申请洗版'}</button>`:x.media_status?.code==='available'?`<button class="primary" ${mt==='tv'&&!S.season?'disabled':''} onclick="openConfirm()">${mt==='tv'?(S.season?'求第 '+S.season+' 季':'先选一季'):'加入求片'}</button>`:`<button class="primary" ${mt==='tv'&&!S.season?'disabled':''} onclick="wishDetail(this)">加入许愿池</button>`}<button class="watch-action" onclick="toggleWatchlist(this)">${x.in_watchlist?'取消想看':'加入想看'}</button><button class="share" onclick="shareDetail()">分享</button></div>${mt==='tv'?'<p class="meta">剧集想看按整部作品提醒，不区分季。</p>':''}</div></section>`,S.detailFrom);scheduleChromeDynamics()}
async function toggleWatchlist(button){if(button.disabled)return;button.disabled=true;const x=S.detail,adding=!x.in_watchlist;try{await api('/api/miniapp/v1/watchlist',{method:adding?'POST':'DELETE',body:JSON.stringify({tmdb_id:id(x),type:x.type})});x.in_watchlist=adding;if(adding){const item={tmdb_id:id(x),type:x.type,title:x.title,year:x.year,poster_path:x.poster_path};S.watchlist=[item,...S.watchlist.filter(y=>!(id(y)===id(x)&&type(y)===x.type))]}else S.watchlist=S.watchlist.filter(y=>!(id(y)===id(x)&&type(y)===x.type));button.textContent=adding?'取消想看':'加入想看';tg?.HapticFeedback?.notificationOccurred?.('success');toast(adding?'已加入想看，入库后会提醒你':'已取消想看')}catch(e){toast(e.message||'操作失败')}finally{button.disabled=false}}

function shareDetail(){const x=S.detail,kind=x.type==='tv'?'t':'m',season=x.type==='tv'?S.season:0,payload=`yh_${kind}_${id(x)}_${season}`,shareURL='https://t.me/share/url?url='+encodeURIComponent(`https://t.me/yunhaiqp_bot?start=${payload}`)+'&text='+encodeURIComponent(`云海影视 · ${x.title}${season?' 第'+season+'季':''}`);tg?.HapticFeedback?.impactOccurred?.('light');if(tg?.openTelegramLink)tg.openTelegramLink(shareURL);else window.open(shareURL,'_blank')}
function nativeBack(){if(document.getElementById('confirm')){if(D.dismissible)closeConfirm(D.seq);return}if(S.detailVisible){backDetail();return}if(['wishes','issues','adventure'].includes(S.view))goMe()}
function showNativeBack(){tg?.BackButton?.offClick(nativeBack);tg?.BackButton?.onClick(nativeBack);tg?.BackButton?.show()}
function syncNativeBack(){if(S.detailVisible||document.getElementById('confirm')||['wishes','issues','adventure'].includes(S.view))showNativeBack();else{tg?.BackButton?.offClick(nativeBack);tg?.BackButton?.hide()}}
function backDetail(){S.detailSeq++;S.detailVisible=false;S.view=S.detailFrom;syncNativeBack();render();requestAnimationFrame(()=>window.scrollTo(0,S.scroll[S.view]||0))}
function selectSeason(n){S.season=n;S.detail.media_status=S.detail.seasons?.find(s=>s.number===n)?.status||{code:'unknown',text:'暂时无法确认'};showDetail()}
function openWashConfirm(){const x=S.detail,season=x.type==='tv'?S.season:0;openDialog(`<div class="kicker">确认洗版</div><h2 id="dialog-title">${esc(x.title)}</h2><div class="summary"><div><span>目标</span><b>${season?'第 '+season+' 季':'整部电影'}</b></div><div><span>求片额度</span><b>不扣额度</b></div><div><span>当前版本</span><b>验证新版本前保留</b></div><div><span>提交后</span><b>进入审核</b></div></div><p class="detail-copy">洗版会寻找更合适的版本。只有确认新版本可用后才会进入清理流程。</p><div class="actions"><button class="secondary" onclick="closeConfirm()">再看看</button><button class="primary" style="margin:0" onclick="requestWash(this)">确认洗版</button></div>`,{initialFocus:'.secondary'})}
async function requestWash(button){if(button.disabled)return;const ctx=dialogContext();if(!ctx)return;const x=S.detail,payload={tmdb_id:id(x),type:x.type,season:x.type==='tv'?S.season:0,title:x.title,year:String(x.year||''),poster_path:x.poster_path||''};button.disabled=true;button.textContent='正在提交…';setDialogBusy(ctx.seq,true);try{await api('/api/miniapp/v1/wash',{method:'POST',signal:ctx.signal,body:JSON.stringify(payload)});if(!isCurrentDialog(ctx.seq))return;closeConfirm(ctx.seq);tg?.HapticFeedback?.notificationOccurred?.('success');toast('洗版工单已提交，当前版本会先保留');S.me=null}catch(e){if(e?.name==='AbortError'||!isCurrentDialog(ctx.seq))return;setDialogBusy(ctx.seq,false);button.disabled=false;button.textContent='确认洗版';toast(e.message||'洗版提交失败')}}
function openConfirm(){const x=S.detail,season=x.type==='tv'?S.season:0,q=x.quota||{},limit=x.type==='tv'?q.tv_limit:q.movie_limit,used=x.type==='tv'?q.tv_used:q.movie_used,remain=limit===-1?'不限':Math.max(0,(limit||0)-(used||0));openDialog(`<div class="kicker">确认求片</div><h2 id="dialog-title">${esc(x.title)}</h2><div class="summary"><div><span>类型</span><b>${x.type==='tv'?'剧集':'电影'}</b></div>${season?`<div><span>目标</span><b>第 ${season} 季</b></div>`:''}<div><span>今日剩余</span><b>${remain}</b></div><div><span>提交后</span><b>进入审核</b></div></div><div class="actions"><button class="secondary" onclick="closeConfirm()">再看看</button><button class="primary" style="margin:0" onclick="requestMedia()">确认求片</button></div>`,{initialFocus:'.secondary'})}
function closeConfirm(expectedSeq=0){const dialog=document.getElementById('confirm');if(expectedSeq&&Number(dialog?.dataset.dialogSeq)!==expectedSeq)return;const restore=D.returnFocus;D.returnFocus=null;D.controller?.abort();D.controller=null;dialog?.remove();D.dismissible=true;D.seq++;syncNativeBack();requestAnimationFrame(()=>{if(restore?.isConnected){try{restore.focus({preventScroll:true})}catch{restore.focus()}}})}
async function requestMedia(){if(S.submitting)return;const ctx=dialogContext();if(!ctx)return;S.submitting=true;const x=S.detail,season=x.type==='tv'?S.season:0,button=ctx.dialog.querySelector('.primary');if(button){button.disabled=true;button.textContent='正在提交…'}setDialogBusy(ctx.seq,true);try{const d=await api('/api/miniapp/v1/request',{method:'POST',signal:ctx.signal,body:JSON.stringify({tmdb_id:id(x),type:x.type,season})});if(!isCurrentDialog(ctx.seq))return;const messages={created:['已提交审核','进度会同步到“我的”'],duplicate_own:['已经求过了','可以在“我的”查看进度'],duplicate_other:['已经有人求过了','无需重复占用额度'],not_bound:['还没绑定账号','请先回 Bot 完成绑定'],quota_exceeded:['今天额度用完了','明天再来看看']},m=messages[d.status]||['提交完成','去“我的”查看进度'];tg?.HapticFeedback?.notificationOccurred?.(d.status==='created'?'success':'warning');openDialog(`<div class="result-mark">✓</div><h2 id="dialog-title">${m[0]}</h2><p class="detail-copy">${m[1]}</p><button class="primary" onclick="closeConfirm();goMe()">查看我的求片</button><button class="secondary" style="width:100%;padding:14px;margin-top:8px" onclick="closeConfirm()">留在详情</button>`,{initialFocus:'.primary'})}catch(e){if(e?.name==='AbortError'||!isCurrentDialog(ctx.seq))return;setDialogBusy(ctx.seq,false);tg?.HapticFeedback?.notificationOccurred?.('error');toast(e.message||'提交失败');if(button){button.disabled=false;button.textContent='确认求片'}}finally{S.submitting=false}}
function toast(s){const x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function readDeepLink(){const q=new URLSearchParams(location.search),raw=(tg?.initDataUnsafe?.start_param||'').trim();let mid=Number(q.get('tmdb_id'))||0,mt=q.get('type'),season=Number(q.get('season'))||0;if(raw){const p=raw.split('_');if(p.length===4&&p[0]==='yh'){mid=Number(p[2])||0;mt=p[1]==='t'?'tv':p[1]==='m'?'movie':'';season=Number(p[3])||0}}if(mid>0&&(mt==='movie'&&season===0||mt==='tv'&&season>0))return{mid,mt,season};return null}
render();loadHome();api('/api/miniapp/v1/dynamic').then(d=>{S.dynamic=d;localStorage.setItem('yunhai_dynamic_cache',JSON.stringify(d));if(S.view==='home')render()}).catch(()=>{});const deepLink=readDeepLink();if(deepLink)setTimeout(()=>openDetail(deepLink.mid,deepLink.mt,deepLink.season),0);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.view==='me'&&Date.now()-S.lastMeRefresh>15000)goMe(true)});
</script></body></html>
