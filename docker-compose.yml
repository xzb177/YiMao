services:
  yimao:
    build:
      context: .
      args:
        REVISION: ${YIMAO_REVISION:-unknown}
    image: ${YIMAO_IMAGE:-yimao:local}
    container_name: yimao
    restart: unless-stopped
    env_file:
      - ${YIMAO_ENV_FILE:-.env}
    environment:
      DATA_DIR: /app/data
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
    network_mode: "host"
    volumes:
      - yimao-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"

volumes:
  yimao-data:
    name: yimao-data