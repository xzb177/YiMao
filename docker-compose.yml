# ========================================
# YiMao · 云海求片助手
# Dual-Core Media Request Bot for Telegram
# ========================================
# Subscription: AI search → one-click subscribe via MoviePilot
# Adventure: 5-level hell challenge → priority request
# Deeply integrated with MoviePilot + Emby/Jellyfin
# ========================================
# 快速启动: cp .env.example .env && docker compose up -d
# Quick Start: cp .env.example .env && docker compose up -d
# ========================================

services:
  yimao:
    build: .
    container_name: yimao
    restart: unless-stopped

    environment:
      # === Telegram ===
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}

      # === Server ===
      - PORT=8080
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}

      # === Emby / Jellyfin ===
      - EMBY_URL=${EMBY_URL}
      - EMBY_API_KEY=${EMBY_API_KEY}

      # === MoviePilot ===
      - MOVIEPILOT_URL=${MOVIEPILOT_URL}
      - MOVIEPILOT_API_KEY=${MOVIEPILOT_API_KEY}

      # === TMDB ===
      - TMDB_API_KEY=${TMDB_API_KEY}

      # === AI (Adventure scenes) ===
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}

    network_mode: "host"

    volumes:
      - ./data:/app/data

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
