name: ci

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          files=$(find . -type f -name '*.go' -not -path './vendor/*')
          if [ -n "$files" ]; then
            unformatted=$(gofmt -l $files)
            if [ -n "$unformatted" ]; then
              echo "Unformatted files:"
              echo "$unformatted"
              exit 1
            fi
          fi

      - name: Secret scan
        run: |
          if grep -RInE 'TELEGRAM_BOT_TOKEN=[0-9]+:|ghp_[A-Za-z0-9]{20,}' . --exclude-dir=.git --exclude='*.patch'; then
            echo "Potential secret committed"
            exit 1
          fi

      - name: Deployment script syntax
        run: |
          sh -n scripts/preflight.sh manage.sh monitor.sh start.sh deploy.sh deploy-docker.sh
          bash -n scripts/ops.sh install.sh

      - name: Go vet
        run: go vet ./...

      - name: Lint new issues
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m --new-from-rev=HEAD~1

      - name: Callback completeness check
        run: go test ./internal/callback/... -run "TestAllMenuButton|TestKnownShort|TestValidActions" -v

      - name: Go test
        run: go test ./...

      - name: Go build
        run: go build ./...
